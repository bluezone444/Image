<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Pitch Diary</title>
<style>
:root{
  --bg:#f3f6f1; --surface:#ffffff; --surface-2:#eef2ec; --ink:#16201a; --muted:#5d6b62;
  --line:#d9e1d6; --brand:#1f8a4c; --brand-ink:#ffffff; --pitch:#2f9e5a; --pitch-2:#278a4e;
  --win:#1f8a4c; --draw:#8a8f2a; --loss:#c2413a; --gold:#e0a106; --xp:#f5c518;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1511; --surface:#17201a; --surface-2:#1e2a22; --ink:#e7eee9; --muted:#9aa9a0;
    --line:#2a3830; --brand:#3cc178; --brand-ink:#08130c; --pitch:#1d6b3e; --pitch-2:#185c35;
    --win:#3cc178; --draw:#c8cd52; --loss:#ef6b62; --gold:#f2c14e; --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1511; --surface:#17201a; --surface-2:#1e2a22; --ink:#e7eee9; --muted:#9aa9a0;
  --line:#2a3830; --brand:#3cc178; --brand-ink:#08130c; --pitch:#1d6b3e; --pitch-2:#185c35;
  --win:#3cc178; --draw:#c8cd52; --loss:#ef6b62; --gold:#f2c14e; --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding:0 16px 110px}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;color:#fff;
  background:repeating-linear-gradient(90deg,var(--pitch) 0 48px,var(--pitch-2) 48px 96px)}
.hero::before{content:"";position:absolute;inset:14px;border:2px solid rgba(255,255,255,.3);border-radius:4px;pointer-events:none}
.hero::after{content:"";position:absolute;left:50%;top:50%;width:130px;height:130px;margin:-65px 0 0 -65px;border:2px solid rgba(255,255,255,.3);border-radius:50%;pointer-events:none}
.hero-in{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:26px 16px 22px}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hero h1{margin:0;font-size:26px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.hero h1 .logo{display:inline-block;animation:spin 6s linear infinite}
.hero p{margin:2px 0 0;opacity:.9;font-size:14px}
.hero .actions{display:flex;gap:6px}
.ghost{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:999px;padding:6px 11px;cursor:pointer;font-size:13px;transition:background .15s,transform .15s}
.ghost:hover{background:rgba(255,255,255,.28)}
.ghost:active{transform:scale(.95)}
.fan{margin-top:16px;display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:10px 12px;backdrop-filter:blur(2px)}
.lv{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#14532d;font-weight:900;line-height:1.05;text-align:center;font-size:11px;box-shadow:0 0 0 3px rgba(245,197,24,.75)}
.lv b{display:block;font-size:18px}
.fan-main{flex:1;min-width:0}
.fan-title{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.fan-title b{font-size:15px}
.xpbar{height:10px;border-radius:999px;background:rgba(255,255,255,.22);overflow:hidden;margin-top:6px}
.xpbar span{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#ffe06b,var(--xp));transition:width 1s cubic-bezier(.2,.8,.2,1);position:relative}
.xpbar span::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);animation:shine 2.4s ease-in-out infinite}

/* ---------- tabs ---------- */
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:4px;padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{flex:1;background:none;border:0;padding:9px 4px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;transition:background .2s,color .2s}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tab .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:3px;border-radius:999px;background:var(--brand);color:var(--brand-ink);font-size:11px;line-height:18px}
section.view{animation:fadeUp .3s ease both}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.section-title{font-size:13px;font-weight:700;color:var(--muted);margin:22px 0 8px;letter-spacing:.02em}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{padding:14px;animation:pop .4s ease both}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:24px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--muted)}
.wdl{padding:14px}
.bar{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--surface-2);margin:10px 0 8px;transform-origin:left;animation:growX .9s cubic-bezier(.2,.8,.2,1) both}
.bar span{display:block;height:100%}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:1px}
.form{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.chip{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;font-size:12px;font-weight:800;color:#fff;animation:pop .35s ease both}
.W{background:var(--win)} .D{background:var(--draw)} .L{background:var(--loss)} .N{background:var(--muted)}
.rank{padding:6px 14px}
.rank-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.rank-row:last-child{border-bottom:0}
.rank-row b{font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;align-items:end;height:140px;padding:14px 14px 0}
.mcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px;color:var(--muted)}
.mcol .b{width:100%;max-width:26px;border-radius:6px 6px 2px 2px;background:var(--brand);transform-origin:bottom;animation:growY .7s cubic-bezier(.2,.8,.2,1) both;min-height:2px}
.mcol .b.zero{background:var(--surface-2)}
.mcol .n{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.mlab{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;padding:4px 14px 12px;font-size:11px;color:var(--muted);text-align:center}
.goal{display:flex;gap:16px;align-items:center;padding:14px}
.ring{flex:none;position:relative;width:92px;height:92px}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:var(--surface-2)}
.ring .fg{stroke:var(--brand);stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:18px}
.goal-main{flex:1;min-width:0}
.goal-main input{width:80px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;text-align:center}

/* ---------- list ---------- */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar select,.toolbar input{flex:1;min-width:120px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.ticket{display:flex;overflow:hidden;margin-bottom:12px;cursor:pointer;width:100%;text-align:left;padding:0;animation:rise .4s cubic-bezier(.2,.8,.2,1) both;transition:transform .15s,box-shadow .15s}
.ticket:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.1)}
.ticket:active{transform:scale(.99)}
.ticket .stub{width:8px;flex:none}
.ticket .body{flex:1;padding:14px 16px;min-width:0}
.ticket .meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:10px 0 8px}
.team{display:flex;align-items:center;gap:7px;font-weight:700;font-size:16px;min-width:0}
.team.home{justify-content:flex-end}
.team .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team.mine .nm{text-decoration:underline;text-decoration-color:var(--brand);text-decoration-thickness:3px;text-underline-offset:4px}
.crest{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:900;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.goals{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.ticket .foot{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.ticket .memo{font-size:13px;margin-top:6px;color:var(--ink);opacity:.85;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ticket .thumb{width:92px;flex:none;object-fit:cover;border-left:1px dashed var(--line);align-self:stretch;height:auto}
.stars{color:var(--gold);letter-spacing:1px}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.empty .ball{font-size:46px;display:inline-block;animation:bounce 1.2s cubic-bezier(.3,0,.7,1) infinite}

/* ---------- achievements ---------- */
.ach-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.ach-head b{font-size:18px}
.ach-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ach{padding:14px 12px;text-align:center;animation:pop .4s ease both;position:relative;overflow:hidden}
.ach .ic{font-size:34px;line-height:1.1;display:inline-block}
.ach.on .ic{animation:wiggle 2.8s ease-in-out infinite}
.ach .nm{font-weight:800;font-size:14px;margin-top:6px}
.ach .ds{font-size:12px;color:var(--muted);margin-top:2px;min-height:36px}
.ach .pg{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.ach .pg span{display:block;height:100%;background:var(--brand);border-radius:999px;transform-origin:left;animation:growX .8s ease both}
.ach .pt{font-size:11px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.ach.off .ic{filter:grayscale(1);opacity:.35}
.ach.off .nm{color:var(--muted)}
.ach.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset,var(--shadow)}
.ach.on::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);animation:sweep 3.5s ease-in-out infinite}
.stamps{display:flex;flex-wrap:wrap;gap:8px;padding:14px}
.stamp{border:2px dashed var(--brand);color:var(--brand);border-radius:10px;padding:4px 10px;font-size:13px;font-weight:700;transform:rotate(-2deg);animation:stamp .45s cubic-bezier(.3,1.6,.6,1) both}
.stamp:nth-child(even){transform:rotate(2deg)}

/* ---------- form ---------- */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field label,.field .lbl{font-size:12px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 11px;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
.field textarea{min-height:96px;resize:vertical}
.board{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px}
.side{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:0}
.side input.tm{text-align:center;font-weight:700;background:var(--surface)}
.stepper{display:flex;align-items:center;justify-content:center;gap:8px}
.stepper button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:700;cursor:pointer;line-height:1;transition:transform .1s}
.stepper button:active{transform:scale(.88)}
.stepper output{min-width:44px;text-align:center;font-size:34px;font-weight:900;font-variant-numeric:tabular-nums}
.stepper output.bump{animation:bump .3s ease}
.vs{font-weight:900;color:var(--muted);font-size:13px}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600;transition:background .2s,color .2s}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.hint{font-size:12px;color:var(--muted)}
.hint b{color:var(--brand)}
.rate{display:flex;gap:4px}
.rate button{border:0;background:none;font-size:30px;cursor:pointer;color:var(--line);padding:0 2px;line-height:1;transition:color .15s}
.rate button.on{color:var(--gold)}
.rate button.pop{animation:pop .35s cubic-bezier(.3,1.8,.5,1)}
.photo-prev{margin-top:8px;max-width:100%;max-height:220px;border-radius:10px;display:none;animation:fadeUp .3s ease}
.btns{display:flex;gap:8px;padding:0 16px 16px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;transition:transform .1s,filter .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--brand);color:var(--brand-ink);flex:1}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sub{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--loss);border:1px solid var(--loss)}

.fab{position:fixed;right:20px;bottom:20px;z-index:10;width:60px;height:60px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);font-size:30px;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer;transition:transform .25s cubic-bezier(.3,1.6,.6,1)}
.fab:hover{transform:rotate(90deg) scale(1.06)}
.fab::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--brand);animation:ping 2.4s ease-out infinite}
.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,10px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:40;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- FX overlays ---------- */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.fx{position:fixed;inset:0;z-index:45;display:grid;place-items:center;background:rgba(5,15,9,.55);backdrop-filter:blur(3px);animation:fade .25s ease both;cursor:pointer;padding:16px}
.fx.out{animation:fadeOut .3s ease both}
.fx-card{text-align:center;color:#fff;animation:zoomIn .5s cubic-bezier(.3,1.5,.6,1) both}
.fx-card .big{font-size:clamp(40px,12vw,76px);font-weight:900;letter-spacing:-.02em;line-height:1;text-shadow:0 4px 24px rgba(0,0,0,.4)}
.fx-card .sub{margin-top:10px;font-size:17px;opacity:.95}
.fx-card .ball{font-size:56px;display:inline-block;animation:kick 1s cubic-bezier(.3,0,.4,1) both}
.fx-card .xp{display:inline-block;margin-top:14px;padding:6px 14px;border-radius:999px;background:var(--xp);color:#3a2a00;font-weight:900;animation:floatUp 1.2s .35s ease both}
.fx-card .lvl{display:inline-grid;place-items:center;width:120px;height:120px;border-radius:50%;background:#fff;color:#14532d;font-size:44px;font-weight:900;box-shadow:0 0 0 6px var(--xp),0 0 60px var(--xp);animation:spinIn .8s cubic-bezier(.3,1.4,.6,1) both;margin-bottom:14px}
.unlock{position:fixed;left:50%;top:16px;z-index:48;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:var(--surface);color:var(--ink);border:1px solid var(--gold);border-radius:16px;padding:10px 16px 10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:dropIn .55s cubic-bezier(.3,1.5,.6,1) both;width:max-content;max-width:calc(100% - 32px)}
.unlock.out{animation:liftOut .35s ease both}
.unlock .ic{font-size:30px;animation:wiggle .8s ease 2}
.unlock small{display:block;color:var(--gold);font-weight:800;font-size:11px;letter-spacing:.06em}
[hidden]{display:none!important}

/* ---------- keyframes ---------- */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shine{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes bump{50%{transform:scale(1.3)}}
@keyframes growX{from{transform:scaleX(0)}}
@keyframes growY{from{transform:scaleY(0)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-12deg)}90%{transform:rotate(10deg)}95%{transform:rotate(-6deg)}}
@keyframes sweep{0%,70%{left:-60%}100%{left:130%}}
@keyframes stamp{from{opacity:0;transform:scale(1.8) rotate(-12deg)}}
@keyframes ping{0%{transform:scale(1);opacity:.6}80%,100%{transform:scale(1.6);opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes zoomIn{from{opacity:0;transform:scale(.4)}}
@keyframes kick{0%{transform:translateX(-40vw) rotate(-540deg)}100%{transform:none}}
@keyframes floatUp{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:none}}
@keyframes spinIn{from{opacity:0;transform:scale(.2) rotate(-200deg)}}
@keyframes dropIn{from{opacity:0;transform:translate(-50%,-120%)}}
@keyframes liftOut{to{opacity:0;transform:translate(-50%,-120%)}}

@media (max-width:640px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .two{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .ach-grid{grid-template-columns:repeat(2,1fr)}
  .ticket .thumb{width:68px}
  .team{font-size:14px;gap:5px}
  .crest{width:24px;height:24px;font-size:11px}
  .goals{font-size:22px}
  .months{gap:3px}.mlab{gap:3px}
  .stepper output{font-size:28px;min-width:34px}
  .stepper button{width:32px;height:32px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-in">
    <div class="hero-top">
      <div>
        <h1><span class="logo">⚽</span> Pitch Diary</h1>
        <p>나만의 축구 직관 · 집관 일기</p>
      </div>
      <div class="actions">
        <button class="ghost" id="themeBtn" type="button">테마</button>
        <button class="ghost" id="exportBtn" type="button">백업</button>
        <button class="ghost" id="importBtn" type="button">복원</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
    </div>
    <div class="fan">
      <div class="lv">Lv<b id="lvNum">1</b></div>
      <div class="fan-main">
        <div class="fan-title"><b id="lvTitle">새내기 팬</b><span id="xpText">0 XP</span></div>
        <div class="xpbar"><span id="xpFill"></span></div>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="home" aria-selected="true">기록장</button>
    <button class="tab" role="tab" data-tab="stats" aria-selected="false">통계</button>
    <button class="tab" role="tab" data-tab="ach" aria-selected="false">업적<span class="cnt" id="achCnt">0</span></button>
    <button class="tab" role="tab" data-tab="write" aria-selected="false">경기 기록</button>
  </nav>

  <!-- 기록장 -->

<script>
(() => {
'use strict';
const KEY = 'pitch-diary.v1';
const THEME_KEY = 'pitch-diary.theme';
const GOAL_KEY = 'pitch-diary.goal';
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

const COMPS = ['K리그1','K리그2','코리아컵','AFC 챔피언스리그','A매치','프리미어리그','라리가','분데스리가','세리에A','리그1','UEFA 챔피언스리그','월드컵','친선경기','기타'];
const OVERSEAS = new Set(['프리미어리그','라리가','분데스리가','세리에A','리그1','UEFA 챔피언스리그']);
const TEAM_COLORS = {'FC서울':'#c8102e','울산 HD':'#1d4aa3','전북 현대':'#1b7f3a','포항 스틸러스':'#d0202e','수원 FC':'#0b3a82','강원 FC':'#f07b00','김천 상무':'#b0121f','대전 하나시티즌':'#6d2077','광주 FC':'#f2c100','제주 SK':'#ef6c00','대구 FC':'#2fa4e7','FC안양':'#5b2a86','수원 삼성':'#1f4ea1','부산 아이파크':'#d71920','인천 유나이티드':'#0d47a1','전남 드래곤즈':'#f5c400','성남 FC':'#222222','부천 FC':'#a6192e','대한민국':'#d6001c','토트넘':'#132257','맨체스터 시티':'#6cabdd','리버풀':'#c8102e','아스널':'#ef0107','바이에른 뮌헨':'#dc052d','파리 생제르맹':'#004170','레알 마드리드':'#febe10','바르셀로나':'#a50044'};
const TEAMS = Object.keys(TEAM_COLORS);
const STADIUMS = ['서울월드컵경기장','울산문수축구경기장','전주월드컵경기장','포항스틸야드','수원종합운동장','춘천송암스포츠타운','강릉종합운동장','김천종합운동장','대전월드컵경기장','광주축구전용구장','제주월드컵경기장','대구iM뱅크PARK','안양종합운동장','수원월드컵경기장','부산구덕운동장','인천축구전용경기장','광양축구전용구장','탄천종합운동장','부천종합운동장','고양종합운동장'];
const WEATHERS = ['☀️ 맑음','⛅ 구름','🌧️ 비','❄️ 눈','🌬️ 강풍','🏠 실내'];

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"'`]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'}[c]));

// ================= 보안: 입력 정규화 =================
// 저장소나 백업 파일에서 읽은 값은 신뢰하지 않는다. 모든 필드를 타입·길이·형식으로 다시 만든다.
const MAX_PHOTO = 1_500_000;           // data URL 최대 길이 (~1.1MB)
const MAX_IMPORT_BYTES = 30 * 1024 * 1024;
const MAX_MATCHES = 3000;
const PHOTO_RE = /^data:image\/(?:jpeg|png|webp);base64,[A-Za-z0-9+/]+={0,2}$/;
const ID_RE = /^[a-z0-9]{4,32}$/;
const str = (v, max) => (typeof v === 'string' ? v : '').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g, '').trim().slice(0, max);
const int = (v, lo, hi) => { const n = Math.trunc(Number(v)); return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : lo; };
function validDate(d){
  if (typeof d !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(d)) return false;
  const t = new Date(d + 'T00:00:00Z');
  return !isNaN(t) && t.toISOString().slice(0,10) === d && d >= '1900-01-01' && d <= '2100-12-31';
}
function newId(){
  const a = new Uint8Array(8); crypto.getRandomValues(a);
  return [...a].map(b => b.toString(16).padStart(2,'0')).join('');
}
function normalize(raw){
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return null;
  const homeTeam = str(raw.homeTeam, 40), awayTeam = str(raw.awayTeam, 40);
  if (!homeTeam || !awayTeam || !validDate(raw.date)) return null;
  let myTeam = str(raw.myTeam, 40);
  if (myTeam !== homeTeam && myTeam !== awayTeam) myTeam = '';
  const photo = typeof raw.photo === 'string' && raw.photo.length <= MAX_PHOTO && PHOTO_RE.test(raw.photo) ? raw.photo : '';
  return {
    id: typeof raw.id === 'string' && ID_RE.test(raw.id) ? raw.id : newId(),
    created: int(raw.created, 0, 8.64e15),
    date: raw.date,
    comp: str(raw.comp, 30) || '기타',
    type: raw.type === 'home' ? 'home' : 'stadium',
    homeTeam, awayTeam,
    homeScore: int(raw.homeScore, 0, 99), awayScore: int(raw.awayScore, 0, 99),
    myTeam,
    stadium: str(raw.stadium, 40), seat: str(raw.seat, 40), with: str(raw.with, 40),
    weather: WEATHERS.includes(raw.weather) ? raw.weather : '',
    mom: str(raw.mom, 30), scorers: str(raw.scorers, 120),
    rating: int(raw.rating, 0, 5),
    memo: str(raw.memo, 2000),
    photo,
  };
}
function normalizeAll(arr){
  const seen = new Set(), out = [];
  for (const r of Array.isArray(arr) ? arr.slice(0, MAX_MATCHES) : []){
    const m = normalize(r); if (!m) continue;
    if (seen.has(m.id)) m.id = newId();
    seen.add(m.id); out.push(m);
  }
  return out;
}

// ================= storage =================
function lsGet(k){ try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); return true; } catch { return false; } }
function load(){ try { return normalizeAll(JSON.parse(lsGet(KEY) || '[]')); } catch { return []; } }
let data = load();
function save(){
  if (lsSet(KEY, JSON.stringify(data))) return true;
  toast('저장하지 못했어요. 저장 공간이 부족하면 사진을 줄이거나 백업 후 정리해 주세요.');
  return false;
}

// ================= theme =================
function applyTheme(t){ if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
applyTheme(lsGet(THEME_KEY));
$('#themeBtn').onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  applyTheme(next); lsSet(THEME_KEY, next);
};

// ================= helpers =================
function resultOf(m){
  if (!m.myTeam) return 'N';
  const home = m.myTeam === m.homeTeam;
  const mine = home ? m.homeScore : m.awayScore, opp = home ? m.awayScore : m.homeScore;
  return mine > opp ? 'W' : mine < opp ? 'L' : 'D';
}
const RES_LABEL = {W:'승',D:'무',L:'패',N:'-'};
const RES_COLOR = {W:'var(--win)',D:'var(--draw)',L:'var(--loss)',N:'var(--muted)'};
const sortDesc = arr => [...arr].sort((a,b) => b.date.localeCompare(a.date) || b.created - a.created);
const sortAsc = arr => [...arr].sort((a,b) => a.date.localeCompare(b.date) || a.created - b.created);
const seasons = () => [...new Set(data.map(m => m.date.slice(0,4)))].sort().reverse();
function fmtDate(d){
  const dt = new Date(d + 'T00:00:00');
  return `${dt.getFullYear()}.${String(dt.getMonth()+1).padStart(2,'0')}.${String(dt.getDate()).padStart(2,'0')} (${'일월화수목금토'[dt.getDay()]})`;
}
function todayStr(){ const d = new Date(); return new Date(d - d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2400); }
function fillSeasonSelect(sel){
  const v = sel.value, list = seasons();
  sel.innerHTML = '<option value="">전체 시즌</option>' + list.map(s => `<option value="${esc(s)}">${esc(s)} 시즌</option>`).join('');
  sel.value = list.includes(v) ? v : '';
}
function crest(name){
  let bg = TEAM_COLORS[name];
  if (!bg){ let h = 0; for (const ch of name) h = (h * 31 + ch.codePointAt(0)) >>> 0; bg = `hsl(${h % 360} 55% 40%)`; }
  let fg = '#fff';
  if (bg[0] === '#'){ const n = parseInt(bg.slice(1), 16); const l = (0.299*(n>>16) + 0.587*((n>>8)&255) + 0.114*(n&255)) / 255; if (l > .62) fg = '#1a1a1a'; }
  const ini = [...name.replace(/^FC\s*/i, '')][0] || '?';
  return `<span class="crest" style="background:${bg};color:${fg}" aria-hidden="true">${esc(ini)}</span>`;
}
function countUp(root){
  root.querySelectorAll('[data-count]').forEach(el => {
    const to = Number(el.dataset.count), suf = el.dataset.suffix || '', dec = Number(el.dataset.dec || 0);
    if (RM || !Number.isFinite(to)){ el.textContent = to.toFixed(dec) + suf; return; }
    const t0 = performance.now(), dur = 700;
    const step = now => {
      const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      el.textContent = (to * e).toFixed(dec) + suf;
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

// ================= 게임: XP · 레벨 · 업적 =================
const TITLES = [[1,'새내기 팬'],[3,'단골 관중'],[5,'열혈 서포터'],[8,'울트라스'],[12,'원정 마스터'],[16,'살아있는 레전드']];
const xpForLevel = L => 50 * L * (L - 1);       // Lv1:0, Lv2:100, Lv3:300, Lv4:600 ...
function levelOf(xp){ let L = 1; while (xpForLevel(L + 1) <= xp) L++; return L; }
const titleOf = L => TITLES.filter(([l]) => L >= l).pop()[1];

function matchXp(m, firstVisit){
  let xp = m.type === 'stadium' ? 30 : 10;
  const r = resultOf(m);
  if (r === 'W') xp += 20; else if (r === 'D') xp += 8;
  if (m.memo.length >= 20) xp += 10;
  if (m.photo) xp += 5;
  if (m.rating) xp += 2;
  if (firstVisit) xp += 40;
  return xp;
}

function computeStats(list){
  const asc = sortAsc(list);
  const s = {n: asc.length, stadiumN:0, stadiumSet:new Set(), W:0, D:0, L:0, maxWin:0, maxLoss:0, curWin:0, curLoss:0,
    stadiumWins:0, rain:0, bigWin:0, fest:0, clean:0, nil:0, diary:0, photos:0, comps:new Set(), overseas:0, national:0, xp:0};
  for (const m of asc){
    const r = resultOf(m), tg = m.homeScore + m.awayScore;
    let first = false;
    if (m.type === 'stadium'){
      s.stadiumN++;
      if (m.stadium && !s.stadiumSet.has(m.stadium)){ s.stadiumSet.add(m.stadium); first = true; }
      if (r === 'W') s.stadiumWins++;
      if (m.weather === '🌧️ 비' || m.weather === '❄️ 눈') s.rain++;
    }
    if (r !== 'N'){
      s[r]++;
      if (r === 'W'){ s.curWin++; s.curLoss = 0; } else if (r === 'L'){ s.curLoss++; s.curWin = 0; } else { s.curWin = 0; s.curLoss = 0; }
      s.maxWin = Math.max(s.maxWin, s.curWin); s.maxLoss = Math.max(s.maxLoss, s.curLoss);
      const home = m.myTeam === m.homeTeam, gf = home ? m.homeScore : m.awayScore, ga = home ? m.awayScore : m.homeScore;
      if (r === 'W' && gf - ga >= 3) s.bigWin++;
      if (r === 'W' && ga === 0) s.clean++;
    }
    if (tg >= 6) s.fest++;
    if (tg === 0) s.nil++;
    if (m.memo.length >= 20) s.diary++;
    if (m.photo) s.photos++;
    s.comps.add(m.comp);
    if (OVERSEAS.has(m.comp)) s.overseas++;
    if (m.comp === 'A매치' || m.homeTeam === '대한민국' || m.awayTeam === '대한민국') s.national++;
    s.xp += matchXp(m, first);
  }
  return s;
}

const BADGES = [
  ['first','🥅','첫 휘슬','첫 경기를 기록', s => [s.n,1]],
  ['stad1','🏟️','첫 직관','경기장에서 첫 관람', s => [s.stadiumN,1]],

  ['st5','🗺️','도장깨기','경기장 5곳 방문', s => [s.stadiumSet.size,5]],
  ['st12','🧭','전국 원정러','경기장 12곳 방문', s => [s.stadiumSet.size,12]],
  ['w3','🔥','3연승','응원팀 3연승 관람', s => [s.maxWin,3]],
  ['w5','☄️','무적 5연승','응원팀 5연승 관람', s => [s.maxWin,5]],
  ['fairy','🧚','승리요정','직관 승리 10회', s => [s.stadiumWins,10]],
  ['loyal','💙','그래도 응원한다','3연패를 버텨냄', s => [s.maxLoss,3]],
  ['rain','☔','우중 혈투','비·눈 오는 날 직관', s => [s.rain,1]],

function gameState(list){

  return {s, xp: s.xp, level, unlocked};
}

function rankHtml(map, unit){
  const rows = [...map.entries()].sort((a,b) => b[1] - a[1]).slice(0,5);
  if (!rows.length) return `<div class="rank-row"><span style="color:var(--muted)">기록이 없어요</span></div>`;
  const medal = ['🥇','🥈','🥉'];
  return rows.map(([k,v],i) => `<div class="rank-row"><span>${medal[i] || (i+1) + '.'} ${esc(k)}</span><b>${v}${unit}</b></div>`).join('');
}
function readGoals(){ try { const g = JSON.parse(lsGet(GOAL_KEY) || '{}'); return g && typeof g === 'object' ? g : {}; } catch { return {}; } }
function renderGoal(){
  const year = todayStr().slice(0,4);
  const goals = readGoals(), goal = int(goals[year] ?? 15, 1, 365);
  const done = data.filter(m => m.type === 'stadium' && m.date.startsWith(year)).length;
  const p = Math.min(1, done / goal), C = 2 * Math.PI * 40;
  $('#goalCard').innerHTML = `
    <div class="ring"><svg width="92" height="92" viewBox="0 0 92 92"><circle class="bg" cx="46" cy="46" r="40"/><circle class="fg" id="ringFg" cx="46" cy="46" r="40" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg><div class="t">${Math.round(p*100)}%</div></div>
    <div class="goal-main">
      <b style="font-size:17px">${year}년 직관 ${done} / ${goal}경기</b>
      <div class="hint" style="margin:4px 0 8px">${done >= goal ? '🎉 목표 달성! 목표를 더 올려볼까요?' : `목표까지 <b>${goal - done}경기</b> 남았어요`}</div>
      <label class="hint">목표 경기 수 <input id="goalInput" type="number" min="1" max="365" value="${goal}"></label>
    </div>`;
  requestAnimationFrame(() => requestAnimationFrame(() => { const f = $('#ringFg'); if (f) f.style.strokeDashoffset = C * (1 - p); }));
  $('#goalInput').onchange = e => {
    const g = readGoals(); g[year] = int(e.target.value, 1, 365); lsSet(GOAL_KEY, JSON.stringify(g)); renderGoal();
  };
}
function renderStats(){
  fillSeasonSelect($('#sSeason'));
  const season = $('#sSeason').value;
  const ms = sortDesc(data).filter(m => !season || m.date.startsWith(season));
  const stadiumN = ms.filter(m => m.type === 'stadium').length;
  const withTeam = ms.filter(m => m.myTeam);
  const c = {W:0,D:0,L:0};
  let gf = 0, ga = 0;
  withTeam.forEach(m => {
    c[resultOf(m)]++;
    const home = m.myTeam === m.homeTeam;
    gf += home ? m.homeScore : m.awayScore; ga += home ? m.awayScore : m.homeScore;
  });
  const decided = c.W + c.D + c.L, points = c.W * 3 + c.D;
  const totalGoals = ms.reduce((s,m) => s + m.homeScore + m.awayScore, 0);
  const rated = ms.filter(m => m.rating);
  const avgRating = rated.length ? (rated.reduce((s,m) => s + m.rating, 0) / rated.length).toFixed(1) : '-';
  const sW = withTeam.filter(m => m.type === 'stadium'), hW = withTeam.filter(m => m.type === 'home');
  const wr = arr => arr.length ? Math.round(arr.filter(m => resultOf(m) === 'W').length / arr.length * 100) + '%' : '-';

  $('#statTiles').innerHTML = [
    ['관람 경기', `<span data-count="${ms.length}">0</span>`, `직관 ${stadiumN} · 집관 ${ms.length - stadiumN}`],
    ['승률', decided ? `<span data-count="${Math.round(c.W / decided * 100)}" data-suffix="%">0%</span>` : '-', `승점 ${points} · 경기당 ${decided ? (points/decided).toFixed(2) : '0'}`],
    ['내 팀 득실', decided ? `${gf}:${ga}` : '-', `득실차 ${gf - ga > 0 ? '+' : ''}${gf - ga}`],
    ['본 골', `<span data-count="${totalGoals}">0</span>`, `경기당 ${ms.length ? (totalGoals/ms.length).toFixed(1) : 0}골 · 만족도 ${avgRating}`],
  ].map(([k,v,s],i) => `<div class="card stat" style="animation-delay:${i*60}ms"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join('');
  countUp($('#statTiles'));

  renderGoal();

  let streak = '';
  if (withTeam.length){
    const first = resultOf(withTeam[0]); let n = 0;
    for (const m of withTeam){ if (resultOf(m) === first) n++; else break; }
    streak = `현재 <b>${n}경기 연속 ${RES_LABEL[first]}</b>`;
  }
  const pct = k => decided ? (c[k] / decided * 100) : 0;
  $('#wdl').innerHTML = decided ? `
    <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b style="font-size:18px">${c.W}승 ${c.D}무 ${c.L}패</b><span style="color:var(--muted);font-size:13px">${streak}</span></div>
    <div class="bar"><span style="width:${pct('W')}%;background:var(--win)"></span><span style="width:${pct('D')}%;background:var(--draw)"></span><span style="width:${pct('L')}%;background:var(--loss)"></span></div>
    <div class="legend"><span><i class="dot W"></i>승 ${Math.round(pct('W'))}%</span><span><i class="dot D"></i>무 ${Math.round(pct('D'))}%</span><span><i class="dot L"></i>패 ${Math.round(pct('L'))}%</span></div>
    <div class="hint" style="margin-top:8px">🧚 승리요정 지수 — 직관 승률 <b>${wr(sW)}</b> · 집관 승률 <b>${wr(hW)}</b></div>
    <div class="section-title" style="margin:14px 0 4px">최근 폼 (최신 → 과거)</div>
    <div class="form">${withTeam.slice(0,10).map((m,i) => `<span class="chip ${resultOf(m)}" style="animation-delay:${i*50}ms" title="${esc(m.homeTeam)} ${m.homeScore}:${m.awayScore} ${esc(m.awayTeam)}">${RES_LABEL[resultOf(m)]}</span>`).join('')}</div>
  ` : `<span style="color:var(--muted)">응원팀을 지정한 경기가 아직 없어요.</span>`;

  // 월별 차트
  const year = season || seasons()[0] || todayStr().slice(0,4);
  const counts = Array(12).fill(0);
  data.forEach(m => { if (m.date.startsWith(year)) counts[Number(m.date.slice(5,7)) - 1]++; });
  const max = Math.max(1, ...counts);
  $('#monthTitle').textContent = `${year}년 월별 관람`;
  $('#months').innerHTML = `<div class="months">${counts.map((n,i) => `<div class="mcol"><span class="n">${n || ''}</span><span class="b ${n ? '' : 'zero'}" style="height:${n / max * 100}%;animation-delay:${i*40}ms"></span></div>`).join('')}</div>
    <div class="mlab">${counts.map((_,i) => `<span>${i+1}</span>`).join('')}</div>`;

  const st = new Map(), op = new Map(), mo = new Map();
  ms.forEach(m => {
    if (m.type === 'stadium' && m.stadium) st.set(m.stadium, (st.get(m.stadium) || 0) + 1);
    if (m.myTeam){ const o = m.myTeam === m.homeTeam ? m.awayTeam : m.homeTeam; op.set(o, (op.get(o) || 0) + 1); }
    if (m.mom) mo.set(m.mom, (mo.get(m.mom) || 0) + 1);
  });
  $('#rankStadium').innerHTML = rankHtml(st, '회');
  $('#rankOpp').innerHTML = rankHtml(op, '경기');
  $('#rankMom').innerHTML = rankHtml(mo, '회');
}

$('#photo').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  if (!/^image\/(jpeg|png|webp)$/.test(f.type)){ toast('JPG, PNG, WEBP 이미지만 올릴 수 있어요.'); e.target.value = ''; return; }
  if (f.size > 25 * 1024 * 1024){ toast('25MB 이하 이미지만 올릴 수 있어요.'); e.target.value = ''; return; }
  const img = new Image(), url = URL.createObjectURL(f);
  img.onload = () => {
    // 캔버스로 다시 그려 저장: 크기를 줄이고 EXIF(위치 정보 등) 메타데이터를 제거한다.
    const max = 900, s = Math.min(1, max / Math.max(img.width, img.height));
    const cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(img.width * s)); cv.height = Math.max(1, Math.round(img.height * s));
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    let q = .72, out = cv.toDataURL('image/jpeg', q);
    while (out.length > MAX_PHOTO && q > .3){ q -= .12; out = cv.toDataURL('image/jpeg', q); }
    curPhoto = out.length <= MAX_PHOTO ? out : '';
    $('#photoPrev').src = curPhoto; $('#photoPrev').style.display = curPhoto ? 'block' : 'none';
    URL.revokeObjectURL(url); updateXpPreview();
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('이미지를 읽을 수 없어요.'); };
  img.src = url;
};

$('#form').onsubmit = async e => {

  if (!validDate(raw.date)){ toast('날짜를 확인해 주세요.'); return; }
  const prev = editingId ? data.find(x => x.id === editingId) : null;
  if (prev) raw.created = prev.created;
  const m = normalize(raw);
  const before = gameState(data), backup = data;
  data = prev ? data.map(x => x.id === m.id ? m : x) : [...data, m];
  if (!save()){ data = backup; return; }
  const after = gameState(data);
  renderHero(after);
  showTab('home');
  await celebrate(m, before, after, !prev);
};

const wait = ms => new Promise(r => setTimeout(r, ms));
function overlay(html, ms){
  return new Promise(res => {
    const el = document.createElement('div'); el.className = 'fx'; el.innerHTML = `<div class="fx-card">${html}</div>`;
    document.body.appendChild(el);
    let done = false;
    const close = () => { if (done) return; done = true; el.classList.add('out'); setTimeout(() => { el.remove(); res(); }, RM ? 0 : 280); };
    el.onclick = close; setTimeout(close, RM ? Math.min(ms, 1200) : ms);
  });
}
function unlockToast(b){
  return new Promise(res => {
    const el = document.createElement('div'); el.className = 'unlock'; el.setAttribute('role','status');
    el.innerHTML = `<span class="ic">${b[1]}</span><span><small>업적 달성!</small><b>${esc(b[2])}</b><br><span class="hint">${esc(b[3])}</span></span>`;
    document.body.appendChild(el);
    setTimeout(() => { el.classList.add('out'); setTimeout(() => { el.remove(); res(); }, RM ? 0 : 330); }, 2200);
  });
}
function confetti(colors){
  if (RM) return;
  const cv = $('#confetti'), ctx = cv.getContext('2d'), dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const ps = Array.from({length: 150}, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * 80, y: innerHeight * .45,
    vx: (Math.random() - .5) * 14, vy: -Math.random() * 15 - 5, g: .38 + Math.random() * .12,
    w: 6 + Math.random() * 6, h: 8 + Math.random() * 8, r: Math.random() * 6, vr: (Math.random() - .5) * .4,
    c: colors[Math.floor(Math.random() * colors.length)], ball: Math.random() < .06,
  }));
  const t0 = performance.now();
  const tick = now => {
    const t = now - t0; ctx.clearRect(0, 0, innerWidth, innerHeight);
    ctx.globalAlpha = Math.max(0, 1 - Math.max(0, t - 1800) / 700);
    for (const p of ps){
      p.vy += p.g; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      if (p.ball){ ctx.font = '18px sans-serif'; ctx.fillText('⚽', -9, 6); }
      else { ctx.fillStyle = p.c; ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h * Math.abs(Math.cos(p.r * 2))); }
      ctx.restore();
    }
    if (t < 2500) requestAnimationFrame(tick); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  };
  requestAnimationFrame(tick);
}
async function celebrate(m, before, after, isNew){
  const r = resultOf(m), gain = after.xp - before.xp;
  const xpPill = gain > 0 ? `<div class="xp">+${gain} XP</div>` : '';
  const line = `${esc(m.homeTeam)} ${m.homeScore} : ${m.awayScore} ${esc(m.awayTeam)}`;
  if (isNew){
    if (r === 'W'){
      confetti([TEAM_COLORS[m.myTeam] || '#3cc178', '#ffffff', '#f5c518', '#3cc178']);
      await overlay(`<div class="ball">⚽</div><div class="big">GOAL! 승리!</div><div class="sub">${line}</div>${xpPill}`, 2300);
    } else if (r === 'D'){
      await overlay(`<div class="ball">🤝</div><div class="big">무승부</div><div class="sub">${line}</div>${xpPill}`, 1900);
    } else if (r === 'L'){
      await overlay(`<div class="ball">😢</div><div class="big">아쉬운 패배</div><div class="sub">${line}<br>다음 경기엔 이긴다!</div>${xpPill}`, 2000);
    } else {
      await overlay(`<div class="ball">📒</div><div class="big">기록 완료</div><div class="sub">${line}</div>${xpPill}`, 1600);
    }
  } else toast('수정했어요');
  if (after.level > before.level){
    confetti(['#f5c518','#ffe06b','#ffffff','#3cc178']);
    await overlay(`<div class="lvl">${after.level}</div><div class="big">LEVEL UP!</div><div class="sub">${titleOf(after.level) !== titleOf(before.level) ? `🎖️ 새 칭호 획득 — <b>${esc(titleOf(after.level))}</b>` : `Lv.${after.level} ${esc(titleOf(after.level))}`}</div>`, 2400);
  }
  for (const b of BADGES.filter(b => after.unlocked.has(b[0]) && !before.unlocked.has(b[0]))){
    await unlockToast(b); await wait(120);
  }
}

// ================= backup =================
$('#exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify({app:'pitch-diary', version:1, matches:data}, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `pitch-diary-${todayStr()}.json`; a.rel = 'noopener'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$('#importBtn').onclick = () => $('#importFile').click();
$('#importFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  if (f.size > MAX_IMPORT_BYTES){ toast('백업 파일이 너무 커요 (30MB 이하).'); return; }
  try {
    const j = JSON.parse(await f.text());
    const arr = Array.isArray(j) ? j : j && j.matches;
    if (!Array.isArray(arr)) throw new Error('format');
    const valid = normalizeAll(arr);
    const ids = new Set(data.map(m => m.id));
    const room = Math.max(0, MAX_MATCHES - data.length);
    const added = valid.filter(m => !ids.has(m.id)).slice(0, room);
    const skipped = arr.length - added.length;
    if (!added.length){ toast('새로 불러올 경기가 없어요.'); return; }
    if (!confirm(`${added.length}경기를 불러올까요?${skipped ? ` (중복·잘못된 항목 ${skipped}개는 건너뜀)` : ''}`)) return;
    const backup = data; data = [...data, ...added];
    if (!save()){ data = backup; return; }
    renderHero(gameState(data)); toast(`${added.length}경기를 불러왔어요`); showTab('home');
  } catch { toast('백업 파일을 읽을 수 없어요'); }
};

renderHero(gameState(data));
renderList();
})();
