<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; font-src 'self'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Pitch Career</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 레이아웃 컨셉: 야간 경기장 위에 떠 있는 세로형 게임 HUD — 상단 자원 바, 가운데 장면, 하단 도크 */
/* Pretendard (SIL Open Font License 1.1, fonts/LICENSE-Pretendard.txt) */
@font-face{font-family:"Pretendard Variable";src:url(fonts/PretendardVariable.woff2) format("woff2-variations"),url(fonts/PretendardVariable.woff2) format("woff2");font-weight:45 920;font-style:normal;font-display:swap}
@font-face{font-family:"Pretendard Display";src:url(fonts/Pretendard-ExtraBold.woff2) format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
:root{
  --night:#0a0f1f; --night-2:#101833; --panel:#141c39; --panel-2:#1c2650; --edge:#2a3672;
  --ink:#f2f4ff; --muted:#9aa5d1; --dim:#6b75a3;
  --gold:#ffc83d; --gold-d:#b98200; --hot:#ff4d6d; --hot-d:#a8203b; --cyan:#3dd6ff; --cyan-d:#157a99;
  --turf:#22c55e; --turf-d:#0f7a35; --up:#4ade80; --down:#ff6b81; --paper:#f6f0dc; --paper-ink:#2a2216;
  --f-display:"Pretendard Display","Pretendard Variable",-apple-system,"Apple SD Gothic Neo",sans-serif;
  --f-fun:"Pretendard Variable",-apple-system,"Apple SD Gothic Neo",sans-serif;
  --f-body:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
h1,h2,h3,h4,.disp{letter-spacing:-.01em}
body{letter-spacing:-.005em;background:var(--night);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent;cursor:pointer}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.disp{font-family:var(--f-display);font-weight:400;letter-spacing:.01em}

/* ---------- 배경: 조명탑 + 잔디 ---------- */
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;
  background:
    radial-gradient(60% 40% at 15% -5%,rgba(255,240,200,.18),transparent 70%),
    radial-gradient(60% 40% at 85% -5%,rgba(200,230,255,.16),transparent 70%),
    linear-gradient(180deg,#0a0f1f 0%,#0c1430 55%,#0b2a1c 78%,#0d3a22 100%)}
#bg::before{content:"";position:absolute;left:-20%;right:-20%;bottom:0;height:34%;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 60px,transparent 60px 120px);
  transform:perspective(500px) rotateX(55deg);transform-origin:bottom}
#bg::after{content:"";position:absolute;top:-30%;left:-40%;width:60%;height:160%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.05),transparent);animation:sweep 9s ease-in-out infinite}

.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 120px}
.screen{animation:fadeIn .2s ease both}
/* 화면 들어올 때: 패널이 아래에서 차례로 올라온다 (자기 애니메이션이 있는 요소는 그대로) */
:where(.screen:not(.still)) > :where(*){animation:rise .4s cubic-bezier(.2,.8,.2,1) backwards}
:where(.screen:not(.still)) > :where(:nth-child(2)){animation-delay:.045s}
:where(.screen:not(.still)) > :where(:nth-child(3)){animation-delay:.09s}
:where(.screen:not(.still)) > :where(:nth-child(4)){animation-delay:.135s}
:where(.screen:not(.still)) > :where(:nth-child(5)){animation-delay:.18s}
:where(.screen:not(.still)) > :where(:nth-child(6)){animation-delay:.22s}
:where(.screen:not(.still)) > :where(:nth-child(7)){animation-delay:.255s}
:where(.screen:not(.still)) > :where(:nth-child(n+8)){animation-delay:.285s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
/* 누르는 느낌: 살짝 눌렸다가 튕겨 돌아온다 */
:where(button){transition:transform .16s cubic-bezier(.3,1.5,.5,1)}
:where(button:not(:disabled):active){transform:scale(.955);transition-duration:.07s}
.screen.still{animation:none}
.panel{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:2px solid var(--edge);border-radius:18px;box-shadow:0 6px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.07)}
.pad{padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.muted{color:var(--muted)}
.small{font-size:12px}
.label{font-family:var(--f-display);font-size:13px;letter-spacing:.06em;color:var(--muted)}

/* ---------- 3D 버튼 ---------- */
.btn{--c:var(--gold);--cs:var(--gold-d);--ct:#231700;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 18px;
  background:var(--c);color:var(--ct);font-family:var(--f-display);font-size:18px;letter-spacing:.02em;box-shadow:0 5px 0 var(--cs),0 8px 18px rgba(0,0,0,.35);
  transition:transform .08s,box-shadow .08s,filter .15s;position:relative;top:0}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--cs),0 3px 8px rgba(0,0,0,.35)}
.btn:disabled{filter:grayscale(.8) brightness(.7);cursor:not-allowed;transform:none}
.btn.cyan{--c:var(--cyan);--cs:var(--cyan-d);--ct:#04202b}
.btn.hot{--c:var(--hot);--cs:var(--hot-d);--ct:#fff}
.btn.turf{--c:var(--turf);--cs:var(--turf-d);--ct:#03200d}
.btn.dark{--c:var(--panel-2);--cs:#0b112a;--ct:var(--ink);border:2px solid var(--edge)}
.btn.block{width:100%}
.btn.sm{font-size:15px;padding:10px 14px;border-radius:12px}

/* ---------- HUD ---------- */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(8,12,28,.88);backdrop-filter:blur(8px);border-bottom:2px solid var(--edge)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:#080c1c}
.hud-in{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;flex-direction:column;gap:8px}
.hud-me{display:flex;align-items:center;gap:10px}
.hud-me b{display:block;font-family:var(--f-display);font-size:17px;line-height:1.1}
.hud-me small{color:var(--muted);font-size:12px}
.ovr-badge{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-size:20px;color:#1b1300;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.tier-bronze{background:linear-gradient(135deg,#e2a46b,#9c5a2c)}
.tier-silver{background:linear-gradient(135deg,#f1f4fa,#9aa3b5)}
.tier-gold{background:linear-gradient(135deg,#ffe58a,#d19a00)}
.tier-icon{background:linear-gradient(135deg,#ffd6ff,#8f7bff,#4fd1ff);background-size:200% 200%;animation:holo 3s ease infinite;color:#1a0b3a}
.icon-btn{margin-left:auto;width:38px;height:38px;border-radius:12px;border:2px solid var(--edge);background:var(--panel);font-size:17px}
.hud-res{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.res{display:flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:4px 7px;min-width:0}
.res .ic{font-size:13px}
.res .bar{flex:1;height:6px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;min-width:14px}
.res .bar i{display:block;height:100%;border-radius:999px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.res b{font-family:var(--f-display);font-size:13px;font-weight:400;font-variant-numeric:tabular-nums}
.res.money b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 도크 ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(8,12,28,.94);backdrop-filter:blur(8px);border-top:2px solid var(--edge);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.dock-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.dock button{background:none;border:0;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--dim);font-family:var(--f-display);font-size:12px;position:relative}
.dock button .i{font-size:22px;filter:grayscale(.7);transition:transform .2s,filter .2s}
.dock button[aria-selected="true"]{color:var(--gold)}
.dock button[aria-selected="true"] .i{filter:none;transform:translateY(-3px) scale(1.15)}
.dock button[aria-selected="true"]::after{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
.dock button.pop .i{animation:dockPop .34s cubic-bezier(.3,1.5,.5,1) both}
.dock button.pop::after{animation:dockBar .26s cubic-bezier(.2,.8,.2,1) both}
.dock button:active .i{transform:scale(.9)}
@keyframes dockPop{0%{transform:translateY(4px) scale(.8)}60%{transform:translateY(-3px) scale(1.1)}}
@keyframes dockBar{from{transform:scaleX(0)}}

/* ---------- 엠블럼 ---------- */
.crest{flex:none;width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font-family:var(--f-display);font-size:14px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.4),0 3px 0 rgba(0,0,0,.35)}
.crest.lg{width:52px;height:52px;font-size:22px}
.crest.xl{width:72px;height:72px;font-size:30px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.45),0 5px 0 rgba(0,0,0,.4),0 0 30px rgba(255,255,255,.08)}

/* ---------- 타이틀 ---------- */
.title{min-height:calc(100vh - 40px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding-block:40px}
.logo{font-family:var(--f-display);font-size:clamp(54px,17vw,92px);line-height:.9;letter-spacing:-.01em;
  background:linear-gradient(180deg,#fff 10%,var(--gold) 60%,#ff9f1c);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 0 #6b3f00) drop-shadow(0 18px 30px rgba(0,0,0,.6));animation:logoIn .8s cubic-bezier(.3,1.5,.6,1) both}
.logo small{display:block;font-size:.32em;letter-spacing:.35em;-webkit-text-fill-color:var(--cyan);color:var(--cyan);margin-top:6px}
.title .ball{font-size:56px;animation:bounce 1.1s cubic-bezier(.3,0,.7,1) infinite}
.title .menu{display:flex;flex-direction:column;gap:14px;width:min(320px,100%)}
.title .tip{font-size:13px;color:var(--muted);max-width:320px;margin:0}
.title a{color:var(--muted);font-size:13px}

/* ---------- 생성 ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field input{background:#0b1128;border:2px solid var(--edge);border-radius:12px;padding:12px 14px;font-size:17px;font-weight:700}
.field input:focus{outline:none;border-color:var(--cyan)}
.pos-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pos{border:2px solid var(--edge);background:var(--panel);border-radius:14px;padding:12px 4px;text-align:center;transition:transform .15s,border-color .15s,background .15s}
.pos b{display:block;font-family:var(--f-display);font-weight:400;font-size:22px}
.pos small{color:var(--muted);font-size:11px}
.pos.on{border-color:var(--gold);background:linear-gradient(180deg,#3a2f0c,#211a06);transform:translateY(-3px)}
.club-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.club{border:2px solid var(--edge);background:var(--panel);border-radius:14px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:700;transition:transform .15s,border-color .15s;min-width:0}
.club span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.club.on{border-color:var(--gold);transform:translateY(-3px);box-shadow:0 0 0 3px rgba(255,200,61,.25)}
.mgr-card{display:flex;gap:12px;align-items:flex-start}
.mgr-face{flex:none;width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:32px;background:radial-gradient(circle at 30% 30%,#2e3a7a,#141c39);border:2px solid var(--edge)}
.mgr-card h4{margin:0;font-family:var(--f-display);font-weight:400;font-size:18px}
.mtype{display:inline-block;font-family:var(--f-display);font-size:12px;padding:2px 9px;border-radius:999px;background:rgba(61,214,255,.15);color:var(--cyan);margin-left:4px;vertical-align:2px}
.wealth{display:inline-block;font-size:11px;font-weight:900;padding:2px 8px;border-radius:999px;background:rgba(255,200,61,.14);color:var(--gold)}

/* ---------- 허브 ---------- */
.next{padding:14px 14px 18px;position:relative;overflow:hidden}
.next::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 90% at 50% 120%,rgba(34,197,94,.25),transparent 70%);pointer-events:none}
.next-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 8px;position:relative}
.tag{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--muted)}
.tag.gold{background:rgba(255,200,61,.15);color:var(--gold)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;margin-top:12px;position:relative}
.vs .side{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.vs .side b{font-family:var(--f-display);font-weight:400;font-size:16px;line-height:1.15}
.vs .side small{color:var(--muted);font-size:11px}
.vs-mid{font-family:var(--f-display);font-size:34px;color:var(--gold);text-shadow:0 4px 0 #6b3f00,0 0 24px rgba(255,200,61,.5);animation:pulse 1.8s ease-in-out infinite}
.row2{display:grid;grid-template-columns:1.25fr 1fr;gap:10px}
.mgr-mini{display:flex;align-items:center;gap:10px;padding:12px}
.mgr-mini .mgr-face{width:46px;height:46px;font-size:26px;border-radius:13px}
.mgr-mini b{display:block;font-family:var(--f-display);font-weight:400;font-size:15px;line-height:1.2}
.mgr-mini small{color:var(--muted);font-size:11px;display:block}
.mood{font-size:12px;font-weight:700}
.fortune{perspective:700px;border:0;background:none;padding:0;min-height:86px}
.f-inner{position:relative;width:100%;height:100%;min-height:86px;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.3,.5,1)}
.fortune.open .f-inner{transform:rotateY(180deg)}
.f-back,.f-front{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px solid var(--edge);padding:6px}
.f-back{background:repeating-linear-gradient(45deg,#2a1f5c 0 10px,#231a4d 10px 20px);font-size:28px;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.f-back small{font-family:var(--f-display);font-size:12px;color:var(--gold)}
.fortune:not(.open) .f-back{animation:wobble 2.6s ease-in-out infinite}
.f-front{transform:rotateY(180deg);background:linear-gradient(180deg,#2b2361,#181238);box-shadow:0 6px 0 rgba(0,0,0,.35)}
.f-front b{font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1}
.f-front small{font-size:11px;color:var(--muted);text-align:center;line-height:1.3}
.note{position:relative;background:var(--paper);color:var(--paper-ink);border-radius:6px 6px 14px 14px;padding:22px 16px 14px;box-shadow:0 6px 0 rgba(0,0,0,.35);transform:rotate(-.6deg)}
.note::before{content:"";position:absolute;top:-10px;left:50%;width:90px;height:22px;margin-left:-45px;border-radius:6px;background:linear-gradient(180deg,#c9ced9,#8d94a5);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.note-head{font-family:var(--f-display);font-size:14px;letter-spacing:.04em;color:#6b5a32}
.note p{margin:4px 0 0;font-weight:700;font-size:15px;line-height:1.55}
.note .hint{margin-top:8px;font-size:12px;color:#7a6a45;font-weight:400}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.act{--c1:#2a3672;--c2:#1a2350;border:0;border-radius:16px;padding:12px 4px 10px;background:linear-gradient(180deg,var(--c1),var(--c2));color:var(--ink);
  box-shadow:0 5px 0 rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.15);display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .08s,box-shadow .08s;animation:dealIn .45s cubic-bezier(.3,1.4,.6,1) both}
.act:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.45)}
.act:disabled{filter:grayscale(.7) brightness(.7);cursor:default}
.act .i{font-size:28px;line-height:1.1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
.act .n{font-family:var(--f-display);font-size:13px}
.act .d{font-size:10px;color:rgba(255,255,255,.7);line-height:1.2;text-align:center}
.act.t-sho{--c1:#d9485f;--c2:#8e1e33}.act.t-pas{--c1:#2f8fdd;--c2:#164f86}.act.t-dri{--c1:#9b5de5;--c2:#572a8f}.act.t-def{--c1:#4b5d7a;--c2:#27334a}
.act.t-phy{--c1:#e07a1f;--c2:#8a4207}.act.t-rest{--c1:#1fa37a;--c2:#0b5c43}.act.t-fan{--c1:#e0479e;--c2:#86195a}.act.t-talk{--c1:#c9a227;--c2:#6f5608}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.switch{position:relative;width:48px;height:28px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:999px;background:#0b1128;border:2px solid var(--edge);transition:background .2s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.switch input:checked + span{background:var(--turf-d)}
.switch input:checked + span::after{transform:translateX(20px);background:#fff}
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.strip div{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:8px 4px;text-align:center;min-width:0}
.strip b{display:block;font-family:var(--f-display);font-weight:400;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip span{font-size:11px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font-size:12px;font-weight:900;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.08);animation:pop .4s cubic-bezier(.3,1.6,.6,1) both}
.chip.up{color:var(--up);background:rgba(74,222,128,.14)}
.chip.down{color:var(--down);background:rgba(255,107,129,.14)}
.trait{display:inline-flex;gap:4px;align-items:center;font-size:12px;font-weight:900;padding:4px 10px;border-radius:999px;border:1px solid var(--gold);color:var(--gold);background:rgba(255,200,61,.08)}
.injury{background:rgba(255,77,109,.12);border:2px solid var(--hot);border-radius:14px;padding:10px 12px;font-weight:700;font-size:14px}

/* ---------- 선수 카드 ---------- */
.pcard{position:relative;margin:0 auto;width:min(270px,100%);aspect-ratio:3/4;max-width:100%;padding:18px 18px 30px;color:#1b1300;
  clip-path:polygon(10% 0,90% 0,100% 7%,100% 86%,50% 100%,0 86%,0 7%);overflow:hidden;animation:cardIn .7s cubic-bezier(.3,1.4,.6,1) both}
.pcard::after{content:"";position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);animation:shine 3.5s ease-in-out infinite;pointer-events:none}
.pcard .top{display:flex;justify-content:space-between;align-items:flex-start}
.pcard .ovr{font-family:var(--f-display);font-size:52px;line-height:.9}
.pcard .pp{font-family:var(--f-display);font-size:18px;display:block}
.pcard .avatar .ico{width:84px;height:84px;opacity:.75}
.pcard .avatar{font-size:76px;text-align:center;line-height:1.1;margin-top:-6px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.2))}
.pcard .nm{font-family:var(--f-display);font-size:24px;text-align:center;border-bottom:2px solid rgba(0,0,0,.2);padding-bottom:4px;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .st{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;font-family:var(--f-display);font-size:16px}
.pcard .st span{display:flex;justify-content:space-between}
.pcard .st small{font-family:var(--f-body);font-weight:900;font-size:12px;opacity:.75}
.statbars{display:flex;flex-direction:column;gap:10px}
.sb{display:grid;grid-template-columns:58px 1fr 34px;align-items:center;gap:10px;font-size:13px;font-weight:700}
.sb .t{height:12px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.sb .t i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--cyan),var(--turf));transform-origin:left;animation:growX .9s cubic-bezier(.2,.8,.2,1) both}
.sb b{font-family:var(--f-display);font-weight:400;font-size:17px;text-align:right}
.tbl{overflow-x:auto}
table.hist{width:100%;border-collapse:collapse;font-size:13px;min-width:460px}
table.hist th,table.hist td{padding:9px 6px;border-bottom:1px solid var(--edge);text-align:center;font-variant-numeric:tabular-nums}
table.hist th{color:var(--muted);font-weight:700;font-size:12px}
.news{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.news li{background:var(--paper);color:var(--paper-ink);border-radius:8px;padding:10px 12px;font-weight:700;font-size:14px;box-shadow:0 4px 0 rgba(0,0,0,.35);animation:dealIn .4s ease both}
.news li small{display:block;font-weight:400;color:#7a6a45;font-size:11px}

/* ---------- 경기 ---------- */
.stadium{position:relative;border-radius:20px;overflow:hidden;border:2px solid var(--edge);box-shadow:0 6px 0 rgba(0,0,0,.4);
  background:radial-gradient(80% 60% at 50% 0%,rgba(255,255,255,.12),transparent 60%),repeating-linear-gradient(90deg,#14883f 0 34px,#117536 34px 68px)}
.stadium::before{content:"";position:absolute;inset:10px;border:2px solid rgba(255,255,255,.35);border-radius:6px;pointer-events:none}
.stadium::after{content:"";position:absolute;left:50%;top:50%;width:90px;height:90px;margin:-45px 0 0 -45px;border:2px solid rgba(255,255,255,.35);border-radius:50%;pointer-events:none}
.led{position:relative;z-index:1;margin:18px 14px 0;background:#04060f;border:3px solid #1b2240;border-radius:14px;padding:12px 10px;box-shadow:inset 0 0 20px rgba(0,0,0,.8),0 6px 0 rgba(0,0,0,.4)}
.led-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.led .tm{display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--f-display);font-size:13px;min-width:0;text-align:center;line-height:1.15}
.led-sc{font-family:var(--f-display);font-size:48px;color:#ffb627;text-shadow:0 0 12px rgba(255,182,39,.7),0 0 2px #fff;letter-spacing:.06em;font-variant-numeric:tabular-nums;text-align:center}
.led-sc.bump{animation:bump .5s ease}
.led-min{display:block;width:max-content;margin:4px auto 0;font-family:var(--f-display);color:#ff4d4d;text-shadow:0 0 10px rgba(255,77,77,.7);font-size:16px}
.mom{position:relative;z-index:1;margin:12px 14px 0;height:10px;border-radius:999px;overflow:hidden;display:flex;background:#000;border:2px solid rgba(0,0,0,.5)}
.mom i{display:block;height:100%;transition:width .35s ease}
.myrole{position:relative;z-index:1;text-align:center;font-family:var(--f-display);font-size:14px;padding:10px 12px 16px;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.feed{list-style:none;margin:0;padding:6px 14px;max-height:340px;overflow-y:auto}
.feed li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--edge);font-size:14px;animation:slideIn .35s cubic-bezier(.2,.8,.2,1) both}
.feed li:last-child{border-bottom:0}
.feed .m{flex:none;width:34px;font-family:var(--f-display);color:var(--dim);font-variant-numeric:tabular-nums}
.feed li.me{color:var(--gold);font-weight:900}
.feed li.opp{color:var(--down)}
.feed li.fl{color:var(--muted);font-size:13px}
.feed li.big{color:var(--cyan);font-weight:900}
.res-card{text-align:center;padding:18px 16px;animation:pop .5s cubic-bezier(.3,1.5,.6,1) both}
.rating{display:inline-grid;place-items:center;width:96px;height:96px;border-radius:24px;font-family:var(--f-display);font-size:42px;box-shadow:0 6px 0 rgba(0,0,0,.4);margin:6px 0}
.flashfx{position:fixed;inset:0;z-index:45;display:grid;place-items:center;pointer-events:none;overflow:hidden}
.flashfx::before,.flashfx::after{content:"";position:absolute;left:50%;top:50%;width:min(92vw,460px);height:min(92vw,460px);margin:calc(min(92vw,460px) / -2) 0 0 calc(min(92vw,460px) / -2);border-radius:50%;pointer-events:none}
.flashfx::before{background:radial-gradient(closest-side,rgba(255,200,61,.5),rgba(255,200,61,.14) 55%,transparent 72%);animation:flashGlow 1.3s cubic-bezier(.2,.8,.2,1) both}
.flashfx::after{border:6px solid rgba(255,255,255,.75);animation:flashRing .7s cubic-bezier(.1,.7,.3,1) both}
.flashfx b{position:relative;z-index:1;white-space:nowrap;will-change:transform,opacity}
@keyframes flashGlow{0%{opacity:0;transform:scale(.3)}18%{opacity:1;transform:scale(1)}70%{opacity:.8;transform:scale(1.08)}100%{opacity:0;transform:scale(1.3)}}
@keyframes flashRing{0%{opacity:.9;transform:scale(.25)}100%{opacity:0;transform:scale(1.25)}}
.flashfx b{font-family:var(--f-display);font-weight:400;font-size:clamp(60px,18vw,120px);color:#fff;-webkit-text-stroke:3px #6b3f00;text-shadow:0 8px 0 #6b3f00,0 0 40px rgba(255,200,61,.8);animation:goal 1.3s linear both}

/* ---------- 모달 ---------- */
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(3,6,16,.72);backdrop-filter:blur(4px);animation:fadeIn .2s ease both;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.modal.out{animation:fadeOut .22s ease both;pointer-events:none}
.modal.out .modal-card{animation:modalOut .22s cubic-bezier(.5,0,.8,.4) both}
@keyframes modalOut{to{transform:scale(.94) translateY(8px)}}
.modal-card{width:min(420px,100%);background:linear-gradient(180deg,var(--panel-2),var(--panel));border:3px solid var(--gold);border-radius:22px;padding:20px 18px;text-align:center;
  box-shadow:0 10px 0 rgba(0,0,0,.45),0 0 60px rgba(255,200,61,.2);animation:zoomIn .45s cubic-bezier(.3,1.5,.6,1) both}
.modal-card .eyebrow{font-family:var(--f-display);color:var(--gold);letter-spacing:.12em;font-size:13px}
.modal-card .big{font-size:58px;line-height:1.15;animation:wobble 2s ease-in-out infinite}
.modal-card h3{margin:2px 0 6px;font-family:var(--f-display);font-weight:400;font-size:24px}
.modal-card p{margin:0 0 14px;color:var(--muted);min-height:1.5em}
.choice-list{display:flex;flex-direction:column;gap:10px}
.outcome{background:#0b1128;border:2px dashed var(--edge);border-radius:14px;padding:12px;margin:4px 0 12px;font-weight:700;animation:pop .45s ease both}
.suspense{font-family:var(--f-display);font-size:24px;letter-spacing:.2em;color:var(--gold);margin:8px 0 14px;text-align:center}

/* PK */
.goalbox{position:relative;height:160px;margin:6px 0 14px;border:6px solid #fff;border-bottom:0;border-radius:6px 6px 0 0;overflow:hidden;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.12) 0 2px,transparent 2px 16px),repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 2px,transparent 2px 16px),#0d3a22}
.goalbox .keeper{position:absolute;bottom:6px;left:50%;font-size:52px;transform:translateX(-50%);transition:left .45s cubic-bezier(.3,1.2,.5,1),transform .45s}
.goalbox .keeper.d0{transform:translateX(-50%) rotate(-70deg)}.goalbox .keeper.d2{transform:translateX(-50%) rotate(70deg)}
.goalbox .pkball{position:absolute;left:50%;top:110%;font-size:30px;transform:translate(-50%,-50%);transition:left .5s ease-out,top .5s ease-out,transform .5s}
.goalbox .pkball.shot{transform:translate(-50%,-50%) scale(.7) rotate(540deg)}
.pk-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* ---------- 기자회견 ---------- */
.press{position:relative;height:150px;border-radius:20px;overflow:hidden;border:2px solid var(--edge);
  background:repeating-linear-gradient(90deg,#1b2a6b 0 70px,#14205a 70px 140px);box-shadow:0 6px 0 rgba(0,0,0,.4)}
.press .wall{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:50px;align-items:center;justify-items:center;
  font-family:var(--f-display);font-size:13px;color:rgba(255,255,255,.22);letter-spacing:.1em}
.press .table{position:absolute;left:8%;right:8%;bottom:0;height:46px;background:linear-gradient(180deg,#2b2f45,#151827);border-radius:10px 10px 0 0;display:flex;justify-content:center;gap:28px;align-items:flex-start}
.press .table span{font-size:32px;margin-top:-26px}
.press .flash{position:absolute;width:140px;height:140px;margin:-70px 0 0 -70px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.9),rgba(255,255,255,0) 60%);opacity:0;animation:flash 3.2s infinite}
.dlg{position:relative;padding:14px 16px 16px;min-height:96px;margin-top:6px}
.dlg-name{position:absolute;top:-14px;left:14px;font-family:var(--f-display);font-size:13px;background:var(--cyan);color:#04202b;padding:3px 12px;border-radius:8px;box-shadow:0 3px 0 var(--cyan-d)}
.dlg p{margin:8px 0 0;font-size:16px;font-weight:700;line-height:1.55;min-height:2.6em}
.dlg .caret{display:inline-block;width:8px;height:16px;background:var(--gold);margin-left:3px;vertical-align:-2px;animation:blink 1s steps(2) infinite}
.vn{display:flex;flex-direction:column;gap:9px}
.vn button{display:flex;align-items:center;gap:10px;text-align:left;border:2px solid var(--edge);background:linear-gradient(180deg,#1f2a5c,#141c3d);border-radius:14px;padding:12px 14px;font-size:15px;font-weight:700;
  box-shadow:0 4px 0 rgba(0,0,0,.4);transition:transform .1s,border-color .15s,opacity .2s;animation:dealIn .4s cubic-bezier(.3,1.4,.6,1) both}
.vn button:hover:not(:disabled){border-color:var(--gold);transform:translateX(4px)}
.vn button:disabled{cursor:default}
.vn button .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--gold);color:#231700;display:grid;place-items:center;font-family:var(--f-display);font-size:14px}
.vn button.picked{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,200,61,.35),0 4px 0 rgba(0,0,0,.4)}
.vn button.faded{opacity:.3}
.press-mood{font-size:13px;color:var(--muted);text-align:center}
.paper{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:14px 16px;font-family:"Nanum Myeongjo","AppleMyungjo","Batang",serif;box-shadow:0 8px 0 rgba(0,0,0,.35);animation:paperIn .65s cubic-bezier(.3,1.3,.6,1) both}
.paper .mast{display:flex;justify-content:space-between;font-size:11px;border-bottom:3px double currentColor;padding-bottom:4px;margin-bottom:10px;opacity:.8;font-family:var(--f-display)}
.paper h3{margin:0;font-size:21px;line-height:1.35;text-wrap:balance}
.paper p{margin:8px 0 0;font-size:14px;opacity:.85}
.opinion .scale{position:relative;height:16px;border-radius:999px;background:linear-gradient(90deg,var(--hot),#555b7a 50%,var(--turf));border:2px solid rgba(0,0,0,.4);margin-top:6px}
.opinion .needle{position:absolute;top:-8px;left:50%;width:8px;height:28px;margin-left:-4px;border-radius:4px;background:#fff;box-shadow:0 0 0 2px #000,0 0 14px rgba(255,255,255,.6);transition:left 1.1s cubic-bezier(.3,1.6,.5,1)}
.opinion .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;font-family:var(--f-display)}
.fans{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.fans li{font-size:14px;background:#0b1128;border:1px solid var(--edge);border-radius:12px;padding:8px 10px;animation:slideIn .35s ease both}
.fans li b{color:var(--cyan);font-size:12px;margin-right:6px}
.twist{padding:10px 12px;border-radius:12px;border:2px dashed var(--gold);font-size:14px;font-weight:700;animation:pop .45s ease both}
.twist.coach{border-style:solid;border-color:var(--edge)}

/* ---------- 협상실 ---------- */
.office{padding:14px;display:flex;flex-direction:column;gap:12px}
.talk{display:flex;flex-direction:column;gap:8px}
.talk .line{padding:10px 12px;border-radius:14px;max-width:88%;font-size:14px;font-weight:700;animation:dealIn .35s ease both}
.talk .me{align-self:flex-end;background:var(--cyan);color:#04202b;border-bottom-right-radius:4px}
.talk .gm{align-self:flex-start;background:#0b1128;border:1px solid var(--edge);border-bottom-left-radius:4px}
.talk small{display:block;font-size:11px;opacity:.7;font-weight:900}
.memo{background:var(--paper);color:var(--paper-ink);border-radius:8px;padding:10px 12px;font-size:13px;font-weight:700;transform:rotate(.8deg);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.appeals{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.appeal{text-align:left;border:2px solid var(--edge);background:linear-gradient(180deg,#1f2a5c,#141c3d);border-radius:16px;padding:12px;box-shadow:0 5px 0 rgba(0,0,0,.4);transition:transform .1s,border-color .15s;animation:dealIn .45s cubic-bezier(.3,1.4,.6,1) both;min-width:0}
.appeal:hover:not(:disabled){border-color:var(--gold);transform:translateY(-3px)}
.appeal:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.4)}
.appeal:disabled{opacity:.35;cursor:not-allowed}
.appeal .i{font-size:26px}
.appeal .n{display:block;font-family:var(--f-display);font-size:16px}
.appeal .d{display:block;font-size:12px;color:var(--muted)}
.odds{display:inline-block;margin-top:6px;font-size:11px;font-weight:900;padding:2px 8px;border-radius:999px}
.odds.hi{background:rgba(74,222,128,.15);color:var(--up)}.odds.mid{background:rgba(255,200,61,.15);color:var(--gold)}.odds.lo{background:rgba(255,107,129,.15);color:var(--down)}
.verdict{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.stampv{display:inline-block;font-family:var(--f-display);font-size:clamp(22px,7vw,34px);max-width:100%;text-align:center;padding:6px 18px;border:5px solid currentColor;border-radius:12px;transform:rotate(-7deg);animation:stamp .55s cubic-bezier(.3,1.6,.6,1) both}
.stampv.up{color:var(--up)}.stampv.keep{color:var(--muted)}.stampv.down{color:var(--down)}
.moneyv{font-family:var(--f-display);font-size:32px;font-variant-numeric:tabular-nums}
.offer{display:flex;align-items:center;gap:10px;padding:12px;border:2px solid var(--cyan);border-radius:16px;background:rgba(61,214,255,.08);animation:dealIn .45s ease both;text-align:left;width:100%}
.offer b{font-family:var(--f-display);font-weight:400;font-size:16px;display:block}
.offer small{color:var(--muted);font-size:12px}
.offer .btn{margin-left:auto;flex:none}
.awards{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.award{font-size:12px;font-weight:900;padding:4px 10px;border-radius:999px;border:2px solid var(--gold);color:var(--gold);animation:pop .4s ease both}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 150px);z-index:60;transform:translate(-50%,-10px);background:#fff;color:#111;font-weight:900;padding:10px 16px;border-radius:14px;
  box-shadow:0 5px 0 rgba(0,0,0,.4);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center;font-size:14px}
#toast.show{opacity:1;transform:translate(-50%,0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:55}
[hidden]{display:none!important}

/* ---------- 개성 요소 ---------- */
.crowd{position:absolute;left:0;right:0;top:14%;height:34%;opacity:.25;
  background-image:radial-gradient(circle,rgba(255,255,255,.8) 0 1px,transparent 1.6px),radial-gradient(circle,rgba(255,214,140,.7) 0 1px,transparent 1.6px);
  background-size:23px 17px,37px 29px;background-position:0 0,11px 7px;animation:twinkle 2.4s steps(3) infinite;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 45%,transparent);mask-image:linear-gradient(180deg,transparent,#000 45%,transparent)}
.shake{animation:shake .5s ease}
.dlg p,.note p,.talk .line,.speech,.outcome,.fans li,.vn button,.modal-card p{font-family:var(--f-fun);font-weight:400}
.track{display:flex;gap:5px;align-items:center;padding:10px 12px}
.track .n{flex:1;aspect-ratio:1;max-width:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:11px;background:#0b1128;border:2px solid var(--edge);color:var(--dim)}
.track .n.r-W{background:var(--turf);border-color:var(--turf-d);color:#03200d}
.track .n.r-D{background:#8a8fb5;border-color:#555b7a;color:#10142a}
.track .n.r-L{background:var(--hot);border-color:var(--hot-d);color:#fff}
.track .n.now{border-color:var(--gold);color:var(--gold);animation:pulse 1.1s ease-in-out infinite;box-shadow:0 0 12px rgba(255,200,61,.55)}
.track .lab{font-family:var(--f-display);font-size:11px;color:var(--muted);margin-right:4px;white-space:nowrap}
.speech{position:relative;font-size:16px;background:#fff;color:#1a1f3a;border-radius:16px;padding:10px 14px;box-shadow:0 4px 0 rgba(0,0,0,.35);animation:pop .45s cubic-bezier(.3,1.6,.6,1) both;margin-bottom:-4px}
.speech::after{content:"";position:absolute;left:34px;bottom:-10px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}
.report-tag{display:inline-block;font-family:var(--f-display);font-size:11px;padding:2px 8px;border-radius:6px;margin-left:6px;vertical-align:1px;color:#fff;background:#3a4f8f}
.report-tag.rumor{background:#a03070}
.splash{position:fixed;inset:0;z-index:50;display:grid;place-items:center;pointer-events:none;overflow:hidden}
.splash .band{width:140%;justify-self:center;padding:22px 0;background:linear-gradient(90deg,var(--gold),#ff9f1c);transform:skewY(-6deg);box-shadow:0 10px 0 rgba(0,0,0,.4);
  display:flex;align-items:center;justify-content:center;gap:16px;animation:band 1.4s linear both;will-change:transform}
.splash::before{content:"";position:absolute;inset:0;background:rgba(3,6,16,.5);animation:splashDim 1.4s ease both}
.splash .band > .crest{animation:splashCrest .5s cubic-bezier(.3,1.6,.5,1) both .22s}
.splash .band b{display:block;animation:splashTxt .45s cubic-bezier(.3,1.5,.5,1) both .26s}
@keyframes splashDim{0%,100%{opacity:0}20%,75%{opacity:1}}
@keyframes splashCrest{from{opacity:0;transform:scale(.3) rotate(-25deg)}}
@keyframes splashTxt{from{opacity:0;transform:scale(1.5)}}
.splash .band b{font-family:var(--f-display);font-weight:400;font-size:clamp(40px,12vw,72px);color:#231700;line-height:1}
.splash .band small{display:block;font-family:var(--f-display);font-size:16px;color:#5a3a00}
.mg-bar{position:relative;height:36px;border-radius:12px;background:#0b1128;border:2px solid var(--edge);overflow:hidden;margin:10px 0 14px}
.mg-zone{position:absolute;top:0;bottom:0;background:rgba(34,197,94,.45);border-left:2px solid var(--turf);border-right:2px solid var(--turf)}
.mg-perfect{position:absolute;top:0;bottom:0;background:rgba(255,200,61,.85)}
.mg-cursor{position:absolute;top:-2px;bottom:-2px;width:6px;margin-left:-3px;background:#fff;border-radius:3px;box-shadow:0 0 10px #fff}
.mg-ball{font-size:84px;border:0;background:none;line-height:1;transition:transform .09s;touch-action:manipulation;padding:6px}
.mg-count{font-family:var(--f-display);font-size:44px;color:var(--gold);line-height:1}
.lockers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 4px}
.locker{aspect-ratio:3/4;border-radius:12px;border:3px solid #5b6aa8;background:repeating-linear-gradient(180deg,#3a4785 0 8px,#33407a 8px 10px);font-size:34px;display:grid;place-items:center;
  box-shadow:0 5px 0 rgba(0,0,0,.4);transition:transform .35s,opacity .3s}
.locker:hover:not(:disabled){transform:translateY(-4px)}
.locker.open{background:#141c39;animation:pop .45s ease both}
.react-pad{width:100%;height:150px;border-radius:16px;border:3px solid var(--edge);display:grid;place-items:center;font-family:var(--f-display);font-size:30px;background:#2a0f1e;color:var(--down);margin:10px 0 4px;user-select:none;touch-action:manipulation}
.react-pad.go{background:var(--turf);color:#03200d;border-color:var(--turf-d)}
.noiv{font-family:var(--f-fun);color:var(--muted);font-size:14px}
@keyframes twinkle{50%{opacity:.45;background-position:3px 2px,14px 9px}}
@keyframes shake{20%{transform:translate(-7px,3px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-4px,3px)}80%{transform:translate(3px,-2px)}}
@keyframes band{0%{transform:skewY(-6deg) translateX(-110%);animation-timing-function:cubic-bezier(.1,.8,.2,1)}22%{transform:skewY(-6deg) translateX(1.5%);animation-timing-function:ease-in-out}30%,76%{transform:skewY(-6deg) translateX(0);animation-timing-function:cubic-bezier(.7,0,.9,.4)}100%{transform:skewY(-6deg) translateX(112%)}}

/* ---------- 리그 · 대회 · 스탯 ---------- */
.hud-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.hs{position:relative;background:#0b1128;border:1px solid var(--edge);border-radius:9px;padding:3px 2px 2px;text-align:center;line-height:1.1;min-width:0}
.hs span{display:block;font-size:10px;color:var(--muted);white-space:nowrap}
.hs b{font-family:var(--f-display);font-weight:400;font-size:17px;font-variant-numeric:tabular-nums}
.hs.mid b{color:var(--cyan)} .hs.hi b{color:var(--gold)}
.hs i{position:absolute;top:1px;right:3px;font-style:normal;font-size:9px;font-weight:900}
.hs.upd{border-color:var(--up);animation:statUp 1.2s ease}.hs.upd i{color:var(--up)}
.hs.dnd{border-color:var(--down)}.hs.dnd i{color:var(--down)}
.radar{width:min(280px,100%);height:auto;overflow:visible}
.radar-fill{transform-origin:120px 112px;animation:radarIn .8s cubic-bezier(.3,1.4,.6,1) both}
.trophy{display:inline-flex;gap:6px;align-items:center;font-family:var(--f-display);font-size:14px;padding:6px 12px;border-radius:12px;background:linear-gradient(180deg,#4a3a0c,#2a2005);border:2px solid var(--gold);color:var(--gold)}
.trophy small{font-family:var(--f-body);color:var(--muted)}
.next.cup{border-color:var(--gold);box-shadow:0 6px 0 rgba(0,0,0,.35),0 0 30px rgba(255,200,61,.25)}
.cup-banner{position:relative;margin-top:8px;text-align:center;font-family:var(--f-display);font-size:13px;color:#231700;background:linear-gradient(90deg,var(--gold),#ff9f1c);border-radius:8px;padding:4px 8px}
.track{flex-wrap:wrap}
.track .n.cupn{border-color:var(--gold);border-radius:8px}
.track .n.gone{opacity:.25}
.splash.cup .band{background:linear-gradient(90deg,#3dd6ff,#8f7bff)}
.so{display:grid;gap:6px;margin:6px 0 10px;font-size:18px}
.so div{display:flex;justify-content:space-between;align-items:center;background:#0b1128;border-radius:10px;padding:6px 10px}
.so b{font-family:var(--f-display);font-weight:400;font-size:14px}
.league{display:flex;flex-direction:column;gap:10px}
.league.mine{border-color:var(--gold)}
.lg-head{display:flex;align-items:center;gap:10px}
.lg-head b{display:block;font-family:var(--f-display);font-weight:400;font-size:18px}
.lg-head small{color:var(--muted);font-size:12px}
.lg-flag{font-size:30px}
.lg-clubs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.lg-clubs span{display:flex;align-items:center;gap:6px;background:#0b1128;border-radius:10px;padding:5px 8px;min-width:0;font-size:12px}
.lg-clubs em{font-style:normal;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-clubs b{font-family:var(--f-display);font-weight:400;color:var(--gold)}
.lg-clubs .crest{width:22px;height:22px;font-size:11px}
@keyframes statUp{0%{transform:scale(1)}20%{transform:scale(1.18);box-shadow:0 0 14px rgba(74,222,128,.7)}100%{transform:scale(1)}}
@keyframes radarIn{from{transform:scale(0);opacity:0}}

/* ---------- 엠블럼 · 3D · 상점 ---------- */
.crest{background:none!important;box-shadow:none!important;border-radius:0}
.crest svg{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
.res.xp b{color:var(--cyan)}
.viewer{position:relative;height:330px;max-width:100%;border-radius:20px;overflow:hidden;border:2px solid var(--edge);box-shadow:0 6px 0 rgba(0,0,0,.4);
  background:radial-gradient(70% 60% at 50% 30%,rgba(124,196,255,.25),transparent 70%),radial-gradient(60% 40% at 50% 100%,rgba(34,197,94,.25),transparent 70%),linear-gradient(180deg,#121a3a,#0a1024)}
.viewer.tall{height:400px}
.viewer.sm{height:260px;margin:6px 0 10px}
.viewer canvas{display:block;width:100%!important;height:100%!important}
.v-tag{position:absolute;left:12px;top:10px;z-index:1;font-family:var(--f-display);font-size:13px;background:rgba(0,0,0,.45);padding:3px 10px;border-radius:999px;pointer-events:none}
.v-poses{position:absolute;left:0;right:0;bottom:10px;z-index:1;display:flex;gap:6px;justify-content:center}
.v-fallback{display:grid;place-items:center;height:100%;padding:16px;text-align:center;color:var(--muted)}
.look{display:flex;flex-direction:column;gap:10px;text-align:left}
.lrow{display:flex;flex-direction:column;gap:6px}
.sws,.opts{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--edge);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.sw.on{border-color:var(--gold);transform:scale(1.12)}
.opt{border:2px solid var(--edge);background:#0b1128;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;transition:transform .1s}
.opt.on{border-color:var(--gold);background:linear-gradient(180deg,#3a2f0c,#211a06);color:var(--gold)}
.opt:disabled,.sw:disabled{opacity:.3;cursor:not-allowed}
.modal-card.wide{width:min(480px,100%);max-height:calc(100vh - 32px);overflow-y:auto}
.xp-bank{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px;border-radius:18px;border:2px solid var(--cyan);background:linear-gradient(180deg,#123049,#0b1a33);box-shadow:0 6px 0 rgba(0,0,0,.35);text-align:center}
.xp-bank b{font-family:var(--f-display);font-weight:400;font-size:32px;color:var(--cyan);text-shadow:0 0 18px rgba(61,214,255,.5)}
.xp-bank small{color:var(--muted);font-size:12px}
.shop-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.shop-item{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:12px 8px;border-radius:16px;border:2px solid var(--edge);background:linear-gradient(180deg,#1f2a5c,#141c3d);box-shadow:0 5px 0 rgba(0,0,0,.4);min-width:0;animation:dealIn .4s ease both}
.shop-item.on{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,200,61,.3),0 5px 0 rgba(0,0,0,.4)}
.shop-item .si-i{font-size:30px}
.shop-item b{font-family:var(--f-display);font-weight:400;font-size:14px}
.shop-item small{font-size:11px;color:var(--muted);flex:1}
.shop-item .btn{width:100%;font-size:13px;padding:8px 6px}
.dock button{font-size:11px}
@media (max-width:400px){ .shop-grid{grid-template-columns:repeat(2,1fr)} .viewer.tall{height:360px} }

/* ---------- 아이콘 · 자원 라벨 ---------- */
.ico{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em}
.modal-card .big .ico.evi{width:64px;height:64px;color:var(--gold)}
.ico.big{width:30px;height:30px;color:var(--gold)}
.res{flex-direction:column;align-items:stretch;gap:2px;padding:5px 7px}
.res .rt{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
.res .rt .ico{width:13px;height:13px}
.res:nth-child(1) .rt .ico{color:var(--gold)} .res:nth-child(2) .rt .ico{color:var(--cyan)} .res:nth-child(3) .rt .ico{color:var(--turf)} .res.xp .rt .ico{color:var(--cyan)} .res.money .rt .ico{color:var(--gold)}
.res .rv{display:flex;align-items:center;gap:5px}
.res.money b{font-size:14px}
.dock button .i .ico{width:22px;height:22px}
.act .i .ico{width:28px;height:28px}
.icon-btn .ico{width:20px;height:20px}
.si-i .ico{width:30px;height:30px}
.mgr-face .ico{width:58%;height:58%;color:var(--gold)}
.speech .ico,.memo .ico,.twist .ico,.offer .ico{color:var(--gold)}
.note-head .ico{color:#6b5a32}
.f-front b .ico{color:var(--gold)}

/* ---------- 순위표 ---------- */
.rank-hero{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px;border-radius:18px;border:2px solid var(--gold);background:linear-gradient(180deg,#3a2f0c,#1a1406);box-shadow:0 6px 0 rgba(0,0,0,.35);text-align:center}
.rank-hero b{display:block;font-family:var(--f-display);font-weight:400;font-size:44px;line-height:1;color:var(--gold);text-shadow:0 4px 0 #6b3f00}
.rank-hero small{color:var(--muted)}
table.standings{width:100%;border-collapse:collapse;font-size:13px;min-width:360px}
table.standings th,table.standings td{padding:7px 4px;text-align:center;border-bottom:1px solid var(--edge);font-variant-numeric:tabular-nums}
table.standings th{color:var(--muted);font-size:11px;font-weight:700}
table.standings .l{text-align:left}
table.standings .tc{display:flex;align-items:center;gap:6px;min-width:0}
table.standings .tc .crest{width:22px;height:22px}
table.standings .tc em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
table.standings b{font-family:var(--f-display);font-weight:400;font-size:15px}
table.standings .rk{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-family:var(--f-display);font-size:12px}
table.standings tr.z-champ .rk{background:var(--gold);color:#231700}
table.standings tr.z-cont .rk{background:var(--cyan);color:#04202b}
table.standings tr.z-down .rk{background:var(--hot);color:#fff}
table.standings tr.me td{background:rgba(255,200,61,.14)}
table.standings tr.me em{color:var(--gold);font-weight:900}
.legend-z{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:-6px}
.legend-z i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.legend-z i.z-champ{background:var(--gold)} .legend-z i.z-cont{background:var(--cyan)} .legend-z i.z-down{background:var(--hot)}

/* ---------- 타이틀 ---------- */
.ts{position:relative;min-height:100vh;display:flex;flex-direction:column;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 20px;max-width:560px;margin:0 auto}
.ts-beams{position:absolute;inset:-10% -30% auto;height:70%;pointer-events:none;z-index:0}
.ts-beams i{position:absolute;top:0;width:38%;height:100%;background:linear-gradient(180deg,rgba(255,236,190,.22),transparent 75%);filter:blur(6px);transform-origin:top center;animation:beam 7s ease-in-out infinite}
.ts-beams i:nth-child(1){left:8%;transform:rotate(18deg)}
.ts-beams i:nth-child(2){left:31%;transform:rotate(0deg);animation-delay:-2.3s;background:linear-gradient(180deg,rgba(200,230,255,.18),transparent 70%)}
.ts-beams i:nth-child(3){left:54%;transform:rotate(-18deg);animation-delay:-4.6s}
.ts-top{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center}
.ts-brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:14px;letter-spacing:.14em}
.ts-mark{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--gold);color:#231700}
.ts-mark .ico{width:18px;height:18px}
.ts-chip{font-family:var(--f-display);font-size:11px;letter-spacing:.14em;color:var(--muted);border:1px solid var(--edge);border-radius:999px;padding:4px 10px;background:rgba(10,15,31,.6)}
.ts-stage{position:relative;z-index:1;height:clamp(250px,42vh,400px);margin:0 -16px}
.viewer.hero{height:100%;border:0;border-radius:0;box-shadow:none;background:none;-webkit-mask-image:linear-gradient(180deg,#000 72%,transparent 98%);mask-image:linear-gradient(180deg,#000 72%,transparent 98%)}
.ts-floor{position:absolute;left:10%;right:10%;bottom:0;height:40px;background:radial-gradient(50% 50% at 50% 50%,rgba(255,200,61,.25),transparent 70%);pointer-events:none}
.ts-body{position:relative;z-index:2;display:flex;flex-direction:column;align-items:stretch;gap:12px;margin-top:-6px}
.ts-title{margin:0;display:flex;justify-content:center;gap:.28em;font-family:var(--f-display);font-weight:400;font-size:clamp(40px,12vw,58px);line-height:1;letter-spacing:.02em;animation:fadeUp .7s .1s ease both}
.ts-title span:first-child{color:#fff}
.ts-title span:last-child{color:var(--gold)}
.ts-sub{margin:-4px 0 6px;text-align:center;color:var(--muted);font-size:14px;animation:fadeUp .7s .2s ease both}
.ts-cont{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:18px;border:1px solid rgba(255,200,61,.5);
  background:linear-gradient(135deg,rgba(255,200,61,.18),rgba(20,28,57,.9) 55%);box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08);
  transition:transform .12s,border-color .2s;animation:fadeUp .7s .3s ease both}
.ts-cont:hover{border-color:var(--gold)} .ts-cont:active{transform:scale(.98)}
.ts-cont-crest .crest{width:46px;height:46px}
.ts-cont-main{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.ts-cont-main small{font-family:var(--f-display);font-size:11px;letter-spacing:.14em;color:var(--gold)}
.ts-cont-main b{font-family:var(--f-display);font-weight:400;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ts-cont-main em{font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ts-cont-ovr{display:flex;flex-direction:column;align-items:center;line-height:1}
.ts-cont-ovr b{font-family:var(--f-display);font-weight:400;font-size:26px}
.ts-cont-ovr small{font-size:10px;color:var(--muted);font-weight:700}
.ts-cont-go{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--gold);color:#231700;flex:none}
.ts-new{width:100%;padding:14px;border-radius:16px;border:1px solid var(--edge);background:rgba(20,28,57,.75);color:var(--ink);font-family:var(--f-display);font-size:16px;letter-spacing:.02em;transition:background .2s,transform .12s;animation:fadeUp .7s .4s ease both}
.ts-new:hover{background:rgba(42,54,114,.8)} .ts-new:active{transform:scale(.98)}
.ts-new.primary{background:var(--gold);color:#231700;border-color:var(--gold);font-size:18px;box-shadow:0 10px 30px rgba(255,200,61,.25)}
.ts-new.warn{border-color:var(--hot);color:var(--down);font-size:14px}
/* (기능 소개 타일 제거됨) */
.ts-feats-unused{list-style:none;margin:4px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;animation:fadeUp .7s .5s ease both}
.ts-feats li{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:12px;background:rgba(20,28,57,.55);border:1px solid rgba(42,54,114,.7);font-size:11px;color:var(--muted);text-align:center;line-height:1.25}
.ts-feats .ico{width:18px;height:18px;color:var(--cyan)}
.ts-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px;font-size:11px;color:var(--dim)}
.ts-foot a{color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:5px;font-size:13px}
@keyframes beam{0%,100%{opacity:.55}50%{opacity:1}}

/* ---------- 업적 · 목표 · 결정적 순간 ---------- */
.obj{display:flex;flex-direction:column;gap:8px}
.obj-head{font-family:var(--f-display);font-size:15px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.obj-head .ico{color:var(--gold)}
.obj-head small{font-family:var(--f-body);font-size:11px;color:var(--muted);width:100%}
.obj-row{display:grid;grid-template-columns:1fr 70px 44px 18px;align-items:center;gap:8px;font-size:13px}
.obj-bar{height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.obj-bar i{display:block;height:100%;border-radius:999px;background:var(--cyan)}
.obj-row.met .obj-bar i{background:var(--turf)}
.obj-row b{font-family:var(--f-display);font-weight:400;text-align:right;font-variant-numeric:tabular-nums}
.obj-ok .ico{color:var(--turf);width:18px;height:18px}
.ach-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ach{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;padding:10px 6px;border-radius:14px;border:1px solid var(--edge);background:rgba(11,17,40,.7);opacity:.5;min-width:0}
.ach.on{opacity:1;border-color:var(--gold);background:linear-gradient(180deg,rgba(255,200,61,.14),rgba(20,28,57,.9))}
.ach .ach-i .ico{width:24px;height:24px;color:var(--muted)}
.ach.on .ach-i .ico{color:var(--gold)}
.ach b{font-family:var(--f-display);font-weight:400;font-size:13px}
.ach small{font-size:10px;color:var(--muted);line-height:1.3}
.ach em{font-style:normal;font-size:10px;font-weight:900;color:var(--cyan)}
.ach-pop{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);z-index:70;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;
  background:linear-gradient(135deg,#3a2f0c,#141c39);border:2px solid var(--gold);box-shadow:0 10px 30px rgba(0,0,0,.45);animation:achIn .5s cubic-bezier(.3,1.5,.6,1) both;max-width:calc(100% - 32px)}
.ach-pop.out{animation:achOut .3s ease both}
.ach-pop .ach-i .ico{width:28px;height:28px;color:var(--gold)}
.ach-pop small{display:block;font-size:10px;letter-spacing:.12em;color:var(--gold);font-weight:900}
.ach-pop b{font-family:var(--f-display);font-weight:400;font-size:16px}
.ach-pop em{font-style:normal;font-weight:900;color:var(--cyan);margin-left:4px}
.ch-btn{flex-direction:column;gap:2px}
.ch-btn small{font-family:var(--f-body);font-size:11px;color:var(--muted);font-weight:700}
.btn small{font-size:11px;font-weight:700;opacity:.8}
@keyframes achIn{from{opacity:0;transform:translate(-50%,-120%)}}
@keyframes achOut{to{opacity:0;transform:translate(-50%,-120%)}}

/* ---------- 빅매치 · 미션 · 이적 협상 ---------- */
.next.bigm{border-color:var(--hot);box-shadow:0 6px 0 rgba(0,0,0,.35),0 0 34px rgba(255,77,109,.35)}
.big-banner{position:relative;margin-top:8px;text-align:center;font-family:var(--f-display);font-size:14px;color:#fff;background:linear-gradient(90deg,var(--hot),#ff9f1c);border-radius:8px;padding:5px 8px;animation:pulse 1.6s ease-in-out infinite}
.big-banner .ico{vertical-align:-.2em}
.mission{position:relative;display:flex;align-items:center;gap:10px;margin-top:14px;padding:10px 12px;border-radius:14px;background:rgba(61,214,255,.1);border:1px solid rgba(61,214,255,.45)}
.mission > .ico{width:26px;height:26px;color:var(--cyan)}
.mission div{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.mission small{font-size:11px;color:var(--muted)}
.mission b{font-family:var(--f-display);font-weight:400;font-size:17px}
.mission em{font-style:normal;font-size:11px;font-weight:900;color:var(--cyan);text-align:right;line-height:1.3}
.mis-res{display:flex;align-items:center;gap:6px;justify-content:center;flex-wrap:wrap;font-size:14px;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.06)}
.mis-res.ok{background:rgba(74,222,128,.14);color:var(--up)} .mis-res.no{background:rgba(255,107,129,.12);color:var(--down)}
.splash.big .band{background:linear-gradient(90deg,var(--hot),#ff9f1c)}
.splash.big .band b,.splash.big .band small{color:#fff}
.stars{color:var(--gold);letter-spacing:1px;font-size:13px}
.tn-head{display:flex;align-items:center;gap:14px}
.tn-head small{display:block;color:var(--muted);font-size:12px}

/* ---------- 줄바꿈: 한국어는 단어(띄어쓰기) 단위로 ---------- */
body{word-break:keep-all;overflow-wrap:break-word}
/* 단어는 절대 쪼개지 않는다: 영문 로고·숫자 묶음은 한 덩어리로 */
.ts-title{flex-wrap:wrap;font-size:clamp(34px,10.5vw,58px)} .ts-title span{white-space:nowrap}
.nw{white-space:nowrap}
h1,h2,h3,h4,.disp,.btn,.label,.speech,.note p,.outcome,.paper h3,.modal-card p,.vs .side b,.mpick-h,.tag{text-wrap:balance}
p,small,.talk .line,.fans li,.feed li,.dlg p,.news li,.twist,.memo{text-wrap:pretty}
.btn{white-space:normal;line-height:1.25;text-align:center}
.strip b{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.15;font-size:clamp(14px,4.4vw,18px)}
.club span{white-space:normal;text-align:center;line-height:1.2}
.ts-cont-main em{white-space:normal}
.lg-clubs em{white-space:normal;line-height:1.2}
.res .rt span{overflow:hidden;text-overflow:ellipsis}
.appeal .n,.appeal .d,.act .n{text-wrap:balance}
/* ---------- 미션 고르기 · 경기 조건 ---------- */
.conds{position:relative;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.conds span{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--edge)}
.conds .ico{color:var(--cyan)}
.conds em{font-style:normal;color:var(--gold);font-weight:900}
.mpick{position:relative;margin-top:12px;display:flex;flex-direction:column;gap:8px}
.mpick-h{font-family:var(--f-display);font-size:14px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.mpick-h .ico{color:var(--cyan)}
.mpick-h small{font-family:var(--f-body);font-size:11px;color:var(--muted);width:100%}
.mopts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mopt{--mc:var(--cyan);display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;padding:9px 5px;border-radius:14px;border:2px solid var(--edge);background:rgba(11,17,40,.75);min-width:0;transition:transform .12s,border-color .15s,box-shadow .15s}
.mopt.easy{--mc:var(--turf)} .mopt.norm{--mc:var(--cyan)} .mopt.hard{--mc:var(--hot)} .mopt.legend{--mc:#b98bff}
.mopt:hover{transform:translateY(-2px)}
.mopt.on{border-color:var(--mc);box-shadow:0 0 0 3px color-mix(in srgb,var(--mc) 30%,transparent);background:color-mix(in srgb,var(--mc) 14%,rgba(11,17,40,.85))}
.mopt .md{font-family:var(--f-display);font-size:12px;color:var(--mc);display:inline-flex;align-items:center;gap:3px}
.mopt .lucky{font-style:normal;color:var(--turf);display:inline-flex;align-items:center;gap:1px;font-size:11px}
.mopt .lucky .ico{width:12px;height:12px}
.mopt b{font-family:var(--f-display);font-weight:400;font-size:14px;line-height:1.2;text-wrap:balance}
.mopt small{font-size:10px;color:var(--muted);line-height:1.3}
/* 장비 강화 */
.forge-link > .ico:first-child{color:var(--gold)}
.gb-up{display:inline-flex;align-items:center;gap:1px;margin-left:5px;font-style:normal;font-size:11px;font-weight:800;color:var(--up)}
.gb-up .ico{width:11px;height:11px}
.fg-mats{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.fg-mats span{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:7px 11px;border-radius:12px;background:rgba(11,17,40,.7);border:1px solid var(--edge);font-size:12px;color:var(--muted);white-space:nowrap}
.fg-mats b{color:var(--ink);font-family:var(--f-display);font-weight:400;font-size:14px}
.fg-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fg-tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 7px;border-radius:16px;border:2px solid var(--edge);background:rgba(11,17,40,.75);color:var(--ink)}
.fg-tab .gear-svg{width:44px;height:44px}
.fg-tab b{font-size:12.5px} .fg-tab em{font-style:normal;font-family:var(--f-display);font-size:13px;color:var(--muted)}
.fg-tab[aria-selected="true"]{border-color:var(--gold);background:rgba(255,200,61,.1)}
.fg-tab.t-rare em{color:#3dd6ff} .fg-tab.t-epic em{color:#b98bff} .fg-tab.t-max em{color:var(--gold)}
.fg-stage{--gc:#9aa3bd;--ga:rgba(154,163,189,.4);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 12px 12px}
.fg-stage.t-rare{--gc:#3dd6ff;--ga:rgba(61,214,255,.5)} .fg-stage.t-epic{--gc:#b98bff;--ga:rgba(185,139,255,.55)} .fg-stage.t-max{--gc:#ffc83d;--ga:rgba(255,200,61,.6)}
.fg-aura{position:absolute;left:50%;top:78px;width:220px;height:220px;margin:-110px 0 0 -110px;border-radius:50%;background:radial-gradient(circle,var(--ga),transparent 65%);animation:fgAura 2.6s ease-in-out infinite;pointer-events:none}
@keyframes fgAura{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.04)}}
.fg-rays{position:absolute;left:50%;top:78px;width:320px;height:320px;margin:-160px 0 0 -160px;background:repeating-conic-gradient(rgba(255,200,61,.18) 0 8deg,transparent 8deg 24deg);border-radius:50%;-webkit-mask-image:radial-gradient(circle,#000 30%,transparent 70%);mask-image:radial-gradient(circle,#000 30%,transparent 70%);animation:fgRays 14s linear infinite;pointer-events:none}
@keyframes fgRays{to{transform:rotate(360deg)}}
.fg-item{position:relative;width:128px;height:128px;animation:fgFloat 3s ease-in-out infinite}
.fg-item .gear-svg{width:100%;height:100%;filter:drop-shadow(0 8px 0 rgba(0,0,0,.35))}
@keyframes fgFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.fg-name{position:relative;font-family:var(--f-display);font-size:22px}
.fg-name em{font-style:normal;color:var(--gc)}
.fg-pips{position:relative;display:flex;gap:5px}
.fg-pips i{width:16px;height:6px;border-radius:3px;background:rgba(255,255,255,.14)}
.fg-pips i.hi{box-shadow:inset 0 0 0 1px rgba(255,111,111,.45)}
.fg-pips i.on{background:var(--gc);box-shadow:0 0 8px var(--gc)}
.fg-res{position:absolute;left:0;right:0;top:38%;display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none;text-align:center}
.fg-res b{font-family:var(--f-display);font-weight:400;font-size:28px;text-shadow:0 3px 0 rgba(0,0,0,.5);animation:fgPop .45s cubic-bezier(.3,1.6,.5,1) both}
.fg-res small{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(10,15,31,.8);animation:fadeIn .3s .15s both}
.fg-stage.ok .fg-res b{color:var(--gc)} .fg-stage.fail .fg-res b{color:#ff8a8a}
@keyframes fgPop{from{opacity:0;transform:scale(.5)}}
.fg-stage.charge .fg-item{animation:fgCharge .92s cubic-bezier(.4,0,.6,1) both}
.fg-stage.charge .fg-aura{animation:fgChargeAura .92s ease-in both}
@keyframes fgCharge{0%{transform:none}10%,30%,50%,70%,90%{transform:translateX(-3px) rotate(-2deg) scale(1.02)}20%,40%,60%,80%{transform:translateX(3px) rotate(2deg) scale(1.04)}100%{transform:scale(1.1)}}
@keyframes fgChargeAura{from{opacity:.5;transform:scale(.8)}to{opacity:1;transform:scale(1.35)}}
.fg-stage.ok .fg-item{animation:fgOk .6s cubic-bezier(.3,1.6,.5,1) both}
@keyframes fgOk{0%{transform:scale(1.25)}100%{transform:none}}
.fg-stage.ok::after{content:"";position:absolute;left:50%;top:78px;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:4px solid var(--gc);animation:fgRing .6s ease-out both;pointer-events:none}
@keyframes fgRing{from{transform:scale(.3);opacity:1}to{transform:scale(2.4);opacity:0}}
.fg-stage.fail .fg-item{animation:fgFail .5s ease both;opacity:.55}
@keyframes fgFail{0%{transform:none}25%{transform:translateY(4px) rotate(-6deg)}60%{transform:translateY(2px) rotate(4deg)}100%{transform:translateY(3px) rotate(-2deg)}}
.fg-info{display:flex;flex-direction:column;gap:8px}
.fg-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px}
.fg-row span{color:var(--muted);flex:none} .fg-row b{text-align:right;font-weight:700}
.fg-row b.up{color:var(--up)} .fg-row b.down{color:#ff8a8a} .fg-row small{color:var(--muted);font-weight:600}
.fg-sp{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:1px dashed rgba(255,200,61,.4);background:rgba(255,200,61,.06);opacity:.75}
.fg-sp > .ico{width:26px;height:26px;color:var(--gold);flex:none}
.fg-sp div{flex:1;display:flex;flex-direction:column;gap:2px} .fg-sp b{font-size:13px} .fg-sp small{font-size:11.5px;color:var(--muted);line-height:1.35}
.fg-sp em{font-style:normal;font-size:11px;font-weight:800;color:#231700;background:var(--gold);padding:3px 8px;border-radius:999px;flex:none}
.fg-sp em.lock{background:none;color:var(--muted)} .fg-sp em.lock .ico{width:16px;height:16px}
.fg-sp.on{opacity:1;border-style:solid;background:rgba(255,200,61,.12);box-shadow:0 0 20px rgba(255,200,61,.18)}
.fg-cost{display:flex;justify-content:center;gap:8px}
.fg-cost span{padding:6px 12px;border-radius:999px;background:rgba(11,17,40,.75);border:1px solid var(--edge);font-size:13px;font-weight:700}
.fg-cost span.lack{color:#ff8a8a;border-color:rgba(255,111,111,.5)}
.fg-tape{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:1px solid var(--edge);background:rgba(11,17,40,.6);font-size:13px;font-weight:700}
.fg-tape input{width:20px;height:20px;accent-color:var(--gold);flex:none}
.fg-tape span{display:flex;flex-direction:column} .fg-tape small{color:var(--muted);font-weight:600;font-size:11.5px}
.fg-tape.off{opacity:.55}
.fg-go{font-size:18px}
.fg-hint{text-align:center;margin:0}
.fg-done{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px;border-radius:14px;background:rgba(255,200,61,.14);color:var(--gold);font-weight:800}
@media (prefers-reduced-motion:reduce){.fg-aura,.fg-rays,.fg-item,.fg-res b,.fg-res small,.fg-stage.ok::after{animation:none!important}}
/* 타이틀 경기장 배경 */
.ts-bg{position:absolute;left:0;right:0;top:-30px;bottom:-70px;z-index:0;pointer-events:none;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 12%,#000 82%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 12%,#000 82%,transparent 100%);animation:fadeIn .9s ease both}
.ts-bg svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.ts-bg .l-light{animation:tsLight 6.5s ease-in-out infinite}
.ts-bg .l-crowd{animation:tsCrowd 2.8s ease-in-out infinite}
@keyframes tsLight{0%,100%{opacity:.72}50%{opacity:1}}
@keyframes tsCrowd{0%,100%{opacity:.05}50%{opacity:.6}}
.ts-stage .viewer.hero{position:relative;z-index:1;-webkit-mask-image:none;mask-image:none}
.ts-stage .ts-floor{display:none}
.ts-floor,.ts-tapme,.ts-dice{z-index:2}
/* 은은한 움직임: 엠블럼이 떠 있고, 시작 버튼에 빛이 지나간다 */
.vs .side .crest{animation:floatY 3.6s ease-in-out infinite}
.vs .side:last-child .crest{animation-delay:-1.8s}
@keyframes floatY{0%,100%{transform:none}50%{transform:translateY(-4px)}}
.ts-new.primary{position:relative;overflow:hidden}
.ts-new.primary::after{content:"";position:absolute;top:-20%;bottom:-20%;left:0;width:34%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-140%) skewX(-18deg);animation:ctaSheen 4.2s ease-in-out 1.2s infinite;pointer-events:none}
@keyframes ctaSheen{0%,62%{transform:translateX(-140%) skewX(-18deg)}100%{transform:translateX(440%) skewX(-18deg)}}
/* 타이틀: 롤링 문구 · 탭 안내 · 랜덤 얼굴 */
.ts-hook{display:inline-block;transition:opacity .26s ease,transform .26s ease}
.ts-hook.out{opacity:0;transform:translateY(6px)}
.ts-stage{position:relative}
.ts-tapme{position:absolute;left:10px;bottom:18%;font-style:normal;font-size:11px;font-weight:700;color:#0a0f1f;background:var(--gold);padding:3px 9px;border-radius:999px;pointer-events:none;animation:tsTap 1.6s ease-in-out infinite;white-space:nowrap}
@keyframes tsTap{0%,100%{transform:none;opacity:.95}50%{transform:translateY(-5px);opacity:.75}}
.ts-dice{position:absolute;right:6px;bottom:18%;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:#fff;background:rgba(10,15,31,.72);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:7px 11px;backdrop-filter:none}
.ts-dice .ico{width:16px;height:16px}
.ts-dice.roll .ico{animation:tsRoll .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes tsRoll{from{transform:rotate(-200deg) scale(.6)}to{transform:none}}
#tv .chibi-host{cursor:pointer}
/* 골 하이라이트 */
.greel{position:absolute;inset:0;z-index:6;overflow:hidden;animation:grIn .18s ease-out both}
.greel.out{animation:grOut .4s ease-in both}
@keyframes grIn{from{opacity:0}to{opacity:1}}
@keyframes grOut{to{opacity:0}}
.greel .gr-bg{position:absolute;inset:0;width:100%;height:100%}
.greel .gr-goal{position:absolute;right:6%;bottom:12%;width:30%;max-width:120px;aspect-ratio:9/8}
.greel .gr-goal svg{width:100%;height:100%;overflow:visible}
.greel .gr-net{transform-origin:50% 50%;transform-box:fill-box}
.greel.hit .gr-net{animation:grNet .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes grNet{0%{transform:scale(1)}35%{transform:scale(1.14,1.08) translateX(3px)}100%{transform:scale(1)}}
.greel .gr-me{position:absolute;left:6%;bottom:6%;width:22%;max-width:84px;animation:grMe .62s ease-out both}
.greel .gr-me svg{width:100%;height:auto;display:block}
@keyframes grMe{from{transform:translateX(-40%)}to{transform:none}}
.greel .gr-bx{position:absolute;left:24%;bottom:16%;width:0;height:0;animation:grX .62s cubic-bezier(.35,.1,.6,1) both}
.greel .gr-by{animation:grY .62s cubic-bezier(.2,.7,.4,1) both}
.greel .gr-ball{display:block;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 45%,#cfd6ea 70%,#8d96b5);box-shadow:0 0 0 2px rgba(0,0,0,.25);animation:grSpin .62s linear both}
.greel.k-dri .gr-by{animation-name:grYlow}
@keyframes grX{from{transform:translateX(0)}to{transform:translateX(min(52vw,250px))}}
@keyframes grY{0%{transform:translateY(0)}55%{transform:translateY(-46px)}100%{transform:translateY(-22px)}}
@keyframes grYlow{0%{transform:translateY(0)}100%{transform:translateY(-14px)}}
@keyframes grSpin{from{transform:rotate(0) scale(1.1)}to{transform:rotate(540deg) scale(.8)}}
.greel.hit::after{content:"";position:absolute;right:12%;bottom:24%;width:90px;height:90px;margin:-45px -45px 0 0;border-radius:50%;border:3px solid rgba(255,255,255,.8);animation:grRing .45s ease-out both}
@keyframes grRing{from{transform:scale(.2);opacity:1}to{transform:scale(1.6);opacity:0}}
/* 공유 카드 */
.sc-wrap{margin:10px 0 12px;border-radius:16px;overflow:hidden;background:#0a1030;aspect-ratio:4/5;display:grid;place-items:center}
.sc-img{width:100%;height:100%;display:block;object-fit:contain;animation:pop .35s ease both}
.sc-load{color:var(--muted);font-size:13px}
.sc-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sc-hint{text-align:center;margin:8px 0 0}
@media (prefers-reduced-motion:reduce){.ts-tapme,.ts-dice.roll .ico,.sc-img{animation:none}}
.mopt .mfail{font-style:normal;color:#ff8a8a;white-space:nowrap}
.mcond{display:block;font-family:var(--f-body);font-size:12px;font-weight:700;opacity:.85;margin-top:2px}
.mcond .ico{width:13px;height:13px}
@media (max-width:360px){ .mopts{grid-template-columns:1fr} .mopt{flex-direction:row;flex-wrap:wrap;justify-content:space-between;text-align:left} .mopt small{width:100%} }

/* ---------- 좁은 화면 다듬기 ---------- */
.tag{white-space:nowrap;flex:none}
.lg-clubs span{display:inline}
.lg-clubs > span{display:flex}
.lg-clubs > span .crest{padding:0;background:none}
.ach-pop b,.ach-pop em,.ach-pop small{white-space:nowrap}
.offer{flex-wrap:wrap}
.offer > div{flex:1;min-width:0}
.offer .btn{margin-left:0;width:100%}
.appeal .i .ico{width:26px;height:26px;color:var(--gold)}
table.standings{min-width:0}
@media (max-width:400px){
  .res{padding:4px 5px}
  .res .rt{font-size:10px;gap:2px}
  .res .rt .ico{width:11px;height:11px}
  .res .rt span{overflow:visible;text-overflow:clip}
  table.standings .gp{display:none}
  table.standings th,table.standings td{padding:7px 3px}
  table.standings .tc em{max-width:96px}
}

@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.98)}}
@keyframes dealIn{from{opacity:0;transform:translateY(18px) rotate(-2deg) scale(.92)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-16px)}}
@keyframes pop{0%{opacity:0;transform:scale(.5)}70%{transform:scale(1.08)}100%{opacity:1;transform:none}}
@keyframes bump{40%{transform:scale(1.25)}}
@keyframes pulse{50%{transform:scale(1.12)}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-26px)}}
@keyframes sweep{0%,100%{transform:translateX(0) rotate(10deg)}50%{transform:translateX(180%) rotate(10deg)}}
@keyframes holo{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes shine{0%,60%{transform:translateX(-60%)}100%{transform:translateX(60%)}}
@keyframes cardIn{from{opacity:0;transform:rotateY(80deg) scale(.7)}}
@keyframes growX{from{transform:scaleX(0)}}
@keyframes logoIn{from{opacity:0;transform:scale(2.2) rotate(-6deg)}}
@keyframes goal{0%{opacity:0;transform:scale(.25) rotate(-10deg);animation-timing-function:cubic-bezier(.2,.9,.3,1)}16%{opacity:1;transform:scale(1.16) rotate(2deg);animation-timing-function:cubic-bezier(.4,0,.4,1)}27%{opacity:1;transform:scale(.96) rotate(-1deg);animation-timing-function:ease-out}36%{opacity:1;transform:scale(1.02) rotate(0)}44%,76%{opacity:1;transform:scale(1);animation-timing-function:cubic-bezier(.5,0,.9,.5)}100%{opacity:0;transform:scale(1.35)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes zoomIn{0%{opacity:0;transform:scale(.72) translateY(14px) rotate(-2deg)}55%{opacity:1}}
@keyframes stamp{from{opacity:0;transform:scale(2.6) rotate(-20deg)}}
@keyframes paperIn{from{opacity:0;transform:rotate(-10deg) scale(.6)}}
@keyframes blink{50%{opacity:0}}
@keyframes flash{0%,6%,100%{opacity:0}2%{opacity:1}}

@media (max-width:400px){
  .acts{gap:6px}.act .d{display:none}.act{padding:12px 2px 9px}
  .club-grid{grid-template-columns:repeat(3,1fr)}
  .appeals{grid-template-columns:1fr}
  .led-sc{font-size:40px}
  .crest.xl{width:62px;height:62px;font-size:26px}
}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- 세계 탭: 몸값 랭킹 · 시상식 ---------- */
.wseg{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:5px;border-radius:16px;background:rgba(11,17,40,.8);border:2px solid var(--edge)}
.wseg button{display:flex;align-items:center;justify-content:center;gap:5px;padding:9px 4px;border-radius:11px;border:0;background:transparent;color:var(--muted);font-family:var(--f-display);font-size:14px;min-width:0}
.wseg button.on{background:linear-gradient(180deg,var(--gold),var(--gold-d));color:#231700}
.wseg .ico{width:16px;height:16px;flex:none}
.vcard{padding:16px;background:radial-gradient(120% 90% at 100% 0%,rgba(255,200,61,.22),transparent 60%),linear-gradient(180deg,var(--panel-2),var(--panel));border-color:var(--gold)}
.vc-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.vc-top .label{display:inline-flex;align-items:center;gap:5px;color:var(--gold)}
.vc-val{font-family:var(--f-display);font-size:clamp(34px,10vw,46px);line-height:1.1;margin:6px 0 10px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.vc-val small{font-size:.45em;margin-left:4px;color:var(--muted)}
.vc-ranks{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
