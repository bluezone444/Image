<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Pitch Career</title>
<style>
:root{
  --bg:#f3f6f1; --surface:#ffffff; --surface-2:#eef2ec; --ink:#16201a; --muted:#5d6b62;
  --line:#d9e1d6; --brand:#1f8a4c; --brand-ink:#ffffff; --pitch:#2f9e5a; --pitch-2:#278a4e;
  --win:#1f8a4c; --draw:#8a8f2a; --loss:#c2413a; --gold:#e0a106; --xp:#f5c518; --up:#1f8a4c; --down:#c2413a;
  --paper:#fbf8ef; --paper-ink:#2b2418;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1511; --surface:#17201a; --surface-2:#1e2a22; --ink:#e7eee9; --muted:#9aa9a0;
    --line:#2a3830; --brand:#3cc178; --brand-ink:#08130c; --pitch:#1d6b3e; --pitch-2:#185c35;
    --win:#3cc178; --draw:#c8cd52; --loss:#ef6b62; --gold:#f2c14e; --up:#3cc178; --down:#ef6b62;
    --paper:#22201a; --paper-ink:#efe7d3; --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1511; --surface:#17201a; --surface-2:#1e2a22; --ink:#e7eee9; --muted:#9aa9a0;
  --line:#2a3830; --brand:#3cc178; --brand-ink:#08130c; --pitch:#1d6b3e; --pitch-2:#185c35;
  --win:#3cc178; --draw:#c8cd52; --loss:#ef6b62; --gold:#f2c14e; --up:#3cc178; --down:#ef6b62;
  --paper:#22201a; --paper-ink:#efe7d3; --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 80px}
a{color:inherit}

.hero{position:relative;overflow:hidden;color:#fff;background:repeating-linear-gradient(90deg,var(--pitch) 0 48px,var(--pitch-2) 48px 96px)}
.hero::before{content:"";position:absolute;inset:12px;border:2px solid rgba(255,255,255,.3);border-radius:4px;pointer-events:none}
.hero-in{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:20px 16px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hero h1{margin:0;font-size:22px;letter-spacing:-.02em}
.hero p{margin:0;font-size:13px;opacity:.9}
.ghost{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:999px;padding:6px 11px;cursor:pointer;font-size:13px;text-decoration:none;display:inline-block;transition:background .15s,transform .15s}
.ghost:hover{background:rgba(255,255,255,.28)} .ghost:active{transform:scale(.95)}
.actions{display:flex;gap:6px;flex-wrap:wrap}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.pad{padding:16px}
.section-title{font-size:13px;font-weight:700;color:var(--muted);margin:20px 0 8px}
.screen{animation:fadeUp .3s ease both;padding-top:16px}
.hint{font-size:12px;color:var(--muted)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;transition:transform .1s,filter .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sub{background:var(--surface-2);border:1px solid var(--line)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* start */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label,.lbl{font-size:12px;font-weight:700;color:var(--muted)}
.field input,.field select{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 4px;cursor:pointer;font-weight:700;transition:all .15s}
.seg button small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.seg button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.seg button.on small{color:inherit;opacity:.85}

/* profile */
.profile{display:flex;gap:14px;align-items:center}
.crest{flex:none;width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font-size:13px;font-weight:900;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);vertical-align:middle}
.crest.lg{width:56px;height:56px;font-size:24px}
.pname{font-size:20px;font-weight:900;letter-spacing:-.02em}
.psub{font-size:13px;color:var(--muted)}
.ovr{margin-left:auto;text-align:center;flex:none}
.ovr b{display:block;font-size:34px;line-height:1;font-weight:900;font-variant-numeric:tabular-nums}
.ovr span{font-size:11px;color:var(--muted);font-weight:700}
.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.meter .top{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.meter .top b{color:var(--ink);font-variant-numeric:tabular-nums}
.track{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.track span{display:block;height:100%;border-radius:999px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.salary{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:14px}
.salary b{font-size:17px}
.tier{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--xp);color:#3a2a00;margin-left:6px;vertical-align:2px}
.abil{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.ab{text-align:center;padding:10px 4px}
.ab b{display:block;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.ab span{font-size:12px;color:var(--muted)}
.ab.flash b{animation:flash .9s ease}

/* week */
.week-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.vs-line{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.act{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 6px;cursor:pointer;text-align:center;transition:transform .12s,border-color .15s,background .15s}
.act:hover{transform:translateY(-2px);border-color:var(--brand)}
.act:active{transform:scale(.96)}
.act .i{font-size:24px;display:block}
.act .n{font-weight:800;font-size:13px;display:block;margin-top:2px}
.act .d{font-size:11px;color:var(--muted);display:block}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tile{padding:10px;text-align:center}
.tile b{display:block;font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.tile span{font-size:11px;color:var(--muted)}
.news{list-style:none;margin:0;padding:4px 14px}
.news li{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;animation:fadeUp .35s ease both}
.news li:last-child{border-bottom:0}
.news small{color:var(--muted);display:block;font-size:11px}

/* match */
.board{padding:18px 14px;text-align:center;background:linear-gradient(180deg,var(--pitch),var(--pitch-2));color:#fff;border:0}
.board .row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.board .tm{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:14px;min-width:0}
.board .tm span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .sc{font-size:46px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.board .sc.bump{animation:bump .5s ease}
.board .min{font-size:13px;font-weight:800;background:rgba(0,0,0,.25);display:inline-block;padding:2px 10px;border-radius:999px;margin-top:6px}
.mbar{height:4px;background:rgba(255,255,255,.25);border-radius:999px;overflow:hidden;margin-top:12px}
.mbar span{display:block;height:100%;background:#fff;width:0}
.myrole{margin-top:8px;font-size:13px;opacity:.9}
.timeline{list-style:none;margin:0;padding:6px 14px;min-height:60px}
.timeline li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;animation:slideIn .35s cubic-bezier(.2,.8,.2,1) both}
.timeline li:last-child{border-bottom:0}
.timeline .m{flex:none;width:34px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.timeline li.me{font-weight:800;color:var(--brand)}
.timeline li.opp{color:var(--loss)}
.res{text-align:center;padding:18px 16px;animation:pop .45s cubic-bezier(.3,1.5,.6,1) both}
.res .rt{font-size:52px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.res .rl{font-size:12px;color:var(--muted);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
.chip{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--surface-2);animation:pop .35s ease both}
.chip.up{color:var(--up);background:color-mix(in srgb,var(--up) 14%,transparent)}
.chip.down{color:var(--down);background:color-mix(in srgb,var(--down) 14%,transparent)}

/* interview */
.mic{display:flex;gap:12px;align-items:flex-start}
.mic .av{flex:none;width:48px;height:48px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:26px;animation:wiggle 2s ease-in-out infinite}
.bubble{background:var(--surface-2);border-radius:4px 14px 14px 14px;padding:12px 14px;font-size:15px;animation:fadeUp .4s ease both}
.bubble small{display:block;color:var(--muted);font-size:11px;font-weight:700;margin-bottom:2px}
.answers{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.ans{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer;font-size:15px;display:flex;gap:10px;align-items:center;animation:rise .4s cubic-bezier(.2,.8,.2,1) both;transition:border-color .15s,transform .12s}
.ans:hover{border-color:var(--brand);transform:translateX(3px)}
.ans .k{flex:none;width:24px;height:24px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:12px;font-weight:800}
.ans .tag{margin-left:auto;flex:none;font-size:11px;color:var(--muted)}
.paper{background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);border-radius:6px;padding:16px;margin-top:14px;font-family:"Nanum Myeongjo","AppleMyungjo","Batang",serif;animation:paperIn .6s cubic-bezier(.3,1.3,.6,1) both;box-shadow:var(--shadow)}
.paper .mast{display:flex;justify-content:space-between;font-size:11px;border-bottom:3px double currentColor;padding-bottom:4px;margin-bottom:10px;font-family:inherit;opacity:.8}
.paper h3{margin:0;font-size:21px;line-height:1.35}
.paper p{margin:8px 0 0;font-size:14px;opacity:.85}

/* negotiation */
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.awards{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.award{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;border:1px solid var(--gold);color:var(--gold);animation:pop .4s ease both}
.offer{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.offer b{font-size:20px}
.appeals{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-top:12px}
.appeal{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px;text-align:left;cursor:pointer;transition:transform .12s,border-color .15s;animation:rise .4s ease both}
.appeal:hover:not(:disabled){transform:translateY(-2px);border-color:var(--brand)}
.appeal:disabled{opacity:.4;cursor:not-allowed}
.appeal .i{font-size:22px}
.appeal .n{display:block;font-weight:800;margin-top:2px}
.appeal .d{display:block;font-size:12px;color:var(--muted)}
.odds{display:inline-block;margin-top:6px;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px}
.odds.hi{background:color-mix(in srgb,var(--up) 16%,transparent);color:var(--up)}
.odds.mid{background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold)}
.odds.lo{background:color-mix(in srgb,var(--down) 16%,transparent);color:var(--down)}
.talk{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.talk .line{padding:10px 12px;border-radius:12px;max-width:88%;animation:fadeUp .35s ease both;font-size:14px}
.talk .me{align-self:flex-end;background:var(--brand);color:var(--brand-ink);border-bottom-right-radius:4px}
.talk .gm{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px}
.talk .gm small,.talk .me small{display:block;font-size:11px;font-weight:700;opacity:.75}
.dots span{display:inline-block;animation:blink 1s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
.verdict{text-align:center;padding:20px 16px;position:relative;overflow:hidden}
.stampv{display:inline-block;font-size:30px;font-weight:900;padding:6px 18px;border:4px solid currentColor;border-radius:10px;transform:rotate(-6deg);animation:stamp .5s cubic-bezier(.3,1.6,.6,1) both}
.stampv.up{color:var(--up)} .stampv.keep{color:var(--muted)} .stampv.down{color:var(--down)}
.money{font-size:28px;font-weight:900;margin-top:14px;font-variant-numeric:tabular-nums}
.money small{display:block;font-size:13px;color:var(--muted);font-weight:600}
.btnrow{display:flex;gap:8px;margin-top:14px}
.btnrow .btn{flex:1}

table.hist{width:100%;border-collapse:collapse;font-size:13px}
table.hist th,table.hist td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center;font-variant-numeric:tabular-nums}
table.hist th{color:var(--muted);font-weight:700;font-size:12px}
.tbl{overflow-x:auto}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,10px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:40;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.flashfx{position:fixed;inset:0;z-index:45;display:grid;place-items:center;pointer-events:none}
.flashfx b{font-size:clamp(48px,14vw,96px);font-weight:900;color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.45),0 0 0 #000;animation:goal 1.3s cubic-bezier(.3,1.4,.6,1) both;-webkit-text-stroke:2px var(--pitch-2)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
[hidden]{display:none!important}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-14px)}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.06)}100%{opacity:1;transform:none}}
@keyframes bump{40%{transform:scale(1.35)}}
@keyframes flash{30%{color:var(--up);transform:scale(1.3)}}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-10deg)}92%{transform:rotate(8deg)}}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes stamp{from{opacity:0;transform:scale(2.4) rotate(-18deg)}}
@keyframes paperIn{from{opacity:0;transform:rotate(-8deg) scale(.6)}}
@keyframes goal{0%{opacity:0;transform:scale(.3)}30%{opacity:1;transform:scale(1.1)}75%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.4)}}

@media (max-width:640px){
  .acts{grid-template-columns:repeat(4,1fr);gap:6px}
  .act{padding:10px 2px}.act .d{display:none}
  .abil{gap:5px}.ab b{font-size:18px}
  .tiles{grid-template-columns:repeat(3,1fr)}
  .sum{grid-template-columns:repeat(2,1fr)}
  .meters{grid-template-columns:1fr;gap:8px}
  .board .sc{font-size:38px}
}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="hero">
  <div class="hero-in">
    <div><h1>🎮 Pitch Career</h1><p>나만의 축구 선수 커리어</p></div>
    <div class="actions">
      <a class="ghost" href="index.html">📒 직관 일기</a>
      <button class="ghost" id="themeBtn" type="button">테마</button>
      <button class="ghost" id="resetBtn" type="button">새 커리어</button>
    </div>
  </div>
</header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<canvas id="confetti"></canvas>

<script>
(() => {
'use strict';
const SAVE_KEY = 'pitch-career.v1', THEME_KEY = 'pitch-diary.theme';
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ROUNDS = 11, RETIRE_AGE = 36, MIN_SALARY = 2400;

const CLUBS = [['FC서울',74,'#c8102e'],['울산 HD',77,'#1d4aa3'],['전북 현대',76,'#1b7f3a'],['포항 스틸러스',72,'#d0202e'],['수원 FC',68,'#0b3a82'],['강원 FC',70,'#f07b00'],['김천 상무',71,'#b0121f'],['대전 하나시티즌',69,'#6d2077'],['광주 FC',68,'#f2c100'],['제주 SK',67,'#ef6c00'],['대구 FC',66,'#2fa4e7'],['FC안양',65,'#5b2a86']];
const CLUB = Object.fromEntries(CLUBS.map(([n,s,c]) => [n, {s, c}]));
const POS = {
  FW:{name:'공격수', base:{sho:58,pas:48,dri:55,def:30,phy:52}, w:{sho:.4,dri:.25,pas:.15,phy:.15,def:.05}, goalP:.34, astP:.2},
  MF:{name:'미드필더', base:{sho:48,pas:58,dri:53,def:45,phy:50}, w:{pas:.35,dri:.2,sho:.15,def:.15,phy:.15}, goalP:.16, astP:.32},
  DF:{name:'수비수', base:{sho:30,pas:47,dri:40,def:58,phy:57}, w:{def:.45,phy:.25,pas:.15,sho:.1,dri:.05}, goalP:.06, astP:.08},
  GK:{name:'골키퍼', base:{sho:15,pas:42,dri:25,def:60,phy:55}, w:{def:.6,phy:.25,pas:.15,sho:0,dri:0}, goalP:0, astP:.02},
};
const STAT_KEYS = ['sho','pas','dri','def','phy'];
const statName = (k, pos) => ({sho:'슈팅',pas:'패스',dri:'드리블',def: pos === 'GK' ? '선방' : '수비',phy:'피지컬'})[k];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"'`]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'}[c]));
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const int = (v, lo, hi, d = lo) => { const n = Math.round(Number(v)); return Number.isFinite(n) ? clamp(n, lo, hi) : d; };
const rand = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const wait = ms => new Promise(r => setTimeout(r, RM ? 0 : ms));
function poisson(l){ const L = Math.exp(-l); let k = 0, p = 1; do { k++; p *= Math.random(); } while (p > L); return k - 1; }
function lsGet(k){ try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); return true; } catch { return false; } }
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200); }
function money(m){
  m = Math.round(m);
  if (m >= 10000){ const e = Math.floor(m / 10000), r = m % 10000; return `${e}억${r ? ' ' + r.toLocaleString() + '만' : ''}원`; }
  return `${m.toLocaleString()}만원`;
}
function crest(club, lg){
  const c = CLUB[club]?.c || '#555';
  const n = parseInt(c.slice(1), 16), l = (0.299*(n>>16) + 0.587*((n>>8)&255) + 0.114*(n&255)) / 255;
  const ini = [...club.replace(/^FC\s*/,'')][0] || '?';

function growth(age){ return age <= 21 ? 2.2 : age <= 24 ? 1.7 : age <= 28 ? 1.1 : age <= 31 ? .6 : .3; }

// ---------- match simulation ----------
function simulate(){
  const opp = S.schedule[S.round], home = S.round % 2 === 0, P = POS[S.pos], ovr = ovrOf(S.stats, S.pos);
  let role = 'bench', from = 91;
  if (S.injury){ role = 'injured'; }
  else {
    const pStart = clamp(.2 + (ovr - 55) / 35 + (S.trust - 50) / 120 + (S.cond - 60) / 250 - (CLUB[S.club].s - 70) / 60, .05, .97);
    if (S.cond >= 20 && Math.random() < pStart){ role = 'start'; from = 0; }
    else if (Math.random() < .45 && S.pos !== 'GK'){ role = 'sub'; from = ri(55, 80); }
  }
  const mins = role === 'start' ? 90 : role === 'sub' ? 90 - from : 0;
  const myImpact = mins ? (ovr - 62) * .25 * (mins / 90) * (S.cond / 100 + .3) : 0;
  const ts = CLUB[S.club].s + myImpact + (home ? 2 : -2), os = CLUB[opp].s;
  let lt = 1.35 * Math.pow(ts / os, 2.4), lo = 1.35 * Math.pow(os / ts, 2.4);
  if (mins && (S.pos === 'GK' || S.pos === 'DF')) lo *= clamp(1 - (ovr - 55) / 160, .6, 1.1);
  const tg = Math.min(7, poisson(lt)), og = Math.min(7, poisson(lo));
  const ev = [];
  const sk = clamp(ovr / 65, .6, 1.6);
  for (let i = 0; i < tg; i++){
    const m = ri(1, 90), on = m >= from;
    let who = 'team', ast = false;
    if (on && Math.random() < P.goalP * sk) who = 'me';
    else if (on && Math.random() < P.astP * sk) ast = true;
    ev.push({m, side:'us', who, ast});
  }
  for (let i = 0; i < og; i++) ev.push({m: ri(1, 90), side:'them'});
  if (role === 'sub') ev.push({m: from, side:'sub'});
  ev.sort((a, b) => a.m - b.m);
  const goals = ev.filter(e => e.who === 'me').length, assists = ev.filter(e => e.ast).length;
  const res = tg > og ? 'W' : tg < og ? 'L' : 'D';
  let rating = null;
  if (mins){
    rating = 6.0 + (ovr - 62) * .035 + (S.cond - 70) * .01 + goals * .9 + assists * .55 + (res === 'W' ? .35 : res === 'L' ? -.35 : 0) + rand(-.7, .7);
    if (S.pos === 'GK' || S.pos === 'DF'){ rating += (og === 0 ? .7 : -og * .2); }
    if (role === 'sub') rating = 6 + (rating - 6) * .7;
    rating = Math.round(clamp(rating, 3, 10) * 10) / 10;
  }
  return {opp, home, role, from, mins, tg, og, ev, goals, assists, res, rating, cs: mins && og === 0 && (S.pos === 'GK' || S.pos === 'DF')};
}
function applyMatch(r){
  const se = S.season; se[r.res]++;
  const fx = [];
  if (r.mins){
    se.apps++; if (r.role === 'start') se.starts++;
    se.goals += r.goals; se.assists += r.assists; se.ratings.push(r.rating); if (r.cs) se.cs++;
    let dp = r.goals * 2 + r.assists + (r.rating >= 8 ? 3 : r.rating >= 7 ? 1 : r.rating < 5.5 ? -2 : 0) + (r.res === 'W' ? 1 : 0);
    let dt = r.rating >= 7.5 ? 3 : r.rating >= 6.5 ? 1 : r.rating < 5.5 ? -3 : 0;
    fx.push(...applyFx({pop: dp, trust: dt, cond: r.role === 'start' ? -12 : -5}));
    S.best.rating = Math.max(S.best.rating, r.rating);
    if (r.goals >= 3) addNews(`🎩 ${S.name} 해트트릭! ${S.club}, ${r.opp}에 ${r.tg}-${r.og} 대승`);
    else if (r.goals === 2) addNews(`⚽⚽ ${S.name} 멀티골… ${S.club} ${r.tg}-${r.og} ${r.res === 'W' ? '승리' : r.res === 'D' ? '무승부' : '패배'}`);
    else if (r.rating >= 8.5) addNews(`⭐ 평점 ${r.rating}! ${S.name}, ${r.opp}전 최고의 선수`);
  } else if (r.role === 'injured'){
    S.injury = Math.max(0, S.injury - 1); fx.push(...applyFx({cond: 15}));
  } else {
    fx.push(...applyFx({cond: 8, pop: -1}));
  }
  S.last = {...r, fx};
}
async function playMatch(){
  const r = simulate();
  applyMatch(r);
  S.phase = 'interview'; S.interview = null; save();
  const roleTxt = {start:'🟢 선발 출전', sub:`🔄 ${r.from}분 교체 투입 예정`, bench:'🪑 벤치 대기', injured:'🤕 부상으로 결장'}[r.role];
  const hN = r.home ? S.club : r.opp, aN = r.home ? r.opp : S.club;
  app.innerHTML = `<section class="screen">

    <div id="after"></div>
  </section>`;
  window.scrollTo({top:0});
  let us = 0, them = 0, i = 0;
  const tl = $('#tl'), sc = $('#sc');
  const setScore = () => { sc.textContent = r.home ? `${us} : ${them}` : `${them} : ${us}`; sc.classList.remove('bump'); void sc.offsetWidth; sc.classList.add('bump'); };
  const line = e => {
    if (e.side === 'sub') return `<li class="me"><span class="m">${e.m}'</span>🔄 ${esc(S.name)} 교체 투입!</li>`;
    if (e.side === 'them') return `<li class="opp"><span class="m">${e.m}'</span>😣 ${esc(r.opp)} 득점</li>`;
    if (e.who === 'me') return `<li class="me"><span class="m">${e.m}'</span>⚽ ${esc(S.name)} 골!!!</li>`;
    if (e.ast) return `<li class="me"><span class="m">${e.m}'</span>🅰️ ${esc(S.name)}의 도움으로 ${esc(S.club)} 골!</li>`;
    return `<li><span class="m">${e.m}'</span>⚽ ${esc(S.club)} 골!</li>`;
  };
  const fast = S.fast || RM;
  for (let m = 1; m <= 90; m++){
    while (i < r.ev.length && r.ev[i].m <= m){
      const e = r.ev[i++];
      if (e.side === 'us') us++; else if (e.side === 'them') them++;
      tl.insertAdjacentHTML('beforeend', line(e));

      if (!fast && e.who === 'me'){ flash('GOAL!'); confetti([CLUB[S.club].c, '#fff', '#f5c518']); await wait(1100); }
      else if (!fast && e.side !== 'sub') await wait(350);
    }
    $('#min').textContent = m + "'"; $('#mbar').style.width = (m / 90 * 100) + '%';
    if (!fast) await wait(28);

  </div>`;

function countTo(el, to, dec){

}

// ---------- interview ----------
// 각 답변: t(답변), e(효과), h(기사 제목), risk: [성공확률, 실패효과, 실패기사]

  const N = S.name, sc = `${r.tg}-${r.og}`;

  ]};

    {t:'제 부족함 때문입니다. 책임지겠습니다.', e:{pop:2,trust:4}, h:`패배 떠안은 ${N}, "내 책임"… 책임감 돋보여`},

}
function renderInterview(){
  const r = S.last;

function answer(i){
  const iv = S.interview.set;
  let e, h, said;
  if (i < 0){ e = {pop:-1}; h = `${S.name}, 취재진 질문에 묵묵부답`; said = '(말없이 지나간다)'; }
  else {
    const a = iv.a[i]; said = a.t;
    if (a.risk && Math.random() >= a.risk[0]){ e = a.risk[1]; h = a.risk[2]; }
    else { e = a.e; h = a.h; }
  }
  const fx = applyFx(e);
  addNews(h);
  S.interview.done = true; save();
  app.querySelectorAll('.ans').forEach(b => { b.disabled = true; if (Number(b.dataset.i) !== i) b.style.opacity = '.35'; });
  const good = fx.reduce((s, [, d]) => s + d, 0) >= 0;
  $('#ivRes').innerHTML = `<div class="paper"><div class="mast"><span>PITCH SPORTS</span><span>${S.year}시즌 ${S.round + 1}R</span></div>
      <h3>${esc(h)}</h3><p>"${esc(said)}"</p></div>

}
function nextRound(){
  S.round++; S.last = null; S.interview = null;

  else S.phase = 'week';

// ---------- salary negotiation ----------
function seasonPerf(){
  const se = S.season, P = S.pos;
  const avg = se.ratings.length ? se.ratings.reduce((a,b) => a+b, 0) / se.ratings.length : 5.5;
  const contrib = se.goals * (P === 'FW' ? 1.2 : P === 'MF' ? 1.8 : 3) + se.assists * 1.2 + se.cs * 1.5;
  const score = clamp((avg - 6.3) * 25 + (se.apps / ROUNDS) * 25 + contrib, -30, 60);
  return {avg, score};
}
function startNego(){
  const {avg, score} = seasonPerf();
  const offer = Math.round(clamp(score * .5, -20, 30));
  S.phase = 'nego';
  S.nego = {avg: Math.round(avg * 100) / 100, score, offer, round:1, used:[], result:null, log:[]};
  const se = S.season;
  addNews(`${S.year} 시즌 종료 — ${S.name} ${se.apps}경기 ${se.goals}골 ${se.assists}도움 (평점 ${se.ratings.length ? S.nego.avg.toFixed(2) : '-'})`);
}
const APPEALS = {
  record:{i:'📊', n:'기록 어필', d:'"이번 시즌 기록을 보세요."', line:'제 기록을 보시면 이 정도는 받아야 한다고 생각합니다.'},
  pop:{i:'🌟', n:'인기 어필', d:'"팬들이 저를 원합니다."', line:'유니폼 판매량, 관중 수… 제가 구단에 기여하는 게 많잖아요.'},
  loyal:{i:'🤝', n:'충성 어필', d:'"이 팀에 뼈를 묻겠습니다."', line:'저는 이 팀에서 오래 뛰고 싶습니다. 그 마음을 알아주세요.'},
  transfer:{i:'💼', n:'이적 카드', d:'"다른 팀 제안이 있어요."', line:'솔직히 다른 구단에서도 제안이 왔습니다.'},
  accept:{i:'✍️', n:'제시액 수용', d:'구단 제시액에 바로 사인', line:'구단 제시액 그대로 받아들이겠습니다.'},
};
function appealOdds(k){
  const ovr = ovrOf(S.stats, S.pos), sc = S.nego.score;
  const p = {
    record: 1 / (1 + Math.exp(-(sc - 12) / 8)),
    pop: clamp((S.pop - 15) / 70, .08, .92),
    loyal: clamp(.5 + (S.trust - 50) / 90, .2, .95),
    transfer: clamp((ovr - 58) / 28 + S.pop / 250, .08, .85),
    accept: 1,
  }[k];
  return S.nego.round > 1 ? p * .85 : p;
}
function rollAppeal(k){
  const n = S.nego, ok = Math.random() < appealOdds(k);
  let pct = n.offer, trust = 0, gm;
  const add = (a) => pct += a;
  if (k === 'accept'){ trust = 5; gm = '좋습니다. 내년에도 잘 부탁해요.'; }
  else if (k === 'record'){ if (ok){ add(ri(12, 28)); gm = '숫자는 거짓말을 안 하죠. 인정합니다.'; } else { add(-ri(4, 9)); trust = -3; gm = '그 정도 기록으로는 어렵습니다.'; } }
  else if (k === 'pop'){ if (ok){ add(Math.round(S.pop / 4) + ri(0, 6)); gm = '마케팅팀도 같은 의견이더군요. 반영하겠습니다.'; } else { add(-ri(4, 9)); trust = -3; gm = '인기는 성적으로 만드는 겁니다.'; } }
  else if (k === 'loyal'){ if (ok){ add(ri(6, 12)); trust = 8; gm = '그 마음, 구단도 잊지 않겠습니다.'; } else { trust = 3; gm = '마음은 고맙지만 규정상 어렵네요.'; } }
  else if (k === 'transfer'){ if (ok){ add(ri(30, 60)); trust = -6; gm = '…알겠습니다. 놓칠 순 없죠. 맞춰드리죠.'; } else { add(-ri(12, 20)); trust = -15; gm = '그럼 그 팀으로 가시든가요. 우리 제시액은 낮추겠습니다.'; } }
  if (n.round > 1 && !ok && k !== 'accept') add(-5);
  pct = clamp(Math.round(pct), -40, 150);
  if (pct > -3 && pct < 3) pct = 0;
  const kind = pct >= 3 ? 'up' : pct <= -3 ? 'down' : 'keep';
  const newSalary = Math.max(MIN_SALARY, Math.round(S.salary * (1 + pct / 100) / 100) * 100);
  return {k, ok, pct, kind, trust, gm, newSalary};
}
function renderNego(){
  const n = S.nego, se = S.season;

  if (se.goals >= 10) awards.push('⚽ 두 자릿수 골'); if (se.assists >= 7) awards.push('🅰️ 도움 머신');
  if (n.avg >= 7.5 && se.apps >= 6) awards.push('⭐ 시즌 MVP 후보'); if (se.cs >= 4) awards.push('🧤 철벽');
  if (se.apps === ROUNDS) awards.push('🔋 전 경기 출전'); if (S.pop >= 75) awards.push('🌟 팬 투표 1위');
  const oddsTag = p => p >= .65 ? '<span class="odds hi">성공 가능성 높음</span>' : p >= .4 ? '<span class="odds mid">성공 가능성 보통</span>' : '<span class="odds lo">성공 가능성 낮음</span>';
  app.innerHTML = `<section class="screen">

    </div>

      <div class="talk" id="talk" style="margin-top:14px">
        <div class="line gm"><small>🧑‍💼 단장</small>${esc(n.offer > 5 ? '좋은 시즌이었어요. 인상안을 준비했습니다.' : n.offer < -3 ? '이번 시즌은 아쉬웠죠. 삭감이 불가피합니다.' : '무난한 시즌이었네요. 동결 수준으로 생각합니다.')}</div>
        ${n.log.map(l => `<div class="line me"><small>나</small>${esc(l.me)}</div><div class="line gm"><small>🧑‍💼 단장</small>${esc(l.gm)}</div>`).join('')}
      </div>

    </div>
  </section>`;
  if (n.result) return showVerdict(false);
  $('#negoBody').innerHTML = `<p class="hint" style="margin:14px 0 0">어떻게 어필할까요? 결과에 따라 <b>상승 · 유지 · 삭감</b>이 결정돼요.</p>
    <div class="appeals">${Object.entries(APPEALS).map(([k,a],i) => `<button class="appeal" type="button" data-k="${k}" ${n.used.includes(k) ? 'disabled' : ''} style="animation-delay:${i*60}ms">
      <span class="i">${a.i}</span><span class="n">${a.n}</span><span class="d">${esc(a.d)}</span>${k === 'accept' ? '<span class="odds hi">확정 · 신뢰 +5</span>' : oddsTag(appealOdds(k))}</button>`).join('')}</div>`;
  app.querySelectorAll('.appeal').forEach(b => b.onclick = () => negotiate(b.dataset.k));
}
async function negotiate(k){
  const n = S.nego, a = APPEALS[k];
  app.querySelectorAll('.appeal').forEach(b => b.disabled = true);
  const res = rollAppeal(k);
  n.used.push(k); n.result = res; n.log.push({me: a.line, gm: res.gm});
  if (res.trust) S.trust = clamp(S.trust + res.trust, 0, 100);
  save();
  const talk = $('#talk');
  talk.insertAdjacentHTML('beforeend', `<div class="line me"><small>나</small>${esc(a.line)}</div><div class="line gm" id="typing"><small>🧑‍💼 단장</small><span class="dots"><span>●</span><span>●</span><span>●</span></span></div>`);
  $('#negoBody').innerHTML = '';
  await wait(1300);
  $('#typing').innerHTML = `<small>🧑‍💼 단장</small>${esc(res.gm)}`; $('#typing').removeAttribute('id');
  await wait(400);
  showVerdict(true);
}
function showVerdict(anim){
  const n = S.nego, r = n.result;
  const label = {up:`상승 ▲ ${r.pct}%`, keep:'유지 ━', down:`삭감 ▼ ${Math.abs(r.pct)}%`}[r.kind];
  const canRetry = n.round === 1 && r.k !== 'accept';
  $('#negoBody').innerHTML = `<div class="verdict">
      <span class="stampv ${r.kind}">${label}</span>
      <div class="money"><small>제시된 새 연봉</small><span id="newSal">${money(S.salary)}</span></div>
      ${r.trust ? `<div class="chips">${chipsHtml([['감독 신뢰', r.trust]])}</div>` : ''}
      <div class="btnrow">
        ${canRetry ? `<button class="btn sub" id="retry" type="button">🔁 재협상 (1회 · 신뢰 −4)</button>` : ''}

      </div>
      ${canRetry ? '<p class="hint" style="margin:8px 0 0">재협상에서 실패하면 결과가 더 나빠질 수 있어요.</p>' : ''}
    </div>`;
  const el = $('#newSal');

    const f = now => { const p = Math.min(1, (now - t0) / 1100), e = 1 - Math.pow(1 - p, 3); el.textContent = money(Math.round((from + (to - from) * e) / 10) * 10); if (p < 1) requestAnimationFrame(f); };

  $('#sign').onclick = signContract;
}
function signContract(){
  const n = S.nego, r = n.result, se = S.season;
  const ad = S.pop >= 40 ? Math.round(S.pop * 25 / 100) * 100 : 0;
  S.earn += r.newSalary + ad;
  S.history.push({year:S.year, age:S.age, club:S.club, apps:se.apps, goals:se.goals, assists:se.assists, avg: se.ratings.length ? n.avg.toFixed(2) : '-', salary:r.newSalary, change:r.pct});
  addNews(`[오피셜] ${S.name}, ${money(r.newSalary)}에 재계약 (${r.kind === 'up' ? `${r.pct}% 인상` : r.kind === 'down' ? `${Math.abs(r.pct)}% 삭감` : '동결'})${ad ? ` · 광고 수입 ${money(ad)}` : ''}`);
  S.salary = r.newSalary; S.best.salary = Math.max(S.best.salary, S.salary);
  // 비시즌: 나이·성장/노쇠
  S.age++; S.year++;
  const msgs = [];
  if (S.age <= 23){ const k = STAT_KEYS.filter(k => POS[S.pos].w[k] > .1); const kk = pick(k); const g = ri(1, 3); S.stats[kk] = clamp(S.stats[kk] + g, 1, 99); msgs.push(`${statName(kk, S.pos)} +${g} 자연 성장`); }
  if (S.age >= 30){ STAT_KEYS.forEach(k => { const d = ri(0, Math.max(1, S.age - 29)); S.stats[k] = clamp(S.stats[k] - d, 1, 99); }); msgs.push('노쇠화로 능력치 하락'); }
  S.pop = Math.round(S.pop * .9); S.trust = Math.round(50 + (S.trust - 50) * .6); S.cond = 100; S.injury = 0;
  S.season = freshSeason(); S.round = 0; S.schedule = makeSchedule(S.club); S.nego = null;
  if (S.age >= RETIRE_AGE){ S.phase = 'retired'; addNews(`${S.name}, ${S.age}세로 현역 은퇴 선언`); }
  else { S.phase = 'week'; toast(`${S.year} 시즌 시작! ${msgs.join(' · ')}`); }
  go();
}

// ---------- retired ----------
function renderRetired(){
  const tot = S.history.reduce((a, h) => ({apps:a.apps + h.apps, goals:a.goals + h.goals, assists:a.assists + h.assists}), {apps:0, goals:0, assists:0});
  app.innerHTML = `<section class="screen">
    <div class="card pad" style="text-align:center">
      <div style="font-size:48px">🏆</div><h2 style="margin:4px 0">${esc(S.name)} 은퇴</h2>
      <p class="hint" style="margin:0">${POS[S.pos].name} · ${esc(S.club)} · 최종 인기도 ${S.pop} (${popTier(S.pop)})</p>
      <div class="sum" style="margin-top:14px">${[['통산 출전',tot.apps],['통산 골',tot.goals],['통산 도움',tot.assists],['최고 연봉',money(S.best.salary)]].map(([k,v],i) => `<div class="card tile" style="animation:pop .4s ${i*80}ms ease both"><b style="font-size:17px">${v}</b><span>${k}</span></div>`).join('')}</div>
      <p class="hint">누적 수입 ${money(S.earn)} · 최고 평점 ${S.best.rating || '-'}</p>
      <button class="btn primary block" id="again" type="button">새 커리어 시작</button>
    </div>
    <div class="section-title">커리어 기록</div><div class="card tbl">${historyTable()}</div>
  </section>`;
  confetti(['#f5c518','#fff','#3cc178']);
  $('#again').onclick = () => { S = null; lsSet(SAVE_KEY, ''); go(); };
}

// ---------- FX ----------
function flash(text){
  if (RM) return;
  const el = document.createElement('div'); el.className = 'flashfx'; el.innerHTML = `<b>${esc(text)}</b>`;
  document.body.appendChild(el); setTimeout(() => el.remove(), 1300);
}
function confetti(colors){
  if (RM) return;
  const cv = $('#confetti'), ctx = cv.getContext('2d'), dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const ps = Array.from({length: 120}, () => ({x: innerWidth / 2 + rand(-60, 60), y: innerHeight * .45, vx: rand(-7, 7), vy: rand(-15, -5), g: rand(.35, .5),
    w: rand(6, 12), h: rand(8, 16), r: rand(0, 6), vr: rand(-.2, .2), c: pick(colors), ball: Math.random() < .06}));
  const t0 = performance.now();
  const tick = now => {
    const t = now - t0; ctx.clearRect(0, 0, innerWidth, innerHeight); ctx.globalAlpha = Math.max(0, 1 - Math.max(0, t - 1600) / 600);
    for (const p of ps){ p.vy += p.g; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      if (p.ball){ ctx.font = '18px sans-serif'; ctx.fillText('⚽', -9, 6); } else { ctx.fillStyle = p.c; ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h * Math.abs(Math.cos(p.r * 2))); }
      ctx.restore(); }
    if (t < 2200) requestAnimationFrame(tick); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  };
  requestAnimationFrame(tick);
}

$('#resetBtn').onclick = () => { if (S && !confirm('지금 커리어를 지우고 새로 시작할까요?')) return; S = null; lsSet(SAVE_KEY, ''); go(); };

S = load();
go();
})();
</script>
