<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Pitch Career</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
/* 레이아웃 컨셉: 야간 경기장 위에 떠 있는 세로형 게임 HUD — 상단 자원 바, 가운데 장면, 하단 도크 */
:root{
  --night:#0a0f1f; --night-2:#101833; --panel:#141c39; --panel-2:#1c2650; --edge:#2a3672;
  --ink:#f2f4ff; --muted:#9aa5d1; --dim:#6b75a3;
  --gold:#ffc83d; --gold-d:#b98200; --hot:#ff4d6d; --hot-d:#a8203b; --cyan:#3dd6ff; --cyan-d:#157a99;
  --turf:#22c55e; --turf-d:#0f7a35; --up:#4ade80; --down:#ff6b81; --paper:#f6f0dc; --paper-ink:#2a2216;
  --f-display:"Black Han Sans","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --f-fun:"Jua","Noto Sans KR",sans-serif;
  --f-body:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent;cursor:pointer}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.disp{font-family:var(--f-display);font-weight:400;letter-spacing:.01em}

/* ---------- 배경: 조명탑 + 잔디 ---------- */
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;
  background:
    radial-gradient(60% 40% at 15% -5%,rgba(255,240,200,.18),transparent 70%),
    radial-gradient(60% 40% at 85% -5%,rgba(200,230,255,.16),transparent 70%),
    linear-gradient(180deg,#0a0f1f 0%,#0c1430 55%,#0b2a1c 78%,#0d3a22 100%)}
#bg::before{content:"";position:absolute;left:-20%;right:-20%;bottom:0;height:34%;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 60px,transparent 60px 120px);
  transform:perspective(500px) rotateX(55deg);transform-origin:bottom}
#bg::after{content:"";position:absolute;top:-30%;left:-40%;width:60%;height:160%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.05),transparent);animation:sweep 9s ease-in-out infinite}

.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 120px}
.screen{animation:enter .35s cubic-bezier(.2,.8,.2,1) both}
.panel{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:2px solid var(--edge);border-radius:18px;box-shadow:0 6px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.07)}
.pad{padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.muted{color:var(--muted)}
.small{font-size:12px}
.label{font-family:var(--f-display);font-size:13px;letter-spacing:.06em;color:var(--muted)}

/* ---------- 3D 버튼 ---------- */
.btn{--c:var(--gold);--cs:var(--gold-d);--ct:#231700;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 18px;
  background:var(--c);color:var(--ct);font-family:var(--f-display);font-size:18px;letter-spacing:.02em;box-shadow:0 5px 0 var(--cs),0 8px 18px rgba(0,0,0,.35);
  transition:transform .08s,box-shadow .08s,filter .15s;position:relative;top:0}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--cs),0 3px 8px rgba(0,0,0,.35)}
.btn:disabled{filter:grayscale(.8) brightness(.7);cursor:not-allowed;transform:none}
.btn.cyan{--c:var(--cyan);--cs:var(--cyan-d);--ct:#04202b}
.btn.hot{--c:var(--hot);--cs:var(--hot-d);--ct:#fff}
.btn.turf{--c:var(--turf);--cs:var(--turf-d);--ct:#03200d}
.btn.dark{--c:var(--panel-2);--cs:#0b112a;--ct:var(--ink);border:2px solid var(--edge)}
.btn.block{width:100%}
.btn.sm{font-size:15px;padding:10px 14px;border-radius:12px}

/* ---------- HUD ---------- */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(8,12,28,.88);backdrop-filter:blur(8px);border-bottom:2px solid var(--edge)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:#080c1c}
.hud-in{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;flex-direction:column;gap:8px}
.hud-me{display:flex;align-items:center;gap:10px}
.hud-me b{display:block;font-family:var(--f-display);font-size:17px;line-height:1.1}
.hud-me small{color:var(--muted);font-size:12px}
.ovr-badge{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-size:20px;color:#1b1300;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.tier-bronze{background:linear-gradient(135deg,#e2a46b,#9c5a2c)}
.tier-silver{background:linear-gradient(135deg,#f1f4fa,#9aa3b5)}
.tier-gold{background:linear-gradient(135deg,#ffe58a,#d19a00)}
.tier-icon{background:linear-gradient(135deg,#ffd6ff,#8f7bff,#4fd1ff);background-size:200% 200%;animation:holo 3s ease infinite;color:#1a0b3a}
.icon-btn{margin-left:auto;width:38px;height:38px;border-radius:12px;border:2px solid var(--edge);background:var(--panel);font-size:17px}
.hud-res{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.res{display:flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:4px 7px;min-width:0}
.res .ic{font-size:13px}
.res .bar{flex:1;height:6px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;min-width:14px}
.res .bar i{display:block;height:100%;border-radius:999px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.res b{font-family:var(--f-display);font-size:13px;font-weight:400;font-variant-numeric:tabular-nums}
.res.money b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 도크 ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(8,12,28,.94);backdrop-filter:blur(8px);border-top:2px solid var(--edge);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.dock-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.dock button{background:none;border:0;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--dim);font-family:var(--f-display);font-size:12px;position:relative}
.dock button .i{font-size:22px;filter:grayscale(.7);transition:transform .2s,filter .2s}
.dock button[aria-selected="true"]{color:var(--gold)}
.dock button[aria-selected="true"] .i{filter:none;transform:translateY(-3px) scale(1.15)}
.dock button[aria-selected="true"]::after{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}

/* ---------- 엠블럼 ---------- */
.crest{flex:none;width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font-family:var(--f-display);font-size:14px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.4),0 3px 0 rgba(0,0,0,.35)}
.crest.lg{width:52px;height:52px;font-size:22px}
.crest.xl{width:72px;height:72px;font-size:30px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.45),0 5px 0 rgba(0,0,0,.4),0 0 30px rgba(255,255,255,.08)}

/* ---------- 타이틀 ---------- */
.title{min-height:calc(100vh - 40px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding-block:40px}
.logo{font-family:var(--f-display);font-size:clamp(54px,17vw,92px);line-height:.9;letter-spacing:-.01em;
  background:linear-gradient(180deg,#fff 10%,var(--gold) 60%,#ff9f1c);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 0 #6b3f00) drop-shadow(0 18px 30px rgba(0,0,0,.6));animation:logoIn .8s cubic-bezier(.3,1.5,.6,1) both}
.logo small{display:block;font-size:.32em;letter-spacing:.35em;-webkit-text-fill-color:var(--cyan);color:var(--cyan);margin-top:6px}
.title .ball{font-size:56px;animation:bounce 1.1s cubic-bezier(.3,0,.7,1) infinite}
.title .menu{display:flex;flex-direction:column;gap:14px;width:min(320px,100%)}
.title .tip{font-size:13px;color:var(--muted);max-width:320px;margin:0}
.title a{color:var(--muted);font-size:13px}

/* ---------- 생성 ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field input{background:#0b1128;border:2px solid var(--edge);border-radius:12px;padding:12px 14px;font-size:17px;font-weight:700}
.field input:focus{outline:none;border-color:var(--cyan)}
.pos-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pos{border:2px solid var(--edge);background:var(--panel);border-radius:14px;padding:12px 4px;text-align:center;transition:transform .15s,border-color .15s,background .15s}
.pos b{display:block;font-family:var(--f-display);font-weight:400;font-size:22px}
.pos small{color:var(--muted);font-size:11px}
.pos.on{border-color:var(--gold);background:linear-gradient(180deg,#3a2f0c,#211a06);transform:translateY(-3px)}
.club-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.club{border:2px solid var(--edge);background:var(--panel);border-radius:14px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:700;transition:transform .15s,border-color .15s;min-width:0}
.club span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.club.on{border-color:var(--gold);transform:translateY(-3px);box-shadow:0 0 0 3px rgba(255,200,61,.25)}
.mgr-card{display:flex;gap:12px;align-items:flex-start}
.mgr-face{flex:none;width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:32px;background:radial-gradient(circle at 30% 30%,#2e3a7a,#141c39);border:2px solid var(--edge)}
.mgr-card h4{margin:0;font-family:var(--f-display);font-weight:400;font-size:18px}
.mtype{display:inline-block;font-family:var(--f-display);font-size:12px;padding:2px 9px;border-radius:999px;background:rgba(61,214,255,.15);color:var(--cyan);margin-left:4px;vertical-align:2px}
.wealth{display:inline-block;font-size:11px;font-weight:900;padding:2px 8px;border-radius:999px;background:rgba(255,200,61,.14);color:var(--gold)}

/* ---------- 허브 ---------- */
.next{padding:14px 14px 18px;position:relative;overflow:hidden}
.next::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 90% at 50% 120%,rgba(34,197,94,.25),transparent 70%);pointer-events:none}
.next-top{display:flex;justify-content:space-between;gap:8px;position:relative}
.tag{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--muted)}
.tag.gold{background:rgba(255,200,61,.15);color:var(--gold)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;margin-top:12px;position:relative}
.vs .side{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.vs .side b{font-family:var(--f-display);font-weight:400;font-size:16px;line-height:1.15}
.vs .side small{color:var(--muted);font-size:11px}
.vs-mid{font-family:var(--f-display);font-size:34px;color:var(--gold);text-shadow:0 4px 0 #6b3f00,0 0 24px rgba(255,200,61,.5);animation:pulse 1.8s ease-in-out infinite}
.row2{display:grid;grid-template-columns:1.25fr 1fr;gap:10px}
.mgr-mini{display:flex;align-items:center;gap:10px;padding:12px}
.mgr-mini .mgr-face{width:46px;height:46px;font-size:26px;border-radius:13px}
.mgr-mini b{display:block;font-family:var(--f-display);font-weight:400;font-size:15px;line-height:1.2}
.mgr-mini small{color:var(--muted);font-size:11px;display:block}
.mood{font-size:12px;font-weight:700}
.fortune{perspective:700px;border:0;background:none;padding:0;min-height:86px}
.f-inner{position:relative;width:100%;height:100%;min-height:86px;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.3,.5,1)}
.fortune.open .f-inner{transform:rotateY(180deg)}
.f-back,.f-front{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:2px solid var(--edge);padding:6px}
.f-back{background:repeating-linear-gradient(45deg,#2a1f5c 0 10px,#231a4d 10px 20px);font-size:28px;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.f-back small{font-family:var(--f-display);font-size:12px;color:var(--gold)}
.fortune:not(.open) .f-back{animation:wobble 2.6s ease-in-out infinite}
.f-front{transform:rotateY(180deg);background:linear-gradient(180deg,#2b2361,#181238);box-shadow:0 6px 0 rgba(0,0,0,.35)}
.f-front b{font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1}
.f-front small{font-size:11px;color:var(--muted);text-align:center;line-height:1.3}
.note{position:relative;background:var(--paper);color:var(--paper-ink);border-radius:6px 6px 14px 14px;padding:22px 16px 14px;box-shadow:0 6px 0 rgba(0,0,0,.35);transform:rotate(-.6deg)}
.note::before{content:"";position:absolute;top:-10px;left:50%;width:90px;height:22px;margin-left:-45px;border-radius:6px;background:linear-gradient(180deg,#c9ced9,#8d94a5);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.note-head{font-family:var(--f-display);font-size:14px;letter-spacing:.04em;color:#6b5a32}
.note p{margin:4px 0 0;font-weight:700;font-size:15px;line-height:1.55}
.note .hint{margin-top:8px;font-size:12px;color:#7a6a45;font-weight:400}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.act{--c1:#2a3672;--c2:#1a2350;border:0;border-radius:16px;padding:12px 4px 10px;background:linear-gradient(180deg,var(--c1),var(--c2));color:var(--ink);
  box-shadow:0 5px 0 rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.15);display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .08s,box-shadow .08s;animation:dealIn .45s cubic-bezier(.3,1.4,.6,1) both}
.act:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.45)}
.act:disabled{filter:grayscale(.7) brightness(.7);cursor:default}
.act .i{font-size:28px;line-height:1.1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
.act .n{font-family:var(--f-display);font-size:13px}
.act .d{font-size:10px;color:rgba(255,255,255,.7);line-height:1.2;text-align:center}
.act.t-sho{--c1:#d9485f;--c2:#8e1e33}.act.t-pas{--c1:#2f8fdd;--c2:#164f86}.act.t-dri{--c1:#9b5de5;--c2:#572a8f}.act.t-def{--c1:#4b5d7a;--c2:#27334a}
.act.t-phy{--c1:#e07a1f;--c2:#8a4207}.act.t-rest{--c1:#1fa37a;--c2:#0b5c43}.act.t-fan{--c1:#e0479e;--c2:#86195a}.act.t-talk{--c1:#c9a227;--c2:#6f5608}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.switch{position:relative;width:48px;height:28px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:999px;background:#0b1128;border:2px solid var(--edge);transition:background .2s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.switch input:checked + span{background:var(--turf-d)}
.switch input:checked + span::after{transform:translateX(20px);background:#fff}
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.strip div{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:8px 4px;text-align:center;min-width:0}
.strip b{display:block;font-family:var(--f-display);font-weight:400;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip span{font-size:11px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font-size:12px;font-weight:900;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.08);animation:pop .4s cubic-bezier(.3,1.6,.6,1) both}
.chip.up{color:var(--up);background:rgba(74,222,128,.14)}
.chip.down{color:var(--down);background:rgba(255,107,129,.14)}
.trait{display:inline-flex;gap:4px;align-items:center;font-size:12px;font-weight:900;padding:4px 10px;border-radius:999px;border:1px solid var(--gold);color:var(--gold);background:rgba(255,200,61,.08)}
.injury{background:rgba(255,77,109,.12);border:2px solid var(--hot);border-radius:14px;padding:10px 12px;font-weight:700;font-size:14px}

/* ---------- 선수 카드 ---------- */
.pcard{position:relative;margin:0 auto;width:min(270px,100%);aspect-ratio:3/4;max-width:100%;padding:18px 18px 30px;color:#1b1300;
  clip-path:polygon(10% 0,90% 0,100% 7%,100% 86%,50% 100%,0 86%,0 7%);overflow:hidden;animation:cardIn .7s cubic-bezier(.3,1.4,.6,1) both}
.pcard::after{content:"";position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);animation:shine 3.5s ease-in-out infinite;pointer-events:none}
.pcard .top{display:flex;justify-content:space-between;align-items:flex-start}
.pcard .ovr{font-family:var(--f-display);font-size:52px;line-height:.9}
.pcard .pp{font-family:var(--f-display);font-size:18px;display:block}
.pcard .avatar{font-size:76px;text-align:center;line-height:1.1;margin-top:-6px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.2))}
.pcard .nm{font-family:var(--f-display);font-size:24px;text-align:center;border-bottom:2px solid rgba(0,0,0,.2);padding-bottom:4px;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .st{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;font-family:var(--f-display);font-size:16px}
.pcard .st span{display:flex;justify-content:space-between}
.pcard .st small{font-family:var(--f-body);font-weight:900;font-size:12px;opacity:.75}
.statbars{display:flex;flex-direction:column;gap:10px}
.sb{display:grid;grid-template-columns:58px 1fr 34px;align-items:center;gap:10px;font-size:13px;font-weight:700}
.sb .t{height:12px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.sb .t i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--cyan),var(--turf));transform-origin:left;animation:growX .9s cubic-bezier(.2,.8,.2,1) both}
.sb b{font-family:var(--f-display);font-weight:400;font-size:17px;text-align:right}
.tbl{overflow-x:auto}
table.hist{width:100%;border-collapse:collapse;font-size:13px;min-width:460px}
table.hist th,table.hist td{padding:9px 6px;border-bottom:1px solid var(--edge);text-align:center;font-variant-numeric:tabular-nums}
table.hist th{color:var(--muted);font-weight:700;font-size:12px}
.news{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.news li{background:var(--paper);color:var(--paper-ink);border-radius:8px;padding:10px 12px;font-weight:700;font-size:14px;box-shadow:0 4px 0 rgba(0,0,0,.35);animation:dealIn .4s ease both}
.news li small{display:block;font-weight:400;color:#7a6a45;font-size:11px}

/* ---------- 경기 ---------- */
.stadium{position:relative;border-radius:20px;overflow:hidden;border:2px solid var(--edge);box-shadow:0 6px 0 rgba(0,0,0,.4);
  background:radial-gradient(80% 60% at 50% 0%,rgba(255,255,255,.12),transparent 60%),repeating-linear-gradient(90deg,#14883f 0 34px,#117536 34px 68px)}
.stadium::before{content:"";position:absolute;inset:10px;border:2px solid rgba(255,255,255,.35);border-radius:6px;pointer-events:none}
.stadium::after{content:"";position:absolute;left:50%;top:50%;width:90px;height:90px;margin:-45px 0 0 -45px;border:2px solid rgba(255,255,255,.35);border-radius:50%;pointer-events:none}
.led{position:relative;z-index:1;margin:18px 14px 0;background:#04060f;border:3px solid #1b2240;border-radius:14px;padding:12px 10px;box-shadow:inset 0 0 20px rgba(0,0,0,.8),0 6px 0 rgba(0,0,0,.4)}
.led-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.led .tm{display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--f-display);font-size:13px;min-width:0;text-align:center;line-height:1.15}
.led-sc{font-family:var(--f-display);font-size:48px;color:#ffb627;text-shadow:0 0 12px rgba(255,182,39,.7),0 0 2px #fff;letter-spacing:.06em;font-variant-numeric:tabular-nums;text-align:center}
.led-sc.bump{animation:bump .5s ease}
.led-min{display:block;width:max-content;margin:4px auto 0;font-family:var(--f-display);color:#ff4d4d;text-shadow:0 0 10px rgba(255,77,77,.7);font-size:16px}
.mom{position:relative;z-index:1;margin:12px 14px 0;height:10px;border-radius:999px;overflow:hidden;display:flex;background:#000;border:2px solid rgba(0,0,0,.5)}
.mom i{display:block;height:100%;transition:width .35s ease}
.myrole{position:relative;z-index:1;text-align:center;font-family:var(--f-display);font-size:14px;padding:10px 12px 16px;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.feed{list-style:none;margin:0;padding:6px 14px;max-height:340px;overflow-y:auto}
.feed li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--edge);font-size:14px;animation:slideIn .35s cubic-bezier(.2,.8,.2,1) both}
.feed li:last-child{border-bottom:0}
.feed .m{flex:none;width:34px;font-family:var(--f-display);color:var(--dim);font-variant-numeric:tabular-nums}
.feed li.me{color:var(--gold);font-weight:900}
.feed li.opp{color:var(--down)}
.feed li.fl{color:var(--muted);font-size:13px}
.feed li.big{color:var(--cyan);font-weight:900}
.res-card{text-align:center;padding:18px 16px;animation:pop .5s cubic-bezier(.3,1.5,.6,1) both}
.rating{display:inline-grid;place-items:center;width:96px;height:96px;border-radius:24px;font-family:var(--f-display);font-size:42px;box-shadow:0 6px 0 rgba(0,0,0,.4);margin:6px 0}
.flashfx{position:fixed;inset:0;z-index:45;display:grid;place-items:center;pointer-events:none}
.flashfx b{font-family:var(--f-display);font-weight:400;font-size:clamp(60px,18vw,120px);color:#fff;-webkit-text-stroke:3px #6b3f00;text-shadow:0 8px 0 #6b3f00,0 0 40px rgba(255,200,61,.8);animation:goal 1.3s cubic-bezier(.3,1.4,.6,1) both}

/* ---------- 모달 ---------- */
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(3,6,16,.72);backdrop-filter:blur(4px);animation:fadeIn .2s ease both;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.modal.out{animation:fadeOut .22s ease both}
.modal-card{width:min(420px,100%);background:linear-gradient(180deg,var(--panel-2),var(--panel));border:3px solid var(--gold);border-radius:22px;padding:20px 18px;text-align:center;
  box-shadow:0 10px 0 rgba(0,0,0,.45),0 0 60px rgba(255,200,61,.2);animation:zoomIn .45s cubic-bezier(.3,1.5,.6,1) both}
.modal-card .eyebrow{font-family:var(--f-display);color:var(--gold);letter-spacing:.12em;font-size:13px}
.modal-card .big{font-size:58px;line-height:1.15;animation:wobble 2s ease-in-out infinite}
.modal-card h3{margin:2px 0 6px;font-family:var(--f-display);font-weight:400;font-size:24px}
.modal-card p{margin:0 0 14px;color:var(--muted);min-height:1.5em}
.choice-list{display:flex;flex-direction:column;gap:10px}
.outcome{background:#0b1128;border:2px dashed var(--edge);border-radius:14px;padding:12px;margin:4px 0 12px;font-weight:700;animation:pop .45s ease both}
.suspense{font-family:var(--f-display);font-size:24px;letter-spacing:.2em;color:var(--gold);margin:8px 0 14px;text-align:center}

/* PK */
.goalbox{position:relative;height:160px;margin:6px 0 14px;border:6px solid #fff;border-bottom:0;border-radius:6px 6px 0 0;overflow:hidden;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.12) 0 2px,transparent 2px 16px),repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 2px,transparent 2px 16px),#0d3a22}
.goalbox .keeper{position:absolute;bottom:6px;left:50%;font-size:52px;transform:translateX(-50%);transition:left .45s cubic-bezier(.3,1.2,.5,1),transform .45s}
.goalbox .keeper.d0{transform:translateX(-50%) rotate(-70deg)}.goalbox .keeper.d2{transform:translateX(-50%) rotate(70deg)}
.goalbox .pkball{position:absolute;left:50%;top:110%;font-size:30px;transform:translate(-50%,-50%);transition:left .5s ease-out,top .5s ease-out,transform .5s}
.goalbox .pkball.shot{transform:translate(-50%,-50%) scale(.7) rotate(540deg)}
.pk-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* ---------- 기자회견 ---------- */
.press{position:relative;height:150px;border-radius:20px;overflow:hidden;border:2px solid var(--edge);
  background:repeating-linear-gradient(90deg,#1b2a6b 0 70px,#14205a 70px 140px);box-shadow:0 6px 0 rgba(0,0,0,.4)}
.press .wall{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:50px;align-items:center;justify-items:center;
  font-family:var(--f-display);font-size:13px;color:rgba(255,255,255,.22);letter-spacing:.1em}
.press .table{position:absolute;left:8%;right:8%;bottom:0;height:46px;background:linear-gradient(180deg,#2b2f45,#151827);border-radius:10px 10px 0 0;display:flex;justify-content:center;gap:28px;align-items:flex-start}
.press .table span{font-size:32px;margin-top:-26px}
.press .flash{position:absolute;width:140px;height:140px;margin:-70px 0 0 -70px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.9),rgba(255,255,255,0) 60%);opacity:0;animation:flash 3.2s infinite}
.dlg{position:relative;padding:14px 16px 16px;min-height:96px;margin-top:6px}
.dlg-name{position:absolute;top:-14px;left:14px;font-family:var(--f-display);font-size:13px;background:var(--cyan);color:#04202b;padding:3px 12px;border-radius:8px;box-shadow:0 3px 0 var(--cyan-d)}
.dlg p{margin:8px 0 0;font-size:16px;font-weight:700;line-height:1.55;min-height:2.6em}
.dlg .caret{display:inline-block;width:8px;height:16px;background:var(--gold);margin-left:3px;vertical-align:-2px;animation:blink 1s steps(2) infinite}
.vn{display:flex;flex-direction:column;gap:9px}
.vn button{display:flex;align-items:center;gap:10px;text-align:left;border:2px solid var(--edge);background:linear-gradient(180deg,#1f2a5c,#141c3d);border-radius:14px;padding:12px 14px;font-size:15px;font-weight:700;
  box-shadow:0 4px 0 rgba(0,0,0,.4);transition:transform .1s,border-color .15s,opacity .2s;animation:dealIn .4s cubic-bezier(.3,1.4,.6,1) both}
.vn button:hover:not(:disabled){border-color:var(--gold);transform:translateX(4px)}
.vn button:disabled{cursor:default}
.vn button .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--gold);color:#231700;display:grid;place-items:center;font-family:var(--f-display);font-size:14px}
.vn button.picked{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,200,61,.35),0 4px 0 rgba(0,0,0,.4)}
.vn button.faded{opacity:.3}
.press-mood{font-size:13px;color:var(--muted);text-align:center}
.paper{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:14px 16px;font-family:"Nanum Myeongjo","AppleMyungjo","Batang",serif;box-shadow:0 8px 0 rgba(0,0,0,.35);animation:paperIn .65s cubic-bezier(.3,1.3,.6,1) both}
.paper .mast{display:flex;justify-content:space-between;font-size:11px;border-bottom:3px double currentColor;padding-bottom:4px;margin-bottom:10px;opacity:.8;font-family:var(--f-display)}
.paper h3{margin:0;font-size:21px;line-height:1.35;text-wrap:balance}
.paper p{margin:8px 0 0;font-size:14px;opacity:.85}
.opinion .scale{position:relative;height:16px;border-radius:999px;background:linear-gradient(90deg,var(--hot),#555b7a 50%,var(--turf));border:2px solid rgba(0,0,0,.4);margin-top:6px}
.opinion .needle{position:absolute;top:-8px;left:50%;width:8px;height:28px;margin-left:-4px;border-radius:4px;background:#fff;box-shadow:0 0 0 2px #000,0 0 14px rgba(255,255,255,.6);transition:left 1.1s cubic-bezier(.3,1.6,.5,1)}
.opinion .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;font-family:var(--f-display)}
.fans{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.fans li{font-size:14px;background:#0b1128;border:1px solid var(--edge);border-radius:12px;padding:8px 10px;animation:slideIn .35s ease both}
.fans li b{color:var(--cyan);font-size:12px;margin-right:6px}
.twist{padding:10px 12px;border-radius:12px;border:2px dashed var(--gold);font-size:14px;font-weight:700;animation:pop .45s ease both}
.twist.coach{border-style:solid;border-color:var(--edge)}

/* ---------- 협상실 ---------- */
.office{padding:14px;display:flex;flex-direction:column;gap:12px}
.talk{display:flex;flex-direction:column;gap:8px}
.talk .line{padding:10px 12px;border-radius:14px;max-width:88%;font-size:14px;font-weight:700;animation:dealIn .35s ease both}
.talk .me{align-self:flex-end;background:var(--cyan);color:#04202b;border-bottom-right-radius:4px}
.talk .gm{align-self:flex-start;background:#0b1128;border:1px solid var(--edge);border-bottom-left-radius:4px}
.talk small{display:block;font-size:11px;opacity:.7;font-weight:900}
.memo{background:var(--paper);color:var(--paper-ink);border-radius:8px;padding:10px 12px;font-size:13px;font-weight:700;transform:rotate(.8deg);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.appeals{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.appeal{text-align:left;border:2px solid var(--edge);background:linear-gradient(180deg,#1f2a5c,#141c3d);border-radius:16px;padding:12px;box-shadow:0 5px 0 rgba(0,0,0,.4);transition:transform .1s,border-color .15s;animation:dealIn .45s cubic-bezier(.3,1.4,.6,1) both;min-width:0}
.appeal:hover:not(:disabled){border-color:var(--gold);transform:translateY(-3px)}
.appeal:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.4)}
.appeal:disabled{opacity:.35;cursor:not-allowed}
.appeal .i{font-size:26px}
.appeal .n{display:block;font-family:var(--f-display);font-size:16px}
.appeal .d{display:block;font-size:12px;color:var(--muted)}
.odds{display:inline-block;margin-top:6px;font-size:11px;font-weight:900;padding:2px 8px;border-radius:999px}
.odds.hi{background:rgba(74,222,128,.15);color:var(--up)}.odds.mid{background:rgba(255,200,61,.15);color:var(--gold)}.odds.lo{background:rgba(255,107,129,.15);color:var(--down)}
.verdict{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.stampv{display:inline-block;font-family:var(--f-display);font-size:34px;padding:6px 20px;border:5px solid currentColor;border-radius:12px;transform:rotate(-7deg);animation:stamp .55s cubic-bezier(.3,1.6,.6,1) both}
.stampv.up{color:var(--up)}.stampv.keep{color:var(--muted)}.stampv.down{color:var(--down)}
.moneyv{font-family:var(--f-display);font-size:32px;font-variant-numeric:tabular-nums}
.offer{display:flex;align-items:center;gap:10px;padding:12px;border:2px solid var(--cyan);border-radius:16px;background:rgba(61,214,255,.08);animation:dealIn .45s ease both;text-align:left;width:100%}
.offer b{font-family:var(--f-display);font-weight:400;font-size:16px;display:block}
.offer small{color:var(--muted);font-size:12px}
.offer .btn{margin-left:auto;flex:none}
.awards{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.award{font-size:12px;font-weight:900;padding:4px 10px;border-radius:999px;border:2px solid var(--gold);color:var(--gold);animation:pop .4s ease both}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 150px);z-index:60;transform:translate(-50%,-10px);background:#fff;color:#111;font-weight:900;padding:10px 16px;border-radius:14px;
  box-shadow:0 5px 0 rgba(0,0,0,.4);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center;font-size:14px}
#toast.show{opacity:1;transform:translate(-50%,0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:55}
[hidden]{display:none!important}

/* ---------- 개성 요소 ---------- */
.crowd{position:absolute;left:0;right:0;top:14%;height:34%;opacity:.25;
  background-image:radial-gradient(circle,rgba(255,255,255,.8) 0 1px,transparent 1.6px),radial-gradient(circle,rgba(255,214,140,.7) 0 1px,transparent 1.6px);
  background-size:23px 17px,37px 29px;background-position:0 0,11px 7px;animation:twinkle 2.4s steps(3) infinite;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 45%,transparent);mask-image:linear-gradient(180deg,transparent,#000 45%,transparent)}
.shake{animation:shake .5s ease}
.dlg p,.note p,.talk .line,.speech,.outcome,.fans li,.vn button,.modal-card p{font-family:var(--f-fun);font-weight:400}
.track{display:flex;gap:5px;align-items:center;padding:10px 12px}
.track .n{flex:1;aspect-ratio:1;max-width:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:11px;background:#0b1128;border:2px solid var(--edge);color:var(--dim)}
.track .n.r-W{background:var(--turf);border-color:var(--turf-d);color:#03200d}
.track .n.r-D{background:#8a8fb5;border-color:#555b7a;color:#10142a}
.track .n.r-L{background:var(--hot);border-color:var(--hot-d);color:#fff}
.track .n.now{border-color:var(--gold);color:var(--gold);animation:pulse 1.1s ease-in-out infinite;box-shadow:0 0 12px rgba(255,200,61,.55)}
.track .lab{font-family:var(--f-display);font-size:11px;color:var(--muted);margin-right:4px;white-space:nowrap}
.speech{position:relative;font-size:16px;background:#fff;color:#1a1f3a;border-radius:16px;padding:10px 14px;box-shadow:0 4px 0 rgba(0,0,0,.35);animation:pop .45s cubic-bezier(.3,1.6,.6,1) both;margin-bottom:-4px}
.speech::after{content:"";position:absolute;left:34px;bottom:-10px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}
.report-tag{display:inline-block;font-family:var(--f-display);font-size:11px;padding:2px 8px;border-radius:6px;margin-left:6px;vertical-align:1px;color:#fff;background:#3a4f8f}
.report-tag.rumor{background:#a03070}
.splash{position:fixed;inset:0;z-index:50;display:grid;place-items:center;pointer-events:none;overflow:hidden}
.splash .band{width:140%;margin-left:-20%;padding:22px 0;background:linear-gradient(90deg,var(--gold),#ff9f1c);transform:skewY(-6deg);box-shadow:0 10px 0 rgba(0,0,0,.4);
  display:flex;align-items:center;justify-content:center;gap:16px;animation:band 1.6s cubic-bezier(.7,0,.3,1) both}
.splash .band b{font-family:var(--f-display);font-weight:400;font-size:clamp(40px,12vw,72px);color:#231700;line-height:1}
.splash .band small{display:block;font-family:var(--f-display);font-size:16px;color:#5a3a00}
.mg-bar{position:relative;height:36px;border-radius:12px;background:#0b1128;border:2px solid var(--edge);overflow:hidden;margin:10px 0 14px}
.mg-zone{position:absolute;top:0;bottom:0;background:rgba(34,197,94,.45);border-left:2px solid var(--turf);border-right:2px solid var(--turf)}
.mg-perfect{position:absolute;top:0;bottom:0;background:rgba(255,200,61,.85)}
.mg-cursor{position:absolute;top:-2px;bottom:-2px;width:6px;margin-left:-3px;background:#fff;border-radius:3px;box-shadow:0 0 10px #fff}
.mg-ball{font-size:84px;border:0;background:none;line-height:1;transition:transform .09s;touch-action:manipulation;padding:6px}
.mg-count{font-family:var(--f-display);font-size:44px;color:var(--gold);line-height:1}
.lockers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 4px}
.locker{aspect-ratio:3/4;border-radius:12px;border:3px solid #5b6aa8;background:repeating-linear-gradient(180deg,#3a4785 0 8px,#33407a 8px 10px);font-size:34px;display:grid;place-items:center;
  box-shadow:0 5px 0 rgba(0,0,0,.4);transition:transform .35s,opacity .3s}
.locker:hover:not(:disabled){transform:translateY(-4px)}
.locker.open{background:#141c39;animation:pop .45s ease both}
.react-pad{width:100%;height:150px;border-radius:16px;border:3px solid var(--edge);display:grid;place-items:center;font-family:var(--f-display);font-size:30px;background:#2a0f1e;color:var(--down);margin:10px 0 4px;user-select:none;touch-action:manipulation}
.react-pad.go{background:var(--turf);color:#03200d;border-color:var(--turf-d)}
.noiv{font-family:var(--f-fun);color:var(--muted);font-size:14px}
@keyframes twinkle{50%{opacity:.45;background-position:3px 2px,14px 9px}}
@keyframes shake{20%{transform:translate(-7px,3px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-4px,3px)}80%{transform:translate(3px,-2px)}}
@keyframes band{0%{transform:skewY(-6deg) translateX(-110%)}22%,78%{transform:skewY(-6deg) translateX(0)}100%{transform:skewY(-6deg) translateX(110%)}}

/* ---------- 리그 · 대회 · 스탯 ---------- */
.hud-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.hs{position:relative;background:#0b1128;border:1px solid var(--edge);border-radius:9px;padding:3px 2px 2px;text-align:center;line-height:1.1;min-width:0}
.hs span{display:block;font-size:10px;color:var(--muted);white-space:nowrap}
.hs b{font-family:var(--f-display);font-weight:400;font-size:17px;font-variant-numeric:tabular-nums}
.hs.mid b{color:var(--cyan)} .hs.hi b{color:var(--gold)}
.hs i{position:absolute;top:1px;right:3px;font-style:normal;font-size:9px;font-weight:900}
.hs.upd{border-color:var(--up);animation:statUp 1.2s ease}.hs.upd i{color:var(--up)}
.hs.dnd{border-color:var(--down)}.hs.dnd i{color:var(--down)}
.radar{width:min(280px,100%);height:auto;overflow:visible}
.radar-fill{transform-origin:120px 112px;animation:radarIn .8s cubic-bezier(.3,1.4,.6,1) both}
.trophy{display:inline-flex;gap:6px;align-items:center;font-family:var(--f-display);font-size:14px;padding:6px 12px;border-radius:12px;background:linear-gradient(180deg,#4a3a0c,#2a2005);border:2px solid var(--gold);color:var(--gold)}
.trophy small{font-family:var(--f-body);color:var(--muted)}
.next.cup{border-color:var(--gold);box-shadow:0 6px 0 rgba(0,0,0,.35),0 0 30px rgba(255,200,61,.25)}
.cup-banner{position:relative;margin-top:8px;text-align:center;font-family:var(--f-display);font-size:13px;color:#231700;background:linear-gradient(90deg,var(--gold),#ff9f1c);border-radius:8px;padding:4px 8px}
.track{flex-wrap:wrap}
.track .n.cupn{border-color:var(--gold);border-radius:8px}
.track .n.gone{opacity:.25}
.splash.cup .band{background:linear-gradient(90deg,#3dd6ff,#8f7bff)}
.so{display:grid;gap:6px;margin:6px 0 10px;font-size:18px}
.so div{display:flex;justify-content:space-between;align-items:center;background:#0b1128;border-radius:10px;padding:6px 10px}
.so b{font-family:var(--f-display);font-weight:400;font-size:14px}
.league{display:flex;flex-direction:column;gap:10px}
.league.mine{border-color:var(--gold)}
.lg-head{display:flex;align-items:center;gap:10px}
.lg-head b{display:block;font-family:var(--f-display);font-weight:400;font-size:18px}
.lg-head small{color:var(--muted);font-size:12px}
.lg-flag{font-size:30px}
.lg-clubs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.lg-clubs span{display:flex;align-items:center;gap:6px;background:#0b1128;border-radius:10px;padding:5px 8px;min-width:0;font-size:12px}
.lg-clubs em{font-style:normal;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-clubs b{font-family:var(--f-display);font-weight:400;color:var(--gold)}
.lg-clubs .crest{width:22px;height:22px;font-size:11px}
@keyframes statUp{0%{transform:scale(1)}20%{transform:scale(1.18);box-shadow:0 0 14px rgba(74,222,128,.7)}100%{transform:scale(1)}}
@keyframes radarIn{from{transform:scale(0);opacity:0}}

@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.98)}}
@keyframes dealIn{from{opacity:0;transform:translateY(18px) rotate(-2deg) scale(.92)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-16px)}}
@keyframes pop{0%{opacity:0;transform:scale(.5)}70%{transform:scale(1.08)}100%{opacity:1;transform:none}}
@keyframes bump{40%{transform:scale(1.25)}}
@keyframes pulse{50%{transform:scale(1.12)}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-26px)}}
@keyframes sweep{0%,100%{transform:translateX(0) rotate(10deg)}50%{transform:translateX(180%) rotate(10deg)}}
@keyframes holo{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes shine{0%,60%{transform:translateX(-60%)}100%{transform:translateX(60%)}}
@keyframes cardIn{from{opacity:0;transform:rotateY(80deg) scale(.7)}}
@keyframes growX{from{transform:scaleX(0)}}
@keyframes logoIn{from{opacity:0;transform:scale(2.2) rotate(-6deg)}}
@keyframes goal{0%{opacity:0;transform:scale(.3) rotate(-8deg)}30%{opacity:1;transform:scale(1.1)}75%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.5)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes zoomIn{from{opacity:0;transform:scale(.5) rotate(-4deg)}}
@keyframes stamp{from{opacity:0;transform:scale(2.6) rotate(-20deg)}}
@keyframes paperIn{from{opacity:0;transform:rotate(-10deg) scale(.6)}}
@keyframes blink{50%{opacity:0}}
@keyframes flash{0%,6%,100%{opacity:0}2%{opacity:1}}

@media (max-width:400px){
  .acts{gap:6px}.act .d{display:none}.act{padding:12px 2px 9px}
  .club-grid{grid-template-columns:repeat(3,1fr)}
  .appeals{grid-template-columns:1fr}
  .led-sc{font-size:40px}
  .crest.xl{width:62px;height:62px;font-size:26px}
}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

function tone(f, d = .12, type = 'square', v = .05, delay = 0){
  if (!sfxOn) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .02);
  } catch {}
}

function validPending(p){
  if (!p || typeof p !== 'object' || !CLUB[p.opp] || !Array.isArray(p.ev)) return null;
  const sides = ['us','them','sub','pk','opk','post','yellow','var','red'];
  if (!p.ev.every(e => e && sides.includes(e.side))) return null;
  if (!['start','sub','bench','injured'].includes(p.role)) return null;
  p.ev.forEach(e => { e.m = int(e.m, 0, 90, 45); if (e.dir != null) e.dir = int(e.dir, 0, 2, 1); if (e.roll != null) e.roll = clamp(Number(e.roll) || 0, 0, 1); if (e.res != null) e.res = !!e.res; });
  ['tg','og','from','mins','ovr'].forEach(k => p[k] = int(p[k], 0, 99, 0));
  p.noise = clamp(Number(p.noise) || 0, -1, 1); p.buff = clamp(Number(p.buff) || 0, -1, 1); p.home = !!p.home;
  p.fx = p.fx && ['L','C','X'].includes(p.fx.k) ? {k:p.fx.k, comp:String(p.fx.comp || '').slice(0, 30), stage:String(p.fx.stage || '').slice(0, 10)} : {k:'L', comp:'', stage:''};
  const arr = (a, f) => Array.isArray(a) && a.length === 12 ? a.map(f) : null;

function applyFx(e){
  const out = [];
  for (const [k, label] of [['pop','인기도'],['trust','감독 신뢰'],['cond','컨디션']]){
    if (!e[k]) continue;
    const before = S[k]; S[k] = clamp(S[k] + Math.round(e[k]), 0, 100);
    const d = S[k] - before; if (d) out.push([label, d, '']);
  }
  if (e.buff){ const b0 = S.buff; S.buff = r2(clamp(S.buff + e.buff, -1, 1)); const d = r2(S.buff - b0); if (d) out.push([d > 0 ? '자신감' : '부담감', d, d > 0 ? '🔥 다음 경기 자신감↑' : '😰 다음 경기 부담감↑']); }
  if (e.earn){ S.earn = Math.max(0, S.earn + e.earn); out.push(['수입', e.earn, `💰 ${e.earn > 0 ? '+' : '−'}${money(Math.abs(e.earn))}`]); }
  if (e.best){ const k = mainStat(), b = S.stats[k]; S.stats[k] = clamp(b + e.best, 1, 99); const d = S.stats[k] - b; if (d) out.push([statName(k, S.pos), d, '']); }
  return out;
}

function makeWeek(){
  const fortune = FORTUNES.indexOf(wpick(FORTUNES));
  const event = !S.injury && Math.random() < .3 ? pick(EVENTS).id : null;
  const mini = !S.injury && Math.random() < (event ? .2 : .4) ? pick(Object.keys(MINIS)) : null;
  let needs, text, rumor = false;
  if (S.injury){ needs = ['rest']; text = '🤕 부상 부위가 아직 욱신거린다.'; }
  else {
    const opp = curFx().opp, c = [];
    for (const [n, t] of STYLE_SIT[CLUB[opp].sty || 'press']) c.push([1.5, n, '🔎 ' + t.replace('{opp}', opp)]);
    if (S.cond < 50) c.push([2.5, ['rest'], '🥵 계단을 오를 때 허벅지가 묵직하다.']);
    if (S.trust < 40) c.push([2, ['talk'], '🤔 전술 미팅에서 내 자리가 비어 있었다.']);
    if (S.pop < 25) c.push([1, ['fan'], '📉 유니폼 판매 순위에서 내 이름을 찾을 수 없다.']);
    if (S.prev && S.prev.mins && S.prev.rating < 6) c.push([2, S.pos === 'GK' || S.pos === 'DF' ? ['def'] : ['sho'], '😤 지난 경기 하이라이트를 끝까지 못 봤다.']);
    const ev = pick(EVENT_SIT); c.push([2, ev[0], ev[1]]);
    [, needs, text] = wpick(c);
    if (Math.random() < .22){ // 소문: 보이는 문장이 실제 상황과 다를 수 있다
      rumor = true;
      const decoy = pick(EVENT_SIT);
      if (Math.random() < .6){ text = decoy[1]; needs = shuffle(ACT_IDS.filter(a => !decoy[0].includes(a))).slice(0, 1); }
    }
  }
  S.buff = r2(clamp(S.buff + FORTUNES[fortune][4], -1, 1));
  if (mgr().volatile) S.mood = ri(-2, 2);
  return {needs, text, rumor, fortune, revealed:false, event, eventRes:null, mini, miniDone:false};
}

function modal(inner){
  const el = document.createElement('div'); el.className = 'modal'; el.innerHTML = `<div class="modal-card">${inner}</div>`;
  document.body.appendChild(el);
  el.close = () => new Promise(res => { el.classList.add('out'); setTimeout(() => { el.remove(); res(); }, RM ? 0 : 220); });
  return el;
}
function typeIn(el, text, speed = 24){
  return new Promise(res => {
    if (!el) return res();
    const chars = [...text];
    if (RM){ el.textContent = text; return res(); }
    let i = 0, skip = false; el.textContent = '';
    const host = el.closest('.dlg, .modal-card') || el;
    const onSkip = () => { skip = true; };
    host.addEventListener('click', onSkip);
    const tick = () => {
      if (skip || i >= chars.length){ el.textContent = text; host.removeEventListener('click', onSkip); return res(); }
      el.textContent += chars[i++]; if (i % 3 === 0) SFX.type();
      setTimeout(tick, speed);
    };
    tick();
  });
}

function growth(age){ return age <= 21 ? 2.2 : age <= 24 ? 1.7 : age <= 28 ? 1.1 : age <= 31 ? .6 : .3; }
async function doAction(id){
  if (S.phase !== 'week') return;
  if (S.week.event && !S.week.eventRes){ showEvent(); return; }
  if (S.week.mini && !S.week.miniDone){ showMini(); return; }
  root.querySelectorAll('.act').forEach(b => b.disabled = true);
  const hit = S.week.needs.includes(id), msgs = [];
  let special = null;
  const youth = mgr().youth && S.age <= 23 ? 1.2 : 1;
  if (STAT_KEYS.includes(id)){
    if (S.cond < 35 && !hit && Math.random() < .25){
      S.injury = ri(1, 2); S.cond = clamp(S.cond - 10, 0, 100);
      msgs.push(`🤕 무리한 훈련으로 부상! ${S.injury}주 결장`); addNews(`${S.name}, 훈련 중 부상… ${S.injury}주 결장 예상`);
    } else {
      const g = growth(S.age) * youth * (S.cond / 100) * clamp((99 - S.stats[id]) / 40, .15, 1) * rand(.6, 1.5);
      let gain = Math.max(0, Math.round(g));
      if (hit) gain = Math.max(1, Math.round(gain * 1.5));
      S.stats[id] = clamp(S.stats[id] + gain, 1, 99); S.cond = clamp(S.cond - 10, 0, 100);
      msgs.push(gain ? `${statName(id, S.pos)} +${gain}!` : `${statName(id, S.pos)} 훈련… 이번엔 성과 없음`);
    }
  } else if (id === 'rest'){
    const g = 25 + (hasT('rest') ? 10 : 0) + (hit ? 10 : 0);
    S.cond = clamp(S.cond + g, 0, 100); if (hit && S.injury) S.injury--;
    msgs.push(`푹 쉬었다. 컨디션 +${g}`);
  } else if (id === 'fan'){
    const g = ri(3, 6) + (hasT('fan') ? 3 : 0) + (hit ? 3 : 0);
    S.pop = clamp(S.pop + g, 0, 100); S.cond = clamp(S.cond - 5, 0, 100); msgs.push(`팬 미팅 대성공! 인기도 +${g}`);
  } else if (id === 'talk'){
    const ok = Math.random() < .45 + S.trust / 200 + S.mood * .06 + (hit ? .2 : 0) + (hasT('talk') ? .05 : 0);
    const d = ok ? ri(3, 7) : -ri(2, 5); S.trust = clamp(S.trust + d, 0, 100);
    msgs.push(ok ? `${mgrName()} 감독: "네 열정은 알겠다." 신뢰 +${d}` : `${mgrName()} 감독: "말보다 실력으로 보여줘." 신뢰 ${d}`);
  }
  if (hit){
    S.buff = r2(clamp(S.buff + .2, -1, 1)); msgs.unshift('🎯 상황 적중!');
    const roll = Math.random();
    if (roll < .04) special = {i:'🌟', t:'잠재력 개방!', d:'모든 능력치 +1', go(){ STAT_KEYS.forEach(k => S.stats[k] = clamp(S.stats[k] + 1, 1, 99)); addNews(`${S.name}, 훈련장서 한 단계 성장… 코치진 감탄`); }};
    else if (roll < .22) special = pickSpecial(id);
    if (special) special.go();
  }
  S.pending = simulate(); S.phase = 'match'; save();
  if (hit) SFX.good();
  toast(msgs.join(' · '));
  if (special) await showSpecial(special); else await wait(800);
  playMatch();
}
function pickSpecial(id){

  if (TRAITS[id] && !hasT(id)) opts.push([3, {i:TRAITS[id].i, t:`특성 획득: ${TRAITS[id].n}`, d:TRAITS[id].d, go(){ S.traits.push(id); addNews(`${S.name}, 새 무기 장착… '${TRAITS[id].n}' 면모 과시`); }}]);

  opts.push([1, {i:'💚', t:'최상의 몸 상태', d:'컨디션 100 회복', go(){ S.cond = 100; }}]);

// ---------- 경기 시뮬레이션 ----------
// 무작위 부분은 미리 굴려 저장한다(새로고침으로 다시 굴릴 수 없게). 페널티킥만 플레이어 선택으로 결정.
function startChance(ovr){
  const M = mgr(), t = CLUB[S.club].t;
  let p = .46 + (S.pos === 'GK' ? .1 : 0) + (ovr - 55) / 35 * (t === 'tactician' ? 1.3 : 1) + (S.trust - 50) / 120 * (t === 'charisma' ? 1.8 : t === 'tactician' ? .5 : 1)
        + (S.cond - 60) / 250 - (CLUB[S.club].s - 70) / 60 + S.mood * (M.volatile ? .06 : .03) + (hasT('talk') ? .1 : 0);
  if (t === 'showman') p += (S.pop - 30) / 200;
  if (M.youth) p += S.age <= 23 ? .12 : -.03;
  return clamp(p, .05, .97);
}
function simulate(){
  const fxx = curFx(), opp = fxx.opp, home = fxx.home, P = POS[S.pos], ovr = ovrOf(S.stats, S.pos);
  let role = 'bench', from = 91;
  if (S.injury) role = 'injured';
  else if (S.cond >= 15 && Math.random() < startChance(ovr) + (fxx.k === 'C' && fxx.stage !== '결승' ? .1 : 0)){ role = 'start'; from = 0; }
  else if (Math.random() < .72 && S.pos !== 'GK'){ role = 'sub'; from = ri(50, 78); }
  const mins = role === 'start' ? 90 : role === 'sub' ? 90 - from : 0;
  const myImpact = mins ? (ovr - 62) * .25 * (mins / 90) * (S.cond / 100 + .3) : 0;
  const ts = CLUB[S.club].s + myImpact + (home ? 2 : -2), os = CLUB[opp].s;
  const lt = 1.35 * Math.pow(ts / os, 2.4);
  let lo = 1.35 * Math.pow(os / ts, 2.4);
  if (mins && (S.pos === 'GK' || S.pos === 'DF')) lo *= clamp(1 - (ovr - 55) / 160, .6, 1.1);
  if (mins && hasT('def')) lo *= .9;
  const tg = Math.min(7, poisson(lt)), og = Math.min(7, poisson(lo));
  const ev = [], sk = clamp(ovr / 65, .6, 1.6);
  for (let i = 0; i < tg; i++){
    const m = ri(1, 90), on = m >= from;
    let who = 'team', ast = false;
    if (on && Math.random() < P.goalP * sk * (hasT('sho') ? 1.25 : 1)) who = 'me';
    else if (on && Math.random() < P.astP * sk * (hasT('pas') ? 1.3 : 1)) ast = true;
    ev.push({m, side:'us', who, ast});
  }
  for (let i = 0; i < og; i++) ev.push({m: ri(1, 90), side:'them'});
  if (role === 'sub') ev.push({m: from, side:'sub'});
  const onPitch = () => ri(Math.max(from, 5), 88);
  if (mins && (S.pos === 'FW' || S.pos === 'MF') && Math.random() < .14) ev.push({m: onPitch(), side:'pk', dir: wpick([[.4,0],[.2,1],[.4,2]])[1], roll: Math.random()});
  if (mins && S.pos === 'GK' && Math.random() < .14) ev.push({m: onPitch(), side:'opk', dir: wpick([[.42,0],[.16,1],[.42,2]])[1], roll: Math.random()});
  if (mins && S.pos !== 'GK' && Math.random() < .22) ev.push({m: onPitch(), side:'post'});
  if (mins && Math.random() < .1) ev.push({m: onPitch(), side:'yellow'});
  if (Math.random() < .14) ev.push({m: ri(10, 88), side:'var'});
  if (Math.random() < .06) ev.push({m: ri(30, 85), side:'red'});
  ev.sort((a, b) => a.m - b.m);
  return {opp, home, role, from, mins, tg, og, ev, noise: rand(-.7, .7), buff: S.buff, ovr, fx:{k:fxx.k, comp:fxx.comp || '', stage:fxx.stage || ''}, so: fxx.k !== 'L' ? genSo() : null};
}
function finalize(p){
  let tg = p.tg, og = p.og, goals = 0, assists = 0, bonus = 0;
  for (const e of p.ev){
    if (e.side === 'us'){ if (e.who === 'me') goals++; if (e.ast) assists++; }
    if (e.side === 'pk'){ if (e.res){ tg++; goals++; } else bonus -= .4; }
    if (e.side === 'opk'){ if (e.res) bonus += .8; else og++; }
    if (e.side === 'post') bonus += .1;
    if (e.side === 'yellow') bonus -= .2;
  }
  const res = tg > og ? 'W' : tg < og ? 'L' : 'D';
  let rating = null;
  if (p.mins){
    rating = 6.0 + (p.ovr - 62) * .035 + (S.cond - 70) * .01 + goals * .9 + assists * .55 + (res === 'W' ? .35 : res === 'L' ? -.35 : 0) + p.noise + p.buff + (hasT('dri') ? .2 : 0) + bonus;
    if (S.pos === 'GK' || S.pos === 'DF') rating += og === 0 ? .7 : -og * .2;
    if (p.role === 'sub') rating = 6 + (rating - 6) * .7;
    rating = Math.round(clamp(rating, 3, 10) * 10) / 10;
  }
  return {opp:p.opp, home:p.home, role:p.role, from:p.from, mins:p.mins, tg, og, goals, assists, res, rating, fx:p.fx, cs: !!(p.mins && og === 0 && (S.pos === 'GK' || S.pos === 'DF'))};
}
function applyMatch(r){
  const se = S.season; se[r.res]++; se.results[S.round] = r.res;
  const fx = [];
  if (r.mins){
    se.apps++; if (r.role === 'start') se.starts++;
    se.goals += r.goals; se.assists += r.assists; se.ratings.push(r.rating); if (r.cs) se.cs++;
    const dp = r.goals * 2 + r.assists + (r.rating >= 8 ? 3 : r.rating >= 7 ? 1 : r.rating < 5.5 ? -2 : 0) + (r.res === 'W' ? 1 : 0);
    const dt = r.rating >= 7.5 ? 3 : r.rating >= 6.5 ? 1 : r.rating < 5.5 ? -3 : 0;
    fx.push(...applyFx({pop: dp, trust: dt, cond: Math.round((r.role === 'start' ? -12 : -5) * (hasT('phy') ? .5 : 1))}));
    S.best.rating = Math.max(S.best.rating, r.rating);
    if (r.goals >= 3) addNews(`🎩 ${S.name} 해트트릭! ${S.club}, ${r.opp}에 ${r.tg}-${r.og} 대승`);
    else if (r.goals === 2) addNews(`⚽⚽ ${S.name} 멀티골… ${S.club} ${r.tg}-${r.og} ${r.res === 'W' ? '승리' : r.res === 'D' ? '무승부' : '패배'}`);
    else if (r.rating >= 8.5) addNews(`⭐ 평점 ${r.rating}! ${S.name}, ${r.opp}전 최고의 선수`);
  } else if (r.role === 'injured'){ S.injury = Math.max(0, S.injury - 1); fx.push(...applyFx({cond: 15})); }
  else fx.push(...applyFx({cond: 8, pop: -1}));
  S.streak = S.streak.t === r.res ? {t:r.res, n:S.streak.n + 1} : {t:r.res, n:1};
  S.prev = {rating:r.rating || 0, goals:r.goals, mins:r.mins};
  S.media = clamp(S.media + ri(-1, 1), -2, 2);
  if (!mgr().volatile){ const dm = r.res === 'W' ? (Math.random() < .5 ? 1 : 0) : r.res === 'L' ? (Math.random() < .6 ? -1 : 0) : 0; S.mood = clamp(S.mood + dm + (Math.random() < .15 ? ri(-1, 1) : 0), -2, 2); }
  if (r.fx && r.fx.k !== 'L'){
    if (!r.adv){ S.out[r.fx.comp] = true; addNews(`${r.fx.comp} ${r.fx.stage} 탈락… ${S.club}, ${r.opp}에 무릎`); }

function countTo(el, to, dec){
  if (RM){ el.textContent = to.toFixed(dec); return; }
  const t0 = performance.now();

  requestAnimationFrame(f);
}

}

// ---------- 시즌 일정 · 대회 ----------
// 일정 = 리그 11경기 + 국내 컵(8강·4강·결승) + 리그 상위 3팀이면 대륙 대회(4강·결승). 컵에서 지면 남은 컵 경기는 건너뛴다.
function makeSeason(club){
  const lg = CLUB[club].lg, L = LEAGUES[lg], opps = leagueClubs(lg).filter(n => n !== club);
  let pool = []; while (pool.length < ROUNDS) pool = pool.concat(shuffle(opps));
  const fx = pool.slice(0, ROUNDS).map((opp, i) => ({k:'L', opp, home: i % 2 === 0, lr: i + 1}));
  const ins = (after, f) => { const i = fx.findIndex(x => x.k === 'L' && x.lr === after); fx.splice(i + 1, 0, f); };
  const cupOpps = shuffle(opps);
  ins(2, {k:'C', comp:L.cup, stage:'8강', opp:cupOpps[0], home:Math.random() < .5});
  ins(5, {k:'C', comp:L.cup, stage:'4강', opp:cupOpps[1], home:Math.random() < .5});
  ins(8, {k:'C', comp:L.cup, stage:'결승', opp:cupOpps[2], home:Math.random() < .5});
  const top = leagueClubs(lg).sort((a, b) => CLUB[b].s - CLUB[a].s).slice(0, 3);
  if (top.includes(club)){
    const pool2 = shuffle(lg === 'K' ? leagueClubs('AFC') : Object.keys(CLUB).filter(n => EURO.includes(CLUB[n].lg) && CLUB[n].lg !== lg && CLUB[n].s >= 84));
    ins(3, {k:'X', comp:L.cont, stage:'4강', opp:pool2[0], home:true});
    ins(9, {k:'X', comp:L.cont, stage:'결승', opp:pool2[1], home:Math.random() < .5});
  }
  return fx;
}
const curFx = () => S.schedule[S.round];
const fxLabel = f => !f ? '' : f.k === 'L' ? `${LEAGUES[CLUB[S.club].lg].f} ${LEAGUES[CLUB[S.club].lg].n} ${f.lr}R` : `${f.k === 'X' ? '⭐' : '🏆'} ${f.comp} ${f.stage}`;
function skipOut(){ while (S.round < S.schedule.length && S.schedule[S.round].k !== 'L' && S.out[S.schedule[S.round].comp]) S.round++; }
function nextFxIndex(){ let i = S.round + 1; while (i < S.schedule.length && S.schedule[i].k !== 'L' && S.out[S.schedule[i].comp]) i++; return i; }
function validFx(f){ return f && typeof f === 'object' && CLUB[f.opp] && ['L','C','X'].includes(f.k) && (f.k === 'L' ? Number.isFinite(f.lr) : typeof f.comp === 'string' && typeof f.stage === 'string'); }
function genSo(){ return {kd: Array.from({length:12}, () => wpick([[.4,0],[.2,1],[.4,2]])[1]), or: Array.from({length:12}, () => Math.random() < .74), roll: Array.from({length:12}, () => Math.random()), tb: Math.random() < .5}; }

// 승부차기: 내가 매번 방향을 고르고, 상대 키커 결과는 미리 정해져 있다
function shootout(p){
  if (p.soRes) return Promise.resolve(p.soRes);
  const so = p.so || genSo();
  return new Promise(res => {
    const el = modal(`<div class="eyebrow">🥅 승부차기</div><h3>${esc(S.club)} vs ${esc(p.opp)}</h3>
      <div class="so"><div><b>우리</b><span id="soU"></span></div><div><b>상대</b><span id="soT"></span></div></div>
      <div class="goalbox"><span class="keeper" id="kp">🧤</span><span class="pkball" id="pb">⚽</span></div>
      <div class="pk-btns">${['⬅ 왼쪽','⬆ 가운데','오른쪽 ➡'].map((t, i) => `<button class="btn hot sm" type="button" data-d="${i}">${t}</button>`).join('')}</div>
      <div id="sor" style="margin-top:10px;min-height:40px"></div>`);
    const U = [], T = [];
    const dots = a => Array.from({length: Math.max(5, a.length)}, (_, i) => i < a.length ? (a[i] ? '🟢' : '🔴') : '⚪').join('');
    const draw = () => { el.querySelector('#soU').textContent = dots(U); el.querySelector('#soT').textContent = dots(T); };
    draw(); SFX.whistle();
    const decided = () => {
      const us = U.filter(Boolean).length, th = T.filter(Boolean).length, n = U.length;
      if (n < 5) return us > th + (5 - n) || th > us + (5 - n);
      return n === T.length && us !== th || n >= 12;
    };
    el.querySelectorAll('.pk-btns button').forEach(b => b.onclick = async () => {
      const i = U.length; if (i >= 12) return;
      el.querySelectorAll('.pk-btns button').forEach(x => x.disabled = true);
      const d = Number(b.dataset.d), kd = so.kd[i], X = ['20%','50%','80%'];
      const kp = el.querySelector('#kp'), pb = el.querySelector('#pb');
      kp.className = 'keeper'; pb.className = 'pkball'; kp.style.left = '50%'; pb.style.left = '50%'; pb.style.top = '110%';
      await wait(60);
      const miss = so.roll[i] < clamp(.2 - (S.stats.sho - 50) / 220, .04, .25), ok = !miss && d !== kd;
      kp.style.left = X[kd]; kp.className = 'keeper d' + kd; pb.style.left = X[d]; pb.style.top = miss ? '-30%' : '40%'; pb.classList.add('shot');
      await wait(600); U.push(ok); draw(); ok ? SFX.goal() : SFX.bad();
      el.querySelector('#sor').innerHTML = `<div class="disp" style="font-size:22px;color:${ok ? 'var(--up)' : 'var(--down)'}">${ok ? '골!' : '막혔다…'}</div>`;
      await wait(700);
      if (!decided()){ T.push(so.or[i]); draw(); el.querySelector('#sor').innerHTML = `<div class="disp" style="font-size:22px;color:${so.or[i] ? 'var(--down)' : 'var(--up)'}">상대 ${so.or[i] ? '성공' : '실축!'}</div>`; await wait(800); }
      if (decided()){
        const us = U.filter(Boolean).length, th = T.filter(Boolean).length, won = us === th ? so.tb : us > th;
        el.querySelector('#sor').innerHTML = `<div class="disp" style="font-size:30px;color:${won ? 'var(--up)' : 'var(--down)'}">${us} : ${th} ${won ? '승리!' : '패배…'}</div>`;
        if (won) confetti(['#ffc83d','#fff']);
        await wait(1500); await el.close(); return res({us, them: th, won});
      }
      el.querySelectorAll('.pk-btns button').forEach(x => x.disabled = false);
    });
  });
}

function scoutCheck(r){
  if (!r.mins || r.rating < 7.2 || Math.random() > .32) return null;
  const ovr = ovrOf(S.stats, S.pos), cur = CLUB[S.club].lg;
  const cand = ['K', ...EURO].filter(l => l !== cur && leagueClubs(l).some(c => CLUB[c].s <= ovr + 16 + S.pop / 8));
  if (!cand.length) return null;
  const lg = pick(cand), club = pick(leagueClubs(lg).filter(c => CLUB[c].s <= ovr + 16 + S.pop / 8));
  S.scout[lg] = clamp((S.scout[lg] || 0) + 1, 0, 9);
  addNews(`🔭 ${LEAGUES[lg].f} ${club} 스카우트가 ${S.name}의 경기를 지켜봤다`);
  return `🔭 ${club} 스카우트 관심`;
}
function makeOffers(base, winter){
  const ovr = ovrOf(S.stats, S.pos), cur = CLUB[S.club].lg;
  const interest = EURO.concat('K').reduce((s, l) => s + (S.scout[l] || 0), 0);
  let p = clamp(.12 + (ovr - 58) / 60 + S.pop / 250 + interest * .05, .05, .75);
  if (winter) p *= .6;
  if (Math.random() >= p) return [];
  const cap = ovr + 12 + S.pop / 10;
  const cand = Object.keys(CLUB).filter(c => c !== S.club && CLUB[c].lg !== 'AFC' && CLUB[c].s <= cap + 2 * (S.scout[CLUB[c].lg] || 0));
  if (!cand.length) return [];
  const picks = [], n = Math.random() < .35 ? 2 : 1;
  for (let i = 0; i < n && cand.length; i++){
    const [, c] = wpick(cand.filter(x => !picks.includes(x)).map(x => [Math.pow(CLUB[x].s - 60, 2) * (1 + (S.scout[CLUB[x].lg] || 0)) * (LEAGUES[CLUB[x].lg].pay >= LEAGUES[cur].pay * .7 ? 1 : .08), x]));
    if (c) picks.push(c);
  }
  return picks.map(c => ({club:c, salary: Math.max(MIN_SALARY, Math.round(base * LEAGUES[CLUB[c].lg].pay / LEAGUES[cur].pay * rand(1.05, 1.5) * (CLUB[c].w === 'rich' ? 1.15 : CLUB[c].w === 'poor' ? .9 : 1) / 100) * 100)}));
}
const offerCard = (o, i) => `<div class="offer">${crest(o.club, 'lg')}<div style="min-width:0"><b>${LEAGUES[CLUB[o.club].lg].f} ${esc(o.club)}</b><small>${esc(LEAGUES[CLUB[o.club].lg].n)} · 전력 ${CLUB[o.club].s} · ${MGR[CLUB[o.club].t].i} ${esc(CLUB[o.club].m)} 감독(${MGR[CLUB[o.club].t].n})<br>제시 연봉 <b style="display:inline;color:var(--gold)">${money(o.salary)}</b></small></div><button class="btn cyan sm" type="button" data-o="${i}">이적</button></div>`;
function renderWindow(){
  const w = S.window;
  frame(`
    <div class="label">❄️ 겨울 이적시장</div>
    <div class="speech">📞 에이전트: "시즌 중이지만 제안이 들어왔어. 잘 생각해 봐."</div>
    <div class="panel pad stack">${w.offers.map(offerCard).join('')}
      <p class="small muted" style="margin:0">이적하면 남은 리그 경기를 새 팀에서 뛰고, 이번 시즌 컵 대회는 더 이상 나가지 못해요.</p>
      <button class="btn dark block" id="stay" type="button">🏠 잔류한다 (감독 신뢰 +3)</button></div>`, false);
  $('#stay').onclick = () => { S.trust = clamp(S.trust + 3, 0, 100); addNews(`${S.name}, 이적설 일축… "${S.club}에서 끝까지"`); S.window = null; S.phase = 'week'; UI.splash = true; go(); };
  root.querySelectorAll('.offer button').forEach(b => b.onclick = () => transferMid(w.offers[Number(b.dataset.o)]));
}
function transferMid(o){
  const old = S.club;
  addNews(`[오피셜] ${S.name}, 시즌 도중 ${old} → ${o.club} 이적! 연봉 ${money(o.salary)}`);
  S.club = o.club; S.salary = o.salary; S.best.salary = Math.max(S.best.salary, o.salary); S.trust = 45; S.mood = 0; S.scout[CLUB[o.club].lg] = 0;
  const played = S.schedule.slice(0, S.round).filter(f => f.k === 'L').length;
  S.schedule = S.schedule.slice(0, S.round).concat(makeSeason(o.club).filter(f => f.k === 'L' && f.lr > played));
  S.window = null; S.week = null; S.phase = 'week'; UI.splash = true; UI.tab = 'match';
  SFX.coin(); toast(`${LEAGUES[CLUB[o.club].lg].f} ${o.club} 입단!`); go();
}
function worldNews(){
  if (Math.random() > .4) return;
  const lg = pick(EURO), [a, b] = shuffle(leagueClubs(lg));
  const x = poisson(1.5), y = poisson(1.2);
  addNews(`${LEAGUES[lg].f} [${LEAGUES[lg].n}] ${a} ${x}-${y} ${b}`);
}
function radar(){
  const cx = 120, cy = 112, R = 84, n = STAT_KEYS.length;
  const pt = (i, v) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + Math.cos(a) * R * v, cy + Math.sin(a) * R * v]; };
  const poly = v => STAT_KEYS.map((_, i) => pt(i, v(i)).map(x => x.toFixed(1)).join(',')).join(' ');
  return `<svg class="radar" viewBox="0 0 240 230" role="img" aria-label="능력치 레이더">
    ${[.25,.5,.75,1].map(s => `<polygon points="${poly(() => s)}" fill="none" stroke="var(--edge)" stroke-width="1.5"/>`).join('')}
    ${STAT_KEYS.map((_, i) => { const [x, y] = pt(i, 1); return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--edge)" stroke-width="1"/>`; }).join('')}
    <polygon class="radar-fill" points="${poly(i => S.stats[STAT_KEYS[i]] / 100)}" fill="rgba(255,200,61,.35)" stroke="var(--gold)" stroke-width="2.5"/>
    ${STAT_KEYS.map((k, i) => { const [x, y] = pt(i, 1.2); return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" fill="var(--ink)" font-size="12" font-weight="700">${statName(k, S.pos)} <tspan fill="var(--gold)">${S.stats[k]}</tspan></text>`; }).join('')}
  </svg>`;
}
function worldTab(){
  const cur = CLUB[S.club].lg;
  return `<div class="label">🌍 세계 리그</div>` + ['K', ...EURO].map(l => {
    const L = LEAGUES[l], cl = leagueClubs(l).sort((a, b) => CLUB[b].s - CLUB[a].s), avg = Math.round(cl.reduce((s, c) => s + CLUB[c].s, 0) / cl.length);
    const sc = S.scout[l] || 0;
    return `<div class="panel pad league ${l === cur ? 'mine' : ''}">
      <div class="lg-head"><span class="lg-flag">${L.f}</span><div style="min-width:0"><b>${L.n}</b><small>평균 전력 ${avg} · 연봉 수준 ×${L.pay} · 🏆 ${esc(L.cup)}</small></div>${l === cur ? '<span class="tag gold">소속</span>' : ''}</div>
      <div class="lg-clubs">${cl.slice(0, 4).map(c => `<span>${crest(c)}<em>${esc(c)}</em><b>${CLUB[c].s}</b></span>`).join('')}</div>
      ${l !== cur ? `<div class="small muted">🔭 스카우트 관심 ${sc ? '🟡'.repeat(Math.min(sc, 5)) : '아직 없음'}</div>` : ''}
    </div>`;
  }).join('');
}

// ---------- 연출 ----------
function shake(){ if (RM) return; root.classList.remove('shake'); void root.offsetWidth; root.classList.add('shake'); }
function roundSplash(){
  if (RM) return;
  const f = curFx(); if (!f) return;
  const el = document.createElement('div'); el.className = 'splash' + (f.k !== 'L' ? ' cup' : '');
  el.innerHTML = `<div class="band">${crest(S.club, 'lg')}<div><b>${f.k === 'L' ? `ROUND ${f.lr}` : esc(f.stage)}</b><small>${f.k === 'L' ? '' : esc(f.comp) + ' · '}VS ${esc(f.opp)}</small></div>${crest(f.opp, 'lg')}</div>`;
  document.body.appendChild(el); SFX.whistle(); setTimeout(() => el.remove(), 1650);
}

function flash(text){
  if (RM) return;
  const el = document.createElement('div'); el.className = 'flashfx'; el.innerHTML = `<b>${esc(text)}</b>`;
  document.body.appendChild(el); setTimeout(() => el.remove(), 1300);
}
function confetti(colors){
  if (RM) return;
  const cv = $('#confetti'), ctx = cv.getContext('2d'), dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const ps = Array.from({length: 130}, () => ({x: innerWidth / 2 + rand(-60, 60), y: innerHeight * .45, vx: rand(-8, 8), vy: rand(-16, -5), g: rand(.35, .5),
    w: rand(6, 12), h: rand(8, 16), r: rand(0, 6), vr: rand(-.2, .2), c: pick(colors), ball: Math.random() < .07}));
  const t0 = performance.now();
  const tick = now => {
    const t = now - t0; ctx.clearRect(0, 0, innerWidth, innerHeight); ctx.globalAlpha = Math.max(0, 1 - Math.max(0, t - 1600) / 600);
    for (const p of ps){ p.vy += p.g; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      if (p.ball){ ctx.font = '18px sans-serif'; ctx.fillText('⚽', -9, 6); } else { ctx.fillStyle = p.c; ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h * Math.abs(Math.cos(p.r * 2))); }
      ctx.restore(); }
    if (t < 2200) requestAnimationFrame(tick); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  };
  requestAnimationFrame(tick);
}

renderTitle();
})();
</script>
