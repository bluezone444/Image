/* ---------- 2D 치비 선수 ---------- */
.chibi-host{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:34px 12px 46px;cursor:pointer;transition:transform .17s ease-in;-webkit-tap-highlight-color:transparent}
.chibi-host.turn{transform:scaleX(0)}
.viewer.sm .chibi-host{padding:12px 12px 8px}
.viewer.hero .chibi-host{padding:10px 0 4px}
.chibi{width:100%;height:100%;max-width:300px;overflow:visible;filter:drop-shadow(0 8px 14px rgba(0,0,0,.35))}
.chibi .whole{transform-box:view-box;transform-origin:100px 246px;animation:cbBreath 3s ease-in-out infinite}
.chibi .head{transform-box:fill-box;transform-origin:50% 92%;animation:cbHead 3.4s ease-in-out infinite}
.chibi .eyes{transform-box:fill-box;transform-origin:50% 60%;animation:cbBlink 5.6s infinite}
.chibi .armL,.chibi .armR,.chibi .legL,.chibi .legR{transform-box:fill-box;transform-origin:50% 4%}
.chibi .armL{transform:rotate(12deg)} .chibi .armR{transform:rotate(-12deg)}
.chibi .ball-r{transform-box:fill-box;transform-origin:center}
.chibi .shadow{transform-box:fill-box;transform-origin:center}
.b11-pic .fsh,.mate-face .fsh,.pf .fsh,.si-prev .fsh,.hof-face .fsh,.iso .fsh{display:none}
/* 기본: 숨쉬기 · 고개 까딱 · 눈 깜빡임(가끔 두 번) · 팔 흔들림 */
.chibi .armL{animation:cbArmIdleL 3s ease-in-out infinite} .chibi .armR{animation:cbArmIdleR 3s ease-in-out infinite}
@keyframes cbBreath{0%,100%{transform:scale(1,1)}50%{transform:scale(.992,1.016)}}
@keyframes cbHead{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes cbBlink{0%,38%,42%,84%,88%,92%,100%{transform:scaleY(1)}40%,86%,90%{transform:scaleY(.08)}}
@keyframes cbArmIdleL{0%,100%{transform:rotate(12deg)}50%{transform:rotate(8deg)}}
@keyframes cbArmIdleR{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(-8deg)}}
/* 달리기: 한 걸음마다 착지(눌림) → 도약(늘어남) */
[data-cpose=run] .whole{animation:cbRun .5s linear infinite}
[data-cpose=run] .head{animation:cbHeadRun .5s ease-in-out infinite}
[data-cpose=run] .legL{animation:cbLegL .5s ease-in-out infinite}
[data-cpose=run] .legR{animation:cbLegR .5s ease-in-out infinite}
[data-cpose=run] .armL{animation:cbArm .5s ease-in-out infinite}
[data-cpose=run] .armR{animation:cbArm .5s ease-in-out infinite}
[data-cpose=run] .ball-r{animation:cbRoll .6s linear infinite}
[data-cpose=run] .shadow{animation:cbShadowRun .25s ease-in-out infinite}
@keyframes cbRun{0%,50%,100%{transform:translateY(0) rotate(5deg) scale(1.035,.965);animation-timing-function:cubic-bezier(.2,.7,.4,1)}25%,75%{transform:translateY(-7px) rotate(5deg) scale(.985,1.02);animation-timing-function:cubic-bezier(.6,0,.8,.3)}}
@keyframes cbHeadRun{0%,50%,100%{transform:rotate(-1deg) translateY(1.5px)}25%,75%{transform:rotate(1.5deg) translateY(-1px)}}
@keyframes cbLegL{0%,100%{transform:translateY(0) rotate(9deg)}50%{transform:translateY(-12px) rotate(-12deg)}}
@keyframes cbLegR{0%,100%{transform:translateY(-12px) rotate(12deg)}50%{transform:translateY(0) rotate(-9deg)}}
@keyframes cbArm{0%,100%{transform:rotate(-36deg)}50%{transform:rotate(36deg)}}
@keyframes cbRoll{to{transform:rotate(360deg)}}
@keyframes cbShadowRun{0%,100%{transform:scale(1);opacity:.28}50%{transform:scale(.82);opacity:.18}}
/* 박수: 빠르게 모았다가 튕겨 나온다 */
[data-cpose=clap] .armL{animation:cbClapL .4s infinite}
[data-cpose=clap] .armR{animation:cbClapR .4s infinite}
[data-cpose=clap] .whole{animation:cbHop .8s infinite}
[data-cpose=clap] .head{animation:cbHeadClap 1.6s ease-in-out infinite}
[data-cpose=clap] .shadow{animation:cbShadowHop .8s infinite}
@keyframes cbClapL{0%,100%{transform:rotate(-22deg);animation-timing-function:cubic-bezier(.6,0,.9,.4)}42%,54%{transform:rotate(-60deg);animation-timing-function:cubic-bezier(.2,.8,.3,1)}}
@keyframes cbClapR{0%,100%{transform:rotate(22deg);animation-timing-function:cubic-bezier(.6,0,.9,.4)}42%,54%{transform:rotate(60deg);animation-timing-function:cubic-bezier(.2,.8,.3,1)}}
@keyframes cbHop{0%,100%{transform:translateY(0) scale(1.03,.97);animation-timing-function:cubic-bezier(.2,.7,.4,1)}50%{transform:translateY(-6px) scale(.985,1.02);animation-timing-function:cubic-bezier(.6,0,.8,.3)}}
@keyframes cbHeadClap{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes cbShadowHop{0%,100%{transform:scale(1.04);opacity:.28}50%{transform:scale(.84);opacity:.18}}
/* 점프: 웅크림(예비 동작) → 쭉 뻗으며 도약 → 정점 → 착지 눌림 → 반동 */
[data-cpose=jump] .armL{transform:rotate(150deg)} [data-cpose=jump] .armR{transform:rotate(-150deg)}
[data-cpose=jump] .whole{animation:cbJump 1.05s infinite}
[data-cpose=jump] .armL{animation:cbJumpArmL 1.05s infinite} [data-cpose=jump] .armR{animation:cbJumpArmR 1.05s infinite}
[data-cpose=jump] .legL{animation:cbJumpLegL 1.05s infinite} [data-cpose=jump] .legR{animation:cbJumpLegR 1.05s infinite}
[data-cpose=jump] .head{animation:cbHeadJump 1.05s infinite}
[data-cpose=jump] .shadow{animation:cbShadow 1.05s infinite}
@keyframes cbJump{
  0%,100%{transform:translateY(0) scale(1,1);animation-timing-function:cubic-bezier(.3,0,.5,1)}
  15%{transform:translateY(0) scale(1.07,.9);animation-timing-function:cubic-bezier(.5,0,.8,.5)}
  25%{transform:translateY(-5px) scale(.93,1.09);animation-timing-function:cubic-bezier(.1,.6,.4,1)}
  50%{transform:translateY(-38px) scale(1,1);animation-timing-function:cubic-bezier(.6,0,.9,.4)}
  74%{transform:translateY(-4px) scale(.95,1.06);animation-timing-function:linear}
  81%{transform:translateY(0) scale(1.08,.89);animation-timing-function:cubic-bezier(.2,.8,.4,1)}
  91%{transform:translateY(0) scale(.98,1.03);animation-timing-function:ease-in-out}}
@keyframes cbJumpArmL{0%,100%{transform:rotate(18deg)}15%{transform:rotate(38deg);animation-timing-function:cubic-bezier(.5,0,.6,1)}28%{transform:rotate(152deg)}50%{transform:rotate(160deg)}72%{transform:rotate(144deg);animation-timing-function:ease-in}86%{transform:rotate(50deg)}}
@keyframes cbJumpArmR{0%,100%{transform:rotate(-18deg)}15%{transform:rotate(-38deg);animation-timing-function:cubic-bezier(.5,0,.6,1)}28%{transform:rotate(-152deg)}50%{transform:rotate(-160deg)}72%{transform:rotate(-144deg);animation-timing-function:ease-in}86%{transform:rotate(-50deg)}}

  });
  if (UI.splash){ UI.splash = false; roundSplash(); }
  const delay = RM ? 0 : (document.querySelector('.splash') ? 1400 : 450);
  if (UI.sacked){ const o = UI.sacked; UI.sacked = null; setTimeout(() => sackModal(o), delay); return; }
  if (ntPending() && !S.injury) setTimeout(showNT, delay);

}

function modal(inner){
  const el = document.createElement('div'); el.className = 'modal'; el.innerHTML = `<div class="modal-card">${inner}</div>`;
  document.body.appendChild(el);
  el.close = () => new Promise(res => { el.classList.add('out'); setTimeout(() => { el.remove(); res(); }, RM ? 0 : 220); });
  return el;
}
function typeIn(el, text, speed = 24){
  return new Promise(res => {
    if (!el) return res();
    const chars = [...text];
    if (RM){ el.textContent = text; return res(); }
    let i = 0, skip = false; el.textContent = ''; el.classList.add('typing');
    const host = el.closest('.dlg, .modal-card') || el;
    const onSkip = () => { skip = true; };
    host.addEventListener('click', onSkip);
    const tick = () => {
      if (skip || i >= chars.length){ el.classList.remove('typing'); el.textContent = text; host.removeEventListener('click', onSkip); return res(); }
      el.textContent += chars[i++]; if (i % 3 === 0) SFX.type();
      setTimeout(tick, speed);
    };
    tick();
  });
}

const trnPrice = k => Math.round(clamp(S.salary * TRN[k].pct, TRN[k].min, TRN[k].cap) / 10) * 10;
function makeTrn(){
  const ks = shuffle(Object.keys(TRN)).slice(0, 3);
  return {list: ks.map(k => ({k, price: trnPrice(k), out: wpick(TRN[k].out.map(([w, o]) => [w, o]))[1]})), done:false};
}
function cleanTrn(t){
  if (!t || !Array.isArray(t.list)) return null;
  const list = t.list.filter(x => x && TRN[x.k] && TRN_OUT[x.out] && TRN[x.k].out.some(o => o[1] === x.out)).slice(0, 3).map(x => ({k:x.k, price:int(x.price, 0, 1e7, TRN[x.k].min), out:x.out}));
  return list.length ? {list, done:!!t.done} : null;
}
// 능력치 순서: 0 주 능력치 · 1 두 번째 · 2 아무거나 · 3 피지컬. 99에 닿은 능력치는 다른 능력치로 돌린다.
function trnStat(slot){
  const order = STAT_KEYS.slice().sort((a, b) => (POS[S.pos].w[b] || 0) - (POS[S.pos].w[a] || 0));
  let k = slot === 0 ? order[0] : slot === 1 ? order[1] : slot === 3 ? 'phy' : pick(STAT_KEYS);
  if (S.stats[k] >= 99) k = order.find(x => S.stats[x] < 99) || k;
  return k;
}

function pkGame(e, onDecide){
  return new Promise(res => {
    const shoot = e.side === 'pk';
    const el = modal(`<div class="eyebrow">${shoot ? '⚽ PENALTY KICK' : '🧤 PENALTY SAVE'}</div><h3>${shoot ? '어디로 찰까?' : '어디로 몸을 날릴까?'}</h3>
      <div class="goalbox"><span class="keeper" id="kp">${shoot ? '🧤' : '🙆'}</span><span class="pkball" id="pb">⚽</span></div>
      <div class="pk-btns">${['⬅ 왼쪽','⬆ 가운데','오른쪽 ➡'].map((t, i) => `<button class="btn ${shoot ? 'hot' : 'cyan'} sm" type="button" data-d="${i}">${t}</button>`).join('')}</div>
      <div id="pkr" style="margin-top:12px;min-height:44px"></div>`);
    SFX.whistle();
    el.querySelectorAll('.pk-btns button').forEach(b => b.onclick = async () => {
      el.querySelectorAll('.pk-btns button').forEach(x => x.disabled = true);
      const d = Number(b.dataset.d), shotDir = shoot ? d : e.dir, keepDir = shoot ? e.dir : d;
      const X = ['20%','50%','80%'], kp = el.querySelector('#kp'), pb = el.querySelector('#pb');
      kp.style.left = X[keepDir]; kp.className = 'keeper d' + keepDir;
      let ok, txt;
      if (shoot){
        const miss = e.roll < clamp(.22 - (S.stats.sho - 50) / 200, .04, .3) * (1 - clamp(skm('pk'), 0, .9));
        ok = !miss && (shotDir !== keepDir || e.roll > 1 - skm('pk') * .3); txt = ok ? 'GOAL!!' : miss ? 'MISS… 하늘로' : 'SAVED…';
        pb.style.left = X[shotDir]; pb.style.top = miss ? '-30%' : '40%';
      } else {
        ok = shotDir === keepDir && e.roll < .8 + ((S.stats.def + S.stats.dri) / 2 - 60) / 200; txt = ok ? 'SAVED!!' : 'GOAL…';
        pb.style.left = X[shotDir]; pb.style.top = '40%';
      }
      if (onDecide) onDecide(ok); // 애니메이션 전에 저장: 새로고침으로 다시 차기 방지
      pb.classList.add('shot');
      await wait(650);
      el.querySelector('#pkr').innerHTML = `<div class="disp" style="font-size:34px;color:${ok ? 'var(--up)' : 'var(--down)'};animation:pop .4s ease both">${txt}</div>`;
      if (ok){ SFX.goal(); confetti(['#ffc83d','#fff']); } else SFX.bad();
      await wait(1300); await el.close(); res(ok);
    });
  });
}
function countTo(el, to, dec){
  if (RM){ el.textContent = to.toFixed(dec); return; }
  const t0 = performance.now();
  const f = now => { const p = Math.min(1, (now - t0) / 900), e = 1 - Math.pow(1 - p, 3); el.textContent = (to * e).toFixed(dec); if (p < 1) requestAnimationFrame(f); };
  requestAnimationFrame(f);
}

// ---------- 시즌 일정 · 대회 ----------
// 일정 = 리그 11경기 + 국내 컵(8강·4강·결승) + 리그 상위 3팀이면 대륙 대회(4강·결승). 컵에서 지면 남은 컵 경기는 건너뛴다.
function makeSeason(club){
  const lg = CLUB[club].lg, L = LEAGUES[lg], opps = leagueClubs(lg).filter(n => n !== club);
  let pool = []; while (pool.length < ROUNDS) pool = pool.concat(shuffle(opps));
  const fx = pool.slice(0, ROUNDS).map((opp, i) => ({k:'L', opp, home: i % 2 === 0, lr: i + 1}));
  const ins = (after, f) => { const i = fx.findIndex(x => x.k === 'L' && x.lr === after); fx.splice(i + 1, 0, f); };
  const cupOpps = shuffle(opps);
  ins(2, {k:'C', comp:L.cup, stage:'8강', opp:cupOpps[0], home:Math.random() < .5});
  ins(5, {k:'C', comp:L.cup, stage:'4강', opp:cupOpps[1], home:Math.random() < .5});
  ins(8, {k:'C', comp:L.cup, stage:'결승', opp:cupOpps[2], home:Math.random() < .5});
  const top = leagueClubs(lg).sort((a, b) => CLUB[b].s - CLUB[a].s).slice(0, 3);
  if (L.cont && top.includes(club)){
    const pool2 = shuffle(lg === 'K' ? leagueClubs('AFC').concat(leagueClubs('J1')) : lg === 'J1' ? leagueClubs('AFC').concat(leagueClubs('K')) : Object.keys(CLUB).filter(n => EURO.includes(CLUB[n].lg) && CLUB[n].lg !== lg && CLUB[n].s >= 84));
    ins(3, {k:'X', comp:L.cont, stage:'4강', opp:pool2[0], home:true});
    ins(9, {k:'X', comp:L.cont, stage:'결승', opp:pool2[1], home:Math.random() < .5});
  }
  return fx;
}
const curFx = () => S.schedule[S.round];
const fxLabel = f => !f ? '' : f.k === 'L' ? `${LEAGUES[CLUB[S.club].lg].f} ${LEAGUES[CLUB[S.club].lg].n} ${f.lr}R` : `${f.k === 'X' ? '⭐' : '🏆'} ${f.comp} ${f.stage}`;
function skipOut(){ while (S.round < S.schedule.length && S.schedule[S.round].k !== 'L' && S.out[S.schedule[S.round].comp]) S.round++; }
function nextFxIndex(){ let i = S.round + 1; while (i < S.schedule.length && S.schedule[i].k !== 'L' && S.out[S.schedule[i].comp]) i++; return i; }
function validFx(f){ return f && typeof f === 'object' && CLUB[f.opp] && ['L','C','X'].includes(f.k) && (f.k === 'L' ? Number.isFinite(f.lr) : typeof f.comp === 'string' && typeof f.stage === 'string'); }
function genSo(){ return {kd: Array.from({length:12}, () => wpick([[.4,0],[.2,1],[.4,2]])[1]), or: Array.from({length:12}, () => Math.random() < .74), roll: Array.from({length:12}, () => Math.random()), tb: Math.random() < .5}; }

// 승부차기: 내가 매번 방향을 고르고, 상대 키커 결과는 미리 정해져 있다
function shootout(p){
  if (p.soRes) return Promise.resolve(p.soRes);
  const so = p.so || (p.so = genSo());
  return new Promise(res => {
    const el = modal(`<div class="eyebrow">🥅 승부차기</div><h3>${esc(S.club)} vs ${esc(p.opp)}</h3>
      <div class="so"><div><b>우리</b><span id="soU"></span></div><div><b>상대</b><span id="soT"></span></div></div>
      <div class="goalbox"><span class="keeper" id="kp">🧤</span><span class="pkball" id="pb">⚽</span></div>
      <div class="pk-btns">${['⬅ 왼쪽','⬆ 가운데','오른쪽 ➡'].map((t, i) => `<button class="btn hot sm" type="button" data-d="${i}">${t}</button>`).join('')}</div>
      <div id="sor" style="margin-top:10px;min-height:40px"></div>`);
    // 진행 상황은 킥마다 저장한다 (새로고침해도 이미 찬 킥은 다시 찰 수 없다)
    const U = p.soProg ? [...p.soProg.U] : [], T = p.soProg ? [...p.soProg.T] : [];
    const dots = (a, n) => Array.from({length: Math.max(5, a.length)}, (_, i) => i < n ? (a[i] ? '🟢' : '🔴') : '⚪').join('');
    const draw = (nu = U.length, nt = T.length) => { el.querySelector('#soU').textContent = dots(U, nu); el.querySelector('#soT').textContent = dots(T, nt); };
    const decidedAt = (u, t) => {
      const us = u.filter(Boolean).length, th = t.filter(Boolean).length, n = u.length;
      if (n < 5) return us > th + (5 - n) || th > us + (5 - n);
      return n === t.length && us !== th || n >= 12;
    };
    const finish = async () => {
      const us = U.filter(Boolean).length, th = T.filter(Boolean).length, won = us === th ? so.tb : us > th;
      el.querySelector('#sor').innerHTML = `<div class="disp" style="font-size:30px;color:${won ? 'var(--up)' : 'var(--down)'}">${us} : ${th} ${won ? '승리!' : '패배…'}</div>`;
      if (won) confetti(['#ffc83d','#fff']);
      await wait(1500); await el.close(); res({us, them: th, won});
    };
    draw(); SFX.whistle();
    if (U.length && decidedAt(U, T)){ finish(); return; }
    el.querySelectorAll('.pk-btns button').forEach(b => b.onclick = async () => {
      const i = U.length; if (i >= 12) return;
      el.querySelectorAll('.pk-btns button').forEach(x => x.disabled = true);
      const d = Number(b.dataset.d), kd = so.kd[i], X = ['20%','50%','80%'];
      const miss = so.roll[i] < clamp(.2 - (S.stats.sho - 50) / 220, .04, .25), ok = !miss && d !== kd;
      U.push(ok); const oppKicks = !decidedAt(U, T); if (oppKicks) T.push(so.or[i]);
      p.soProg = {U:[...U], T:[...T]}; save();
      const kp = el.querySelector('#kp'), pb = el.querySelector('#pb');
      kp.className = 'keeper'; pb.className = 'pkball'; kp.style.left = '50%'; pb.style.left = '50%'; pb.style.top = '110%';
      await wait(60);
      kp.style.left = X[kd]; kp.className = 'keeper d' + kd; pb.style.left = X[d]; pb.style.top = miss ? '-30%' : '40%'; pb.classList.add('shot');
      await wait(600); draw(U.length, T.length - (oppKicks ? 1 : 0)); ok ? SFX.goal() : SFX.bad();
      el.querySelector('#sor').innerHTML = `<div class="disp" style="font-size:22px;color:${ok ? 'var(--up)' : 'var(--down)'}">${ok ? '골!' : '막혔다…'}</div>`;
      await wait(700);
      if (oppKicks){ draw(); const o = T[T.length - 1]; el.querySelector('#sor').innerHTML = `<div class="disp" style="font-size:22px;color:${o ? 'var(--down)' : 'var(--up)'}">상대 ${o ? '성공' : '실축!'}</div>`; await wait(800); }
      if (decidedAt(U, T)) return finish();
      el.querySelectorAll('.pk-btns button').forEach(x => x.disabled = false);
    });
  });
}

function scoutCheck(r){
  if (!r.mins || r.rating < 6.9 || Math.random() > .45) return null;
  const ovr = ovrOf(S.stats, S.pos), cur = CLUB[S.club].lg, cap = ovr + 16 + S.pop / 8;
  const ok = c => c !== S.club && CLUB[c].s <= cap;
  const cand = ALL_LG.filter(l => leagueClubs(l).some(ok));
  if (!cand.length) return null;
  const lg = wpick(cand.map(l => [l === cur ? 2.5 : (l === 'J1' || l === 'B2') ? 2 : 1, l]))[1], club = pick(leagueClubs(lg).filter(ok));
  S.scout[lg] = clamp((S.scout[lg] || 0) + 1, 0, 9);

function makeOffers(base, winter){
  const ovr = ovrOf(S.stats, S.pos), cur = CLUB[S.club].lg;
  const interest = ALL_LG.reduce((s, l) => s + (S.scout[l] || 0), 0);
  let p = clamp(.18 + (ovr - 58) / 60 + S.pop / 250 + interest * .06, .08, .8);
  if (winter) p *= .8;
  if (Math.random() >= p) return [];
  const cap = ovr + 12 + S.pop / 10;
  const cand = Object.keys(CLUB).filter(c => c !== S.club && CLUB[c].lg !== 'AFC' && CLUB[c].s <= cap + 2 * (S.scout[CLUB[c].lg] || 0));
  if (!cand.length) return [];
  const picks = [], n = Math.random() < .35 ? 2 : 1;
  for (let i = 0; i < n && cand.length; i++){
    const [, c] = wpick(cand.filter(x => !picks.includes(x)).map(x => [Math.pow(CLUB[x].s - 60, 2) * (1 + (S.scout[CLUB[x].lg] || 0)) * (LEAGUES[CLUB[x].lg].pay >= LEAGUES[cur].pay * .7 ? 1 : .08), x]));
    if (c) picks.push(c);
  }
  return picks.map(c => ({club:c, salary: Math.max(MIN_SALARY, Math.round(base * LEAGUES[CLUB[c].lg].pay / LEAGUES[cur].pay * rand(1.05, 1.5) * (CLUB[c].w === 'rich' ? 1.15 : CLUB[c].w === 'poor' ? .9 : 1) / 100) * 100)}));
}

const W_W = 320, W_H = 150, W_L = 44, W_R = 10, W_T = 10, W_B = 22;
function niceMax(v){ if (v <= 0) return 1000; const e = Math.pow(10, Math.floor(Math.log10(v))), f = v / e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e; }
function wealthChart(){
  const d = S.wl.length ? S.wl : [[0, 0, 1]], n = d.length, max = niceMax(Math.max(...d.map(x => x[0])) * 1.05);
  const X = i => W_L + (n > 1 ? i / (n - 1) : .5) * (W_W - W_L - W_R), Y = v => W_T + (1 - v / max) * (W_H - W_T - W_B);

  const last = d[n - 1];

    <defs><linearGradient id="wlFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--cyan)" stop-opacity=".35"/><stop offset="1" stop-color="var(--cyan)" stop-opacity="0"/></linearGradient></defs>
    ${grid}${seas}
    ${n > 1 ? `<path d="M${pts[0].split(',')[0]},${base} L${pts.join(' L')} L${X(n - 1).toFixed(1)},${base} Z" fill="url(#wlFill)"/><polyline points="${pts.join(' ')}" fill="none" stroke="var(--cyan)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` : ''}

    <g id="wlCross" style="display:none"><line y1="${W_T}" y2="${base}" class="wl-cross"/><circle r="4.5" fill="var(--cyan)" stroke="var(--panel)" stroke-width="2"/></g>
    <rect x="${W_L}" y="0" width="${W_W - W_L - W_R}" height="${W_H}" fill="transparent" id="wlHit"/></svg>`;
}
function bindWealth(){
  const box = $('#wlChart'), hit = $('#wlHit'), tip = $('#wlTip'), cr = $('#wlCross'); if (!box || !hit || S.wl.length < 2) return;
  const d = S.wl, n = d.length, max = niceMax(Math.max(...d.map(x => x[0])) * 1.05), svg = box.querySelector('svg');
  const show = e => {
    const r = svg.getBoundingClientRect(), sx = (e.clientX - r.left) / r.width * W_W;
    const i = clamp(Math.round((sx - W_L) / (W_W - W_L - W_R) * (n - 1)), 0, n - 1), x = W_L + i / (n - 1) * (W_W - W_L - W_R), y = W_T + (1 - d[i][0] / max) * (W_H - W_T - W_B);
    let wk = 0; for (let j = i; j >= 0 && d[j][2] === d[i][2]; j--) wk++;
    cr.style.display = ''; cr.querySelector('line').setAttribute('x1', x); cr.querySelector('line').setAttribute('x2', x); cr.querySelector('circle').setAttribute('cx', x); cr.querySelector('circle').setAttribute('cy', y);
    tip.hidden = false; tip.innerHTML = `<small>${d[i][2]}시즌 · ${wk === 1 && i === 0 ? '기록 시작' : `${wk}번째 기록`}</small><b>${money(d[i][0])}</b><span>현금 ${vfmt(d[i][1])} · 자산 ${vfmt(Math.max(0, d[i][0] - d[i][1]))}</span>`;
    const px = x / W_W * r.width; tip.style.left = clamp(px - tip.offsetWidth / 2, 0, r.width - tip.offsetWidth) + 'px';
  };

}

  for (const r of rowsOf){
    const w = r.nom[r.win];
    if (w && w.me) won.push(r.k);
    else if (r.k === 'ballon' && r.myR && r.myR <= 3) won.push('podium');

    if (r.k === 'puskas' && w) addNews(`✨ [푸스카스상] ${w.n} — ${w.s}`);
  }
  for (const k of won){
    const R = AW_RW[k];
    fx.push(...applyFx({pop:R.pop, trust:R.trust || 0}));
    const g = gainXp(R.xp); if (g) fx.push(g);
    if (R.offer && S.nego){ S.nego.offer = clamp(S.nego.offer + R.offer, -40, Math.max(S.nego.offer, 50)); S.nego.awBonus = (S.nego.awBonus || 0) + R.offer; }

  }

}

const OBJ = {
  apps:{f: s => s.season.apps}, goals:{f: s => s.season.goals}, assists:{f: s => s.season.assists}, cs:{f: s => s.season.cs},
  rating:{f: s => s.season.ratings.length ? s.season.ratings.reduce((a, b) => a + b, 0) / s.season.ratings.length : 0, dec:true},
  pop:{f: s => s.pop}, rank:{f: () => myRank(), lower:true},
};
const objLabel = o => ({apps:`${o.n}경기 이상 출전`, goals:`${o.n}골 이상`, assists:`${o.n}도움 이상`, cs:`클린시트 ${o.n}회 이상`, rating:`평균 평점 ${Number(o.n).toFixed(1)} 이상`, pop:`인기도 ${o.n} 달성`, rank:`리그 ${o.n}위 이내 마감`})[o.k];
function objMet(o){ const D = OBJ[o.k]; if (!D) return false; const v = D.f(S); return D.lower ? v > 0 && v <= o.n : v >= o.n; }
function makeObjectives(){
  const P = S.pos, lg = CLUB[S.club].lg, exp = leagueClubs(lg).sort((a, b) => CLUB[b].s - CLUB[a].s).indexOf(S.club) + 1;

  else if (P === 'MF') list.push(pick([{k:'assists', n: ri(3, 5)}, {k:'goals', n: ri(2, 4)}]));

  list.push(pick([{k:'rank', n: clamp(exp + 1, 1, leagueClubs(lg).length - 1)}, {k:'rating', n: 6.8}, {k:'pop', n: clamp(S.pop + 15, 20, 95)}]));
  return list;
}
function objHtml(){

const MGR_NAMES = {K:['이정훈','최동석','배성민','홍준영','안재욱','류승호'], J1:['마쓰모토 겐타','후지타 료','오카다 신지','하세가와 다쿠'], B2:['슈테판 크라머','토르스텐 링크','유르겐 바이스'],
  EPL:['데이비드 모건','폴 해리슨','스티븐 베이커'], LIGA:['알베르토 가르시아','호르헤 나바로','이반 모레노'], SA:['로베르토 콜롬보','다비데 마르케티','파비오 갈리'], BUN:['토마스 렌츠','크리스티안 포겔','마르틴 슐츠']};
let BASE_MGR = null;
function applyMgrs(){
  if (!BASE_MGR) BASE_MGR = Object.fromEntries(Object.keys(CLUB).map(c => [c, {m: CLUB[c].m, t: CLUB[c].t}]));
  for (const c in CLUB){ CLUB[c].m = BASE_MGR[c].m; CLUB[c].t = BASE_MGR[c].t; }
  if (S && S.mgrs) for (const [c, v] of Object.entries(S.mgrs)) if (CLUB[c]){ CLUB[c].m = v.m; CLUB[c].t = v.t; }
}
function replaceMgr(c){
  const used = new Set(Object.values(CLUB).map(x => x.m));
  let names = (MGR_NAMES[CLUB[c].lg] || MGR_NAMES.K).filter(x => !used.has(x));
  if (!names.length) names = ['신임 감독'];
  S.mgrs = S.mgrs || {}; S.mgrs[c] = {m: pick(names), t: pick(Object.keys(MGR).filter(t => t !== CLUB[c].t))}; applyMgrs();
}
// 리그 4·8라운드 뒤: 하위 2팀이면 50% 확률로 감독 경질, 다른 하위권 팀도 가끔 교체
function sackCheck(done){
  if (!done || done.k !== 'L' || ![4, 8].includes(done.lr)) return null;
  const rows = standings(), rk = rows.findIndex(r => r.c === S.club) + 1, n = rows.length;
  if (Math.random() < .3){ const c = pick(rows.slice(-3).map(r => r.c).filter(c => c !== S.club)); if (c){ replaceMgr(c); addNews(`🚨 ${c}, 성적 부진으로 감독 교체… ${CLUB[c].m} 감독 부임`); } }
  if (rk >= n - 1 && Math.random() < .5){ const old = mgrName(); replaceMgr(S.club); S.trust = 45; S.mood = 0; addNews(`🚨 ${S.club}, ${old} 감독 경질! ${mgrName()} 감독(${mgr().n}) 부임`); return old; }
  return null;
}
async function sackModal(old){

const CH = {sho:['target','슈팅','sho',.25], pas:['arrow-right-left','킬패스','pas',.38], dri:['wind','드리블 돌파','dri',.18]};
const chanceP = k => clamp(CH[k][3] + (S.stats[CH[k][2]] - 50) / 100 * .7 + ({sho:skm('csho'), dri:skm('cdri'), pas:skm('cpas')}[k] || 0), .08, .9);
function chanceGame(e){
  return new Promise(res => {
    const el = modal(`<div class="eyebrow">${ic('zap')} 결정적 순간 · ${e.m}'</div><h3>페널티 박스 앞, 공이 내 발에!</h3><p>어떻게 할까? 성공률은 내 능력치에 달렸다.</p>
      <div class="choice-list">${Object.entries(CH).map(([k, [icn, n, st]]) => { const pr = chanceP(k); return `<button class="btn dark block ch-btn" type="button" data-k="${k}">${ic(icn)} ${n}<small>${statName(st, S.pos)} ${S.stats[st]} · ${pr >= .55 ? '성공 가능성 높음' : pr >= .35 ? '보통' : '낮음'}</small></button>`; }).join('')}</div>
      <div id="chr" style="min-height:44px;margin-top:10px"></div>`);
    SFX.whistle();
    el.querySelectorAll('.ch-btn').forEach(b => b.onclick = async () => {
      if (e.kind) return;
      el.querySelectorAll('.ch-btn').forEach(x => x.disabled = true);
      const k = b.dataset.k; e.kind = k; e.res = e.roll < chanceP(k); if (e.res) S.rec.clutch = (S.rec.clutch || 0) + 1;
      save(); // 고르는 즉시 저장
      await wait(500);
      el.querySelector('#chr').innerHTML = `<div class="disp" style="font-size:30px;color:${e.res ? 'var(--up)' : 'var(--down)'};animation:pop .4s ease both">${e.res ? (k === 'pas' ? 'ASSIST!' : 'GOAL!!') : 'MISS…'}</div>`;
      if (e.res){ SFX.goal(); confetti(['#ffc83d','#fff']); } else SFX.bad();

}

// ---------- 리그 순위표 ----------
// 내 팀 경기는 실제 결과로, 나머지 팀 경기는 매 라운드 전력 기반으로 시뮬레이션한다.
function blankRow(){ return {p:0, w:0, d:0, l:0, gf:0, ga:0}; }
function addGame(t, a, b, x, y){
  if (!t[a] || !t[b]) return;
  const A = t[a], B = t[b]; A.p++; B.p++; A.gf += x; A.ga += y; B.gf += y; B.ga += x;
  if (x > y){ A.w++; B.l++; } else if (x < y){ A.l++; B.w++; } else { A.d++; B.d++; }
}
function simScore(a, b){ const sa = CLUB[a].s + 2, sb = CLUB[b].s; return [Math.min(7, poisson(1.35 * Math.pow(sa / sb, 2.4))), Math.min(7, poisson(1.35 * Math.pow(sb / sa, 2.4)))]; }
function simRound(our){
  const t = S.table.t;
  let pool = shuffle(Object.keys(t));
  if (our){ addGame(t, S.club, our.opp, our.tg, our.og); pool = pool.filter(c => c !== S.club && c !== our.opp); }
  for (let i = 0; i + 1 < pool.length; i += 2){ const [x, y] = simScore(pool[i], pool[i + 1]); addGame(t, pool[i], pool[i + 1], x, y); }
}
function ensureTable(){
  const lg = CLUB[S.club].lg;
  if (S.table && S.table.lg === lg && S.table.t[S.club]) return S.table;
  S.table = {lg, t: Object.fromEntries(leagueClubs(lg).map(c => [c, blankRow()]))};
  const played = S.schedule.slice(0, S.round).filter(f => f.k === 'L').length;
  for (let i = 0; i < played; i++) simRound(null);
  return S.table;
}
const pts = r => r.w * 3 + r.d;
function standings(){
  const t = ensureTable().t;
  return Object.keys(t).map(c => ({c, ...t[c], pts: pts(t[c]), gd: t[c].gf - t[c].ga}))
    .sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf || CLUB[b.c].s - CLUB[a.c].s);
}
const myRank = () => standings().findIndex(r => r.c === S.club) + 1;
function tableHtml(){
  const rows = standings(), n = rows.length, lg = CLUB[S.club].lg;
  const zone = i => i === 0 ? 'z-champ' : (LEAGUES[lg].cont && i < 3) ? 'z-cont' : i >= n - 2 ? 'z-down' : '';
  return `<div class="panel tbl"><table class="standings">
    <thead><tr><th>#</th><th class="l">구단</th><th class="gp">경기</th><th>승</th><th>무</th><th>패</th><th>득실</th><th>승점</th></tr></thead>
    <tbody>${rows.map((r, i) => `<tr class="${r.c === S.club ? 'me' : ''} ${zone(i)}"><td><span class="rk">${i + 1}</span></td><td class="l"><span class="tc">${crest(r.c)}<em>${esc(r.c)}</em></span></td><td class="gp">${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gd > 0 ? '+' : ''}${r.gd}</td><td><b>${r.pts}</b></td></tr>`).join('')}</tbody>
  </table></div>
  <div class="legend-z"><span><i class="z-champ"></i>우승</span>${LEAGUES[lg].cont ? `<span><i class="z-cont"></i>${esc(LEAGUES[lg].cont)} 진출권</span>` : ''}<span><i class="z-down"></i>하위권</span></div>`;
}

// ---------- 연출 ----------
function shake(){ if (RM) return; root.classList.remove('shake'); void root.offsetWidth; root.classList.add('shake'); }
function roundSplash(){
  if (RM) return;
  const f = curFx(); if (!f) return;

// 내 골 장면: 슛 궤적 → 골망 출렁 → 캐릭터 세리머니 (약 1.1초, 움직임 줄이기면 생략)
function goalReel(kind){

    <div class="gr-goal"><svg viewBox="0 0 90 80"><g class="gr-net" stroke="#fff" stroke-opacity=".45" stroke-width="1">${[1,2,3,4,5,6,7,8].map(i => `<path d="M${i * 10} 6v70"/>`).join('')}${[1,2,3,4,5,6].map(i => `<path d="M4 ${6 + i * 10}h82"/>`).join('')}</g><path d="M4 78V4h82v74" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round"/></svg></div>

function flash(text){

// 색종이: 여러 번 터져도 캔버스 하나·루프 하나를 같이 쓴다 (예전엔 두 번째가 첫 번째를 지웠다). 프레임 속도와 무관하게 같은 속도로 떨어진다.
const CF = {ps:[], on:false, w:0, h:0, last:0};
function confetti(colors){
  if (RM) return;
  const cv = $('#confetti'); if (!cv) return;
  const ctx = cv.getContext('2d'); if (!ctx) return;
  const dpr = Math.min(2, devicePixelRatio || 1), W = innerWidth, H = innerHeight;
  if (CF.w !== W || CF.h !== H || cv.width !== Math.round(W * dpr)){ cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); CF.w = W; CF.h = H; }
  const now = performance.now(), sp = Math.min(1, W / 420) * .35 + .65; // 좁은 화면에선 살짝 덜 퍼지게
  if (CF.ps.length > 200) CF.ps.splice(0, CF.ps.length - 200);
  for (let k = 0; k < 110; k++){
    const a = rand(-Math.PI * .92, -Math.PI * .08), v = rand(7, 19) * sp;
    CF.ps.push({x: W / 2 + rand(-50, 50), y: H * .45 + rand(-10, 10), vx: Math.cos(a) * v * .8, vy: Math.sin(a) * v, g: rand(.3, .46), w: rand(6, 12), h: rand(8, 15), r: rand(0, 6), vr: rand(-.22, .22),
      ph: rand(0, 6), sw: rand(.4, 1.3), c: pick(colors), ball: Math.random() < .06, t0: now, life: rand(1700, 2300)});
  }
  if (CF.on) return;
  CF.on = true; CF.last = now;
  const tick = t => {
    const dt = clamp((t - CF.last) / 16.67, 0, 3); CF.last = t;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, CF.w, CF.h);
    const drag = Math.pow(.985, dt);
    CF.ps = CF.ps.filter(p => t - p.t0 < p.life && p.y < CF.h + 30);
    for (const p of CF.ps){
      const age = t - p.t0;
      p.vy = Math.min(p.vy + p.g * dt, 9); p.vx *= drag; p.x += (p.vx + Math.sin(age / 190 + p.ph) * p.sw) * dt; p.y += p.vy * dt; p.r += p.vr * dt;
      ctx.globalAlpha = clamp((p.life - age) / 450, 0, 1);
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      if (p.ball){ ctx.font = '18px sans-serif'; ctx.fillText('⚽', -9, 6); } else { ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * (.25 + .75 * Math.abs(Math.cos(age / 130 + p.ph)))); }
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    if (CF.ps.length) requestAnimationFrame(tick); else { CF.on = false; ctx.clearRect(0, 0, CF.w, CF.h); }
  };
  requestAnimationFrame(tick);
}

renderTitle();
