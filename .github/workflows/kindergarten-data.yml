name: 하윤이 유치원 데이터

on:
  push:
    branches: [claude/childcare-facility-recommendations-ki5kfj]
    paths:
      - kindergarten/build.py
      - kindergarten/index.html
      - .github/workflows/kindergarten-data.yml
  workflow_dispatch:
  schedule:
    - cron: "17 21 * * 0"  # 매주 월요일 06:17 (한국시간)

permissions:
  contents: write

concurrency:
  group: kindergarten-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 데이터 내려받기 + hayoon.html 만들기
        run: python kindergarten/build.py
        env:
          NEIS_KEY: ${{ secrets.NEIS_KEY }}  # 저장소 Settings → Secrets → Actions 에 등록
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kindergarten/data.json kindergarten/hayoon.html kindergarten/geo_cache.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "Update kindergarten data"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
