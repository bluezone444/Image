name: Build ChargeLog APK

on:
  push:
    branches: [ccr-0314fce9-61kylr]
    paths: ['chargelog/**', '.github/workflows/chargelog-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chargelog
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: chargelog
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Download Gradle (retry on network errors)
        run: |
          for i in 1 2 3 4 5; do
            ./gradlew --no-daemon --version && exit 0
            sleep $((i * 10))
          done
          exit 1
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk ChargeLog-${{ env.VERSION_NAME }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ChargeLog-apk
          path: chargelog/ChargeLog-*.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "chargelog-v${VERSION_NAME}" ChargeLog-*.apk \
            --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" \
            --title "ChargeLog ${VERSION_NAME}" \
            --notes "Automated build of ${GITHUB_SHA}"
