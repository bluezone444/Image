name: 엄마 PICK 집중 수집 점검

on:
  push:
    branches: [claude/childcare-facility-recommendations-ki5kfj]
    paths:
      - kindergarten/probe.txt

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: kindergarten
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 4곳 집중 수집만 실행 (기록 확인용, 커밋 없음)
        run: python kindergarten/build.py --deep-only "--only=$(cat kindergarten/probe.txt | head -1)"
      - name: "유튜브 영상 정보·자막 (probe.txt에 yt 줄이 있을 때)"
        if: always()
        run: |
          if grep -q '^yt:' kindergarten/probe.txt; then
            pip install -q youtube-transcript-api
            python kindergarten/yt_probe.py
          fi
